\"Rota completa\" em baixo para a sequência toda."},{"titulo":"Rota completa sugerida: Novo Belgrado (Tito) → Kalemegdan → Cidade Velha","nota":"Em vez de ir direto a Kalemegdan às 09:00, uma rota cronológica de ~3h30-4h: Bloco 23 (20-25 min) → Bloco 21/Meandro (20 min a pé) → Palácio da Sérvia (15-20 min a pé) — cerca de 60-75 min em Belgrado socialista. Depois, táxi/Bolt até Kalemegdan (não vale a pena andar, atravessa o rio) e continuar exactamente o resto do dia já planeado: Kalemegdan (45-60 min) → Portão de Stambol → Knez Mihailova → Praça da República → Skadarlija à noite. A lógica: uma hora a sentir o urbanismo de Tito, depois duas horas na Belgrado europeia do séc. XIX — o contraste é o objectivo, não ver tudo. Genex Tower fica fora do alcance a pé/tempo razoável — salta-se."}]},{"titulo":"Portão de Stambol","horario":"11:00","duracao":"30min","links":[{"label":"Detalhes: Kalemegdan","itemId":"bg-kalemegdan"}]}]},{"periodo":"Tarde","atividades":[{"titulo":"Knez Mihailova","horario":"13:00","duracao":"1h30","nota":"Rua pedonal principal, cafés e lojas","links":[{"label":"Detalhes: Knez Mihailova","itemId":"bg-knez-mihailova"}],"alternativas":[{"itemId":"bg-tesla-museu","nota":"Antecipar o museu para sábado e deixar domingo de manhã livre para Zemun ou para dormir mais."},{"itemId":"bg-savamala","nota":"Descer de Kalemegdan directamente para a zona ribeirinha reconvertida, com um copo na Beton Hala."},{"itemId":"bg-ada-ciganlija","nota":"Se o dia estiver quente: lago, praia urbana, kayak e bares — a versão desportiva da tarde."}]},{"titulo":"Praça da República","horario":"15:00","duracao":"1h"}]},{"periodo":"Noite","atividades":[{"titulo":"Jantar em Skadarlija","horario":"19:00","duracao":"2h","nota":"Bairro boémio, kafanas com música ao vivo","links":[{"label":"Detalhes: Skadarlija","itemId":"bg-skadarlija"},{"label":"Detalhes: Dva Jelena","itemId":"bg-dva-jelena"}],"alternativas":[{"itemId":"bg-ambar","nota":"Trocar o folclore por cozinha balcânica moderna de partilha, à beira-rio na Beton Hala."},{"itemId":"bg-durmitor","nota":"A versão sem encenação: onde os sérvios vão comer teletina ispod sača."},{"itemId":"bg-pavle-korcagin","nota":"Kafana temática soviética com banda ao vivo — mais noite do que jantar."},{"itemId":"bg-kafana-sfrj","nota":"Nostalgia jugoslava com menos volume do que a Pavle Korčagin."}]},{"titulo":"Noite em 20/44 ou Lasta","horario":"22:00","nota":"20/44 em Karađorđeva 44 para electrónica/alternativo; Lasta se a prioridade for clube de rio maior.","links":[{"label":"Detalhes: 20/44","itemId":"bg-2044"},{"label":"Detalhes: Lasta","itemId":"bg-lasta"}],"alternativas":[{"itemId":"bg-cetinjska","nota":"Pátio com vários bares diferentes — não te comprometes com um só sítio, o que é mais fácil sozinho."},{"itemId":"bg-savamala","nota":"Ficar pela zona da Beton Hala/Savamala em vez de ir para os splavovi."}]}]}]},{"data":"6 Set (Dom)","titulo":"Belgrado → Tirana","periodos":[{"periodo":"Manhã","atividades":[{"titulo":"Museu Nikola Tesla ou Zemun","horario":"10:00","duracao":"2h","nota":"Opcional, conforme energia","links":[{"label":"Detalhes: Museu Tesla","itemId":"bg-tesla-museu"}],"alternativas":[{"itemId":"bg-sveti-sava","nota":"Visita rápida e gratuita antes do check-out — 40 min chegam."},{"itemId":"bg-muzej-jugoslavije","nota":"Atenção: encerra à segunda, mas domingo está aberto. ~1h30 com a Casa das Flores."},{"itemId":"bg-zemun","nota":"Manhã de rio em vez de museu — mas conta 40 min de deslocação em cada sentido."}]}]},{"periodo":"Tarde","atividades":[{"titulo":"Voo JU162 Belgrado → Tirana","horario":"13:20–14:30","nota":"Terminal 2","links":[{"label":"Ver voo","tab":"logistica"}]},{"titulo":"Check-in Metro Hotel Tirana","horario":"14:30","nota":"Rruga Nikolla Tupe Numer 3 — check-in disponível a partir das 14:00","links":[{"label":"Ver alojamento","destinoId":"albania","subtab":"alojamento"}]},{"titulo":"Centro de Tirana + Blloku","horario":"16:30","nota":"Jantar, eventualmente sair para beber algo","links":[{"label":"Detalhes: Oda","itemId":"al-oda"},{"label":"Detalhes: Era Blloku","itemId":"al-era-blloku"}]}]}]}],"restaurantes":[{"id":"bg-dva-jelena","nome":"Dva Jelena","categoria":"Local/Tasca","descricaoCurta":"Kafana histórica em Skadarlija, música ao vivo e comida sérvia clássica.","descricaoCompleta":"Dva Jelena é uma das grandes instituições de Skadarlija: uma kafana aberta em 1832, quando este bairro ainda estava a consolidar a sua fama boémia. Vale menos pela subtileza e mais pelo ritual completo: mesas de madeira, música tradicional ao vivo, pratos sérvios fartos e a sensação de jantar dentro de uma memória antiga de Belgrado. É boa escolha para a noite em Skadarlija porque combina comida, história local e ambiente social no mesmo sítio. Vai com fome, pede carne grelhada ou um prato tradicional da casa e aceita que o jantar possa ser mais barulhento e teatral do que elegante.","precoSimbolo":"€€","precoPessoa":20,"precoInclui":"prato + bebida","horario":"11:00–01:00","distanciaAlojamento":"10 min a pé","reviews":"4.3/5 (Google)","dicas":"Pedir mesa perto da banda para a experiência completa.","mapsQuery":"Dva Jelena Skadarlija Belgrade","fonte":"https://www.dvajelena.rs/en/about-us","foto":"https://www.kudaveceras.rs/images/news/1646874295-skadarlija-restoran-dva-jelena.jpg","recomendacao":8.0,"recomendacaoNota":"A kafana clássica de Skadarlija. Turística, sim, mas a banda ao vivo e a ćevapi justificam — e é fácil jantar sozinho ao balcão ou numa mesa pequena.","lat":44.8193,"lng":20.4655},{"id":"bg-manufaktura","nome":"Manufaktura","categoria":"Fine Dining","descricaoCurta":"Cozinha sérvia contemporânea perto de Knez Mihailova.","descricaoCompleta":"Manufaktura é uma opção mais polida para experimentar comida sérvia sem cair no formato de taberna clássica. Fica numa zona central, perto de Knez Mihailova, e mistura cozinha local, produtos regionais e apresentação mais contemporânea. É útil no roteiro como almoço ou jantar 'arrumado': suficiente para sentir Belgrado gastronómica, mas sem exigir uma noite inteira como Skadarlija. A esplanada e os guarda-chuvas vermelhos tornaram-se quase uma imagem de marca; se estiver calor, tenta mesa fora. Bom para grelhados, queijos, enchidos, pão quente e pratos balcânicos com uma leitura mais moderna.","precoSimbolo":"€€€","precoPessoa":35,"precoInclui":"prato + bebida","horario":"12:00–00:00","distanciaAlojamento":"8 min a pé","mapsQuery":"Manufaktura restaurant Belgrade","foto":"https://www.beogradnocu.com/wp-content/uploads/2021/06/manufaktura-beograd-6-770x513.jpg","recomendacao":7.6,"recomendacaoNota":"Bom almoço cuidado no centro, mas é a opção mais \"segura\" da lista — pouca surpresa para quem procura imersão gastronómica.","lat":44.8165,"lng":20.4595,"coordAproximada":true},{"id":"bg-ambar","nome":"Ambar","categoria":"Fine Dining","descricaoCurta":"Cozinha balcânica moderna em Beton Hala, com vista para o rio Sava.","descricaoCompleta":"Ambar pegou nos pratos de partilha dos Balcãs — kajmak, ajvar, legumes recheados, grelhados — e serviu-os em porções pequenas, para provar muitos de uma vez. Fica na Beton Hala, a fila de armazéns reconvertidos à beira do Sava, mesmo por baixo de Kalemegdan, o que torna o jantar fácil de encadear com a fortaleza ao fim da tarde. É a melhor opção da cidade para quem quer perceber a cozinha sérvia sem se limitar a um prato único.","precoSimbolo":"€€€","precoPessoa":30,"precoInclui":"pratos de partilha + bebida","distanciaAlojamento":"15 min a pé (Beton Hala)","mapsQuery":"Ambar restaurant Beton Hala Belgrade","recomendacao":8.6,"recomendacaoNota":"A melhor combinação de imersão gastronómica e conveniência: pratos de partilha resolvem o problema de jantar sozinho sem ter de escolher um só prato.","lat":44.8175,"lng":20.4462},{"id":"bg-zavicaj","nome":"Zavičaj","categoria":"Local/Tasca","descricaoCurta":"Cozinha sérvia sazonal a dois passos de Knez Mihailova.","descricaoCompleta":"Zavičaj trabalha o receituário sérvio com ingredientes de época e técnica mais cuidada do que a kafana média, sem cair no registo de fine dining. Fica encostado à Knez Mihailova, o que o torna a escolha lógica para um almoço a meio do dia de Belgrado — sais da rua principal, comes bem, voltas ao passeio.","precoSimbolo":"€€","precoPessoa":25,"precoInclui":"prato + bebida","distanciaAlojamento":"7 min a pé","mapsQuery":"Zavicaj restaurant Belgrade","recomendacao":8.4,"recomendacaoNota":"A melhor opção de almoço do dia cheio: fica no caminho, é sérvio a sério e não te tira uma tarde inteira.","lat":44.818,"lng":20.457,"coordAproximada":true},{"id":"bg-durmitor","nome":"Durmitor","categoria":"Local/Tasca","descricaoCurta":"Onde os locais vão pelo sabor sérvio, não pelo folclore.","descricaoCompleta":"Casa clássica frequentada sobretudo por sérvios, conhecida pela teletina ispod sača — vitela cozinhada lentamente sob uma campânula de ferro, num método que vem dos Balcãs rurais. Não tem a encenação de Skadarlija: é comida, mesas cheias e conta baixa. Se quiseres comparar a versão turística com a versão do dia-a-dia, janta aqui numa noite e em Skadarlija na outra.","precoSimbolo":"€€","precoPessoa":18,"precoInclui":"prato + bebida","distanciaAlojamento":"Centro de Belgrado","mapsQuery":"Restoran Durmitor Belgrade","recomendacao":8.2,"recomendacaoNota":"A escolha mais honesta da lista — mas exige que estejas disposto a jantar num sítio sem cenário. Pede a teletina ispod sača, é o motivo para vir.","lat":44.8065,"lng":20.466,"coordAproximada":true},{"id":"bg-pavle-korcagin","nome":"Kafana Pavle Korčagin","categoria":"Local/Tasca","descricaoCurta":"Kafana temática soviética com música ao vivo todas as noites.","descricaoCompleta":"Paredes cobertas de memorabilia socialista, mesas compridas e banda a tocar de mesa em mesa — é uma das kafanas onde a noite descarrila com facilidade. Não é a melhor comida de Belgrado, mas é das experiências mais memoráveis, e o formato de mesa longa torna-a surpreendentemente fácil para quem chega sozinho.","precoSimbolo":"€€","precoPessoa":18,"precoInclui":"prato + bebida","distanciaAlojamento":"Fora do centro (táxi/Bolt ~10 min)","mapsQuery":"Kafana Pavle Korcagin Belgrade","recomendacao":7.9,"recomendacaoNota":"Vale pela noite, não pelo prato. Reserva — enche, e sem reserva sozinho podes ficar de fora.","lat":44.7965,"lng":20.478,"coordAproximada":true},{"id":"bg-kafana-sfrj","nome":"Kafana SFRJ","categoria":"Local/Tasca","descricaoCurta":"Nostalgia jugoslava, pratos tradicionais, ambiente descontraído.","descricaoCompleta":"Kafana com decoração dedicada à antiga Jugoslávia — fotografias, objectos, cartazes — e um menu de tradicionais bem executados, dos legumes recheados aos grelhados. Mais tranquila e menos encenada do que a Pavle Korčagin, boa se quiseres o tema sem o volume.","precoSimbolo":"€€","precoPessoa":16,"precoInclui":"prato + bebida","distanciaAlojamento":"Centro de Belgrado","mapsQuery":"Kafana SFRJ Belgrade","recomendacao":7.8,"recomendacaoNota":"Faz par temático com o Museu da Jugoslávia — se fizeres o museu de manhã, jantar aqui fecha o assunto.","lat":44.8265,"lng":20.463,"coordAproximada":true}],"atracoes":[{"id":"bg-kalemegdan","nome":"Fortaleza de Kalemegdan","categoria":"História","descricaoCurta":"Fortaleza no ponto onde o Sava encontra o Danúbio.","descricaoCompleta":"Kalemegdan é o lugar onde Belgrado fica mais fácil de entender: uma fortaleza sobre a confluência do Sava com o Danúbio, no mesmo ponto estratégico que fez a cidade ser disputada durante séculos. A zona tem camadas romanas, bizantinas, otomanas, austríacas e sérvias; mais do que 'ver muralhas', a graça é caminhar por um mapa vivo das mudanças de império nos Balcãs. Vai sem pressa, entra pelos portões, procura o Pobednik e guarda tempo para simplesmente olhar os rios. De manhã é mais calmo; ao fim da tarde a luz deixa a vista muito melhor.","gratis":true,"horario":"24h (parque)","distanciaAlojamento":"10 min a pé","mapsQuery":"Kalemegdan Fortress Belgrade","dicas":"Combina bem com uma caminhada até ao Portão de Stambol logo a seguir.","foto":"https://www.roadaffair.com/wp-content/uploads/2019/04/kalemegdan-fortress-belgrade-serbia-shutterstock_744488563.jpg","fonte":"https://en.wikipedia.org/wiki/Belgrade_Fortress","recomendacao":9.2,"recomendacaoNota":"O melhor uso possível de uma manhã em Belgrado: gratuito, central, e é o sítio onde a cidade faz sentido de uma vez só. Sozinho funciona particularmente bem — andas ao teu ritmo.","lat":44.8225,"lng":20.4504},{"id":"bg-knez-mihailova","nome":"Knez Mihailova","categoria":"Cultura","descricaoCurta":"Rua pedonal principal, cafés e arquitetura do séc. XIX.","descricaoCompleta":"Knez Mihailova é a espinha dorsal pedonal do centro antigo de Belgrado, ligando a Praça da República à entrada de Kalemegdan. A rua ganhou o seu ar atual no século XIX, quando a elite urbana construiu aqui fachadas comerciais e residenciais que ainda dão escala europeia à cidade. Hoje é mais passeio do que atração isolada: lojas, livrarias, cafés, artistas de rua e muito movimento local. Funciona bem depois de Kalemegdan, para regressar ao centro sem depender de transporte. Não precisa de plano: basta caminhar, parar para café e observar a mistura de Belgrado imperial, socialista e contemporânea.","gratis":true,"distanciaAlojamento":"5 min a pé","mapsQuery":"Knez Mihailova Belgrade","foto":"https://belgrade4you.com/img/tour_box_5.jpg","recomendacao":7.8,"recomendacaoNota":"Não é destino em si, é o corredor natural entre Kalemegdan e o resto do centro. Ganha pontos por conveniência, não por conteúdo.","lat":44.8172,"lng":20.4577},{"id":"bg-skadarlija","nome":"Skadarlija","categoria":"Cultura","descricaoCurta":"Bairro boémio de ruas de calçada, antigo reduto de escritores e artistas.","descricaoCompleta":"Skadarlija é o bairro boémio de Belgrado, frequentemente comparado a uma pequena Montmartre balcânica. O caráter artístico consolidou-se no fim do século XIX e início do XX, quando escritores, atores e músicos passaram a ocupar as kafanas da rua depois do fecho de antigos pontos de encontro no centro. A calçada, as fachadas baixas e a música ao vivo criam uma experiência muito diferente de uma zona de bares moderna. Vai ao fim da tarde para ver a rua acordar e fica para jantar se quiseres o pacote completo: comida sérvia, vinho/rakia, bandas de mesa em mesa e um certo teatro nostálgico.","gratis":true,"distanciaAlojamento":"12 min a pé","mapsQuery":"Skadarlija Belgrade","dicas":"Ir com fome — é também onde se janta.","foto":"https://commons.wikimedia.org/wiki/Special:FilePath/Skadarlija%20street%2C%20Belgrade%2C%20Serbia.jpg","fonte":"https://en.wikipedia.org/wiki/Skadarlija","recomendacao":8.6,"recomendacaoNota":"Casa o teu interesse em gastronomia com o lado boémio da cidade. À noite é dos poucos sítios de Belgrado onde comer sozinho não é estranho: a música ao vivo ocupa o lugar da conversa.","lat":44.8194,"lng":20.4652},{"id":"bg-tesla-museu","nome":"Museu Nikola Tesla","categoria":"Cultura","descricaoCurta":"Museu dedicado ao inventor, com demonstrações interativas.","descricaoCompleta":"O Museu Nikola Tesla é pequeno, mas é uma boa âncora cultural para uma manhã curta em Belgrado. Guarda parte importante do espólio pessoal e científico de Tesla e costuma ter visitas guiadas com demonstrações elétricas, o que o torna mais vivo do que um museu de vitrines. O interesse não está só no inventor em si, mas na forma como os Balcãs disputam e celebram a memória de uma figura que pertenceu a várias geografias culturais ao mesmo tempo. Se fores, tenta encaixar uma visita guiada; sem demonstração, a experiência perde bastante força.","precoSimbolo":"€€","precoPessoa":8,"precoInclui":"bilhete de entrada","horario":"09:00–20:00","distanciaAlojamento":"15 min a pé","mapsQuery":"Nikola Tesla Museum Belgrade","foto":"https://www.roadaffair.com/wp-content/uploads/2019/04/nikola-tesla-museum-belgrade-serbia-shutterstock_430379356.jpg","recomendacao":8.2,"recomendacaoNota":"Pequeno e denso — encaixa numa manhã curta antes do voo. Só vale mesmo a pena com visita guiada/demonstração; sem isso perde metade da graça.","lat":44.8022,"lng":20.4652},{"id":"bg-sveti-sava","nome":"Templo de São Sava","categoria":"História","descricaoCurta":"Uma das maiores igrejas ortodoxas do mundo, com cripta em mosaico.","descricaoCompleta":"São Sava é o edifício que mais impressiona à primeira vista em Belgrado: mármore branco por fora, e por dentro uma cúpula coberta por um dos maiores conjuntos de mosaico dourado feitos no século XX — concluído há poucos anos, depois de décadas de obra interrompida por guerras e pelo período socialista. A cripta, em baixo, é uma sala à parte e vale tanto como a nave. Entrada gratuita. Se apanhares o coro a ensaiar, fica mais tempo.","gratis":true,"horario":"08:00–20:00 (diário)","distanciaAlojamento":"20-25 min a pé do centro / 10 min de Bolt","mapsQuery":"Temple of Saint Sava Belgrade","recomendacao":8.8,"recomendacaoNota":"A única coisa em Belgrado que rivaliza com Kalemegdan em impacto — e é gratuita. Se só acrescentares uma paragem ao dia, acrescenta esta.","lat":44.7986,"lng":20.4689},{"id":"bg-zemun","nome":"Zemun + Torre Gardoš","categoria":"Cultura","descricaoCurta":"Bairro à beira-Danúbio com ar centro-europeu e miradouro sobre o rio.","descricaoCompleta":"Zemun foi cidade separada até 1934 e pertenceu ao império Habsburgo — daí as casas baixas, os telhados vermelhos e a sensação de estar noutro país a 20 minutos do centro. Sobe-se à Torre Gardoš por ruelas íngremes até uma vista aberta sobre o Danúbio; em baixo, a marginal (Kej) está cheia de esplanadas e restaurantes de peixe de rio. É o melhor passeio de fim de tarde da cidade e o antídoto perfeito ao betão do centro.","gratis":true,"distanciaAlojamento":"20 min de Bolt / autocarro do centro","mapsQuery":"Gardos Tower Zemun Belgrade","recomendacao":8.3,"recomendacaoNota":"Alternativa forte à manhã do dia 6 se preferires ar livre e rio a museu — e o pôr do sol na torre é melhor do que qualquer coisa no centro.","lat":44.8434,"lng":20.4013},{"id":"bg-muzej-jugoslavije","nome":"Museu da Jugoslávia + Casa das Flores","categoria":"Cultura","descricaoCurta":"O museu que explica a Jugoslávia — e o túmulo de Tito.","descricaoCompleta":"O conjunto reúne o espólio do período jugoslavo (incluindo as célebres estafetas da juventude, oferecidas a Tito todos os anos) e a Casa das Flores, onde Tito está sepultado. É a visita que dá contexto histórico a tudo o resto — incluindo à Albânia que vais visitar a seguir, que viveu o mesmo século de forma radicalmente diferente. Uma hora e meia chega.","precoSimbolo":"€€","precoPessoa":8,"precoInclui":"bilhete de entrada","horario":"10:00–18:00 (fechado à segunda)","distanciaAlojamento":"15 min de Bolt","mapsQuery":"Museum of Yugoslavia Belgrade","recomendacao":8.1,"recomendacaoNota":"A melhor alternativa ao Museu Tesla se preferires história a ciência — e prepara-te melhor para ler a Albânia pós-comunista.","lat":44.7899,"lng":20.4547},{"id":"bg-savamala","nome":"Savamala e Beton Hala","categoria":"Cultura","descricaoCurta":"Zona ribeirinha reconvertida — arte urbana, armazéns, bares e restaurantes.","descricaoCompleta":"Savamala foi o bairro industrial degradado que se transformou no centro criativo de Belgrado: murais, galerias independentes e clubes instalados em edifícios antigos. Ao lado, a Beton Hala alinha restaurantes e bares dentro de armazéns de betão virados para o Sava. Funciona bem ao fim da tarde, encadeado com a descida de Kalemegdan, e é o sítio óbvio para um copo antes de jantar.","gratis":true,"distanciaAlojamento":"12-15 min a pé","mapsQuery":"Beton Hala Belgrade","recomendacao":7.4,"recomendacaoNota":"Mais atmosfera do que atracção — só entra no plano se te apetecer beber alguma coisa à beira-rio antes do jantar.","lat":44.8172,"lng":20.446},{"id":"bg-ada-ciganlija","nome":"Ada Ciganlija","categoria":"Natureza","descricaoCurta":"\"O mar de Belgrado\" — lago com praia urbana, desporto e bares.","descricaoCompleta":"Antiga ilha ligada à margem, transformada num lago artificial com praias, ciclovias, campos de desporto, aluguer de kayak e uma fila de bares. É onde a cidade inteira vai quando está calor. Em Setembro ainda funciona, mas a energia depende do tempo que apanhares — com dia fresco fica meio vazio.","gratis":true,"distanciaAlojamento":"20 min de Bolt","mapsQuery":"Ada Ciganlija Belgrade","recomendacao":7.2,"recomendacaoNota":"Só faz sentido se o dia estiver quente e te apetecer desporto/água — mas vais ter 4 dias de praia na Riviera a seguir, o que lhe tira urgência.","lat":44.7862,"lng":20.3931},{"id":"bg-bloco23","nome":"Bloco 23 (Novi Beograd)","categoria":"Arquitectura Socialista","descricaoCurta":"Modernismo residencial jugoslavo — betão à vista, mega-estruturas, ruas larguíssimas.","descricaoCompleta":"Os Blocos 22-23 de Novi Beograd são dos melhores exemplos do modernismo residencial jugoslavo: enormes estruturas de betão, espaços vastos entre edifícios e avenidas desproporcionalmente largas pensadas para um urbanismo socialista à escala do estado, não do peão. Vale a pena entrar dentro do bloco, não só ver de fora ao longo da avenida — é lá dentro que se sente o contraste com a cidade antiga do outro lado do rio.","gratis":true,"distanciaAlojamento":"Novi Beograd — táxi/Bolt desde Konak Stella (~15-20 min)","mapsQuery":"Blok 23 Novi Beograd","recomendacao":8.3,"recomendacaoNota":"Sugestão de um amigo que já visitou Belgrado. Ponto de partida da rota \"duas Belgrados\" — Tito primeiro, império austro-húngaro e otomano depois.","lat":44.809,"lng":20.3945},{"id":"bg-bloco21-meandar","nome":"Bloco 21 — o \"Meandro\" / Muralha Chinesa","categoria":"Arquitectura Socialista","descricaoCurta":"Bloco residencial em ziguezague com quase 1 km, construído entre 1960-66.","descricaoCompleta":"A cerca de 20 minutos a pé do Bloco 23, este edifício residencial em ziguezague (\"Kineski zid\", a Muralha Chinesa) estende-se por quase um quilómetro — um dos exemplos mais extraordinários de habitação socialista em massa da Jugoslávia. Caminhar por dentro do complexo dá provavelmente a melhor noção de como era pensada a vida quotidiana dentro deste projecto urbano gigantesco.","gratis":true,"distanciaAlojamento":"~20 min a pé do Bloco 23","mapsQuery":"Kineski zid Blok 21 Novi Beograd","recomendacao":8.6,"recomendacaoNota":"O ponto alto da rota de Novo Belgrado segundo a recomendação do amigo — a peça mais fotogénica e mais fácil de \"ler\" como narrativa urbana.","lat":44.8125,"lng":20.3985},{"id":"bg-palacio-servia","nome":"Palácio da Sérvia","categoria":"Arquitectura Socialista","descricaoCurta":"Edifício governamental monumental de 1959, o auge da arquitectura administrativa jugoslava.","descricaoCompleta":"Concluído em 1959, foi um dos edifícios administrativos que melhor definiu a Jugoslávia socialista: escala monumental, enorme praça aberta em frente, avenidas largas. Não vale a pena tentar entrar — o exterior e a praça já transmitem a escala pretendida. A ~15-20 min a pé do Meandro.","gratis":true,"distanciaAlojamento":"~15-20 min a pé do Bloco 21","mapsQuery":"Palace of Serbia Novi Beograd","recomendacao":8.0,"recomendacaoNota":"Fecha a parte de Novo Belgrado da rota — depois é atravessar o rio para Kalemegdan e continuar o dia exactamente como já estava planeado.","lat":44.8115,"lng":20.3965}],"praias":[],"nightlife":[{"id":"bg-2044","nome":"20/44","categoria":"Nightlife","descricaoCurta":"Clube alternativo de Belgrado, agora em Karađorđeva 44.","descricaoCompleta":"O 20/44 é uma boa escolha se a ideia for sair da noite turística e entrar numa Belgrado mais alternativa. Durante anos foi lendário como clube flutuante, mas depois das mudanças regulatórias nos splavovi passou para Karađorđeva 44, mantendo a identidade ligada à eletrónica, DJs e programação menos comercial. É mais para ouvir música e apanhar a energia underground da cidade do que para um copo tranquilo. Confirma a noite específica antes de ir, porque o ambiente muda muito conforme o DJ. Se estiveres cansado, faz sentido escolher só este ou Lasta, não tentar cumprir tudo.","precoSimbolo":"€€","precoPessoa":15,"precoInclui":"consumo mínimo estimado","horario":"23:00–06:00","mapsQuery":"Klub 20/44 Karadjordjeva 44 Belgrade","fonte":"https://ra.co/events/2506064","foto":"https://www.klubskascena.hr/wp-content/uploads/2024/12/20-44-naslovna.jpg","distanciaAlojamento":"Curto Bolt/táxi a partir de Stari Grad","recomendacao":8.0,"recomendacaoNota":"O splav de referência se quiseres a experiência de clube flutuante no rio. Setembro ainda apanha a temporada a funcionar.","lat":44.8195,"lng":20.431},{"id":"bg-lasta","nome":"Lasta","categoria":"Nightlife","descricaoCurta":"Splav com música pop/funk/R&B, ambiente mais descontraído.","descricaoCompleta":"Lasta é a opção de noite mais direta se quiseres o imaginário clássico dos clubes de rio de Belgrado sem mergulhar tão fundo na cena alternativa. A proposta é mais social e mainstream: música acessível, público arranjado, bebidas e energia de festa junto à água. É menos interessante historicamente do que Skadarlija ou 20/44, mas pode funcionar bem como fecho de sábado se ainda houver energia depois do jantar. Vale confirmar programação e dress code no próprio dia, porque muitos clubes de Belgrado variam bastante entre noites e eventos privados.","precoSimbolo":"€€","precoPessoa":12,"precoInclui":"consumo mínimo estimado","mapsQuery":"Lasta splav Belgrade","fonte":"https://lastabelgrade.com/en/","foto":"https://clubbable.blob.core.windows.net/medias/Lasta-Belgrade-1","recomendacao":7.2,"recomendacaoNota":"Alternativa mais leve ao 20/44 (pop/funk/R&B). Escolha de recurso se o 20/44 estiver com uma noite fraca.","lat":44.819,"lng":20.43},{"id":"bg-cetinjska","nome":"Cetinjska 15","categoria":"Nightlife","descricaoCurta":"Pátio de uma antiga cervejaria com vários bares independentes.","descricaoCompleta":"Uma antiga fábrica de cerveja reconvertida num pátio onde convivem meia dúzia de bares diferentes — de cocktails a rock, de techno a esplanada tranquila — todos a poucos metros uns dos outros. É a zona de saída preferida dos belgradinos que já não vão aos splavovi, e o formato de pátio resolve o problema de escolher um bar às cegas: entras, dás uma volta e ficas onde estiver melhor.","precoSimbolo":"€€","precoPessoa":12,"precoInclui":"consumo estimado","distanciaAlojamento":"10 min a pé","mapsQuery":"Cetinjska 15 Belgrade","recomendacao":8.5,"recomendacaoNota":"A melhor noite de Belgrado para quem vai sozinho: não te comprometes com um sítio, circulas até encontrares o ambiente certo. Mais fácil do que entrar num splav sozinho.","lat":44.8035,"lng":20.4685}]},{"id":"albania","nome":"Albânia","pais":"Albânia","alojamento":[{"nome":"Metro Hotel Tirana","morada":"Rruga Nikolla Tupe Numer 3, kati 1, 1019 Tirana, Albânia","mapsQuery":"Metro Hotel Tirana","plataforma":"Reserva directa","observacoes":"Estadia de chegada, 6→7 Set. €73,90. Check-in 14:00, check-out 11:00.","checkin":"6 Set, 14:00","checkout":"7 Set, 11:00","lat":41.3245,"lng":19.8175},{"nome":"Alojamento Himarë (Airbnb)","morada":"3QV3+MVM, SH8, Himarë, Vlorë County 9425, Albânia","mapsQuery":"3QV3+MVM Himare Albania","plataforma":"Airbnb","contacto":"Código de confirmação: HM25W8KWWH","observacoes":"4 noites, 7→11 Set. Link: https://www.airbnb.com/l/kdGZCKWj. Nome da propriedade e preço não confirmados nesta sessão.","checkin":"7 Set, 15:00","checkout":"11 Set, 11:00","lat":40.0985,"lng":19.7425,"coordAproximada":true},{"nome":"Hotel Boutique Kotoni","morada":"Donika Kastrioti 3, Tirana, Albânia","mapsQuery":"Hotel Boutique Kotoni Tirana","plataforma":"Reserva directa","telefone":"+355 4 22 74888","contacto":"www.hotelkotoni.com · contacto por email: Era","observacoes":"Estadia de regresso, 11→12 Set. €90/noite com pequeno-almoço incluído.","checkin":"11 Set","checkout":"12 Set","lat":41.3225,"lng":19.8135}],"dias":[{"data":"7 Set (Seg)","titulo":"Tirana → Himarë","periodos":[{"periodo":"Manhã","atividades":[{"titulo":"Autocarro Tirana → Himarë","nota":"Ver todos os horários (Olgeno / Riviera Tours) na aba Logística — decidir no dia.","links":[{"label":"Ver horários","tab":"logistica"}]}]},{"periodo":"Tarde","atividades":[{"titulo":"Chegada e check-in no alojamento","horario":"15:00","nota":"3QV3+MVM, SH8, Himarë · código HM25W8KWWH","links":[{"label":"Ver alojamento","destinoId":"albania","subtab":"alojamento"}]},{"titulo":"Primeiro contacto com a praia e o centro de Himarë","horario":"16:30","links":[{"label":"Detalhes: Praia de Himarë","itemId":"al-himare-praia"}]}]},{"periodo":"Noite","atividades":[{"titulo":"Jantar em Himarë","horario":"20:00","nota":"Taverna Velco (vista mar) ou Elea (jardim de oliveiras)","links":[{"label":"Detalhes: Taverna Velco","itemId":"al-taverna-velco"},{"label":"Detalhes: Elea","itemId":"al-elea"}],"alternativas":[{"itemId":"al-lefteri","nota":"A recomendação mais consistente de Himarë — polvo grelhado com os pés na praia de Spile."},{"itemId":"al-odissea","nota":"Peixe grelhado à beira-mar, sem reserva e sem planeamento."},{"itemId":"al-himara-28","nota":"A mesa mais elaborada da vila, se quiseres jantar com calma na primeira noite."},{"itemId":"al-love-souvlaki","nota":"Se chegares tarde e cansado da viagem de autocarro: gyros rápido e vais dormir."}]}]}]},{"data":"8 Set (Ter)","titulo":"Himarë — dia de aventura na água","periodos":[{"periodo":"Manhã","atividades":[{"titulo":"Passeio de barco — Gruta Azul + Grama Bay","horario":"10:00","duracao":"2h30-6h","nota":"Contactar Himara Boat Trips, Himara Water Taxi ou Himara Nautica One — reservar no próprio dia ou véspera","links":[{"label":"Detalhes: passeio de barco","itemId":"al-himare-grama-bay"}],"alternativas":[{"itemId":"al-himare-kayak","nota":"Versão activa: kayak ou SUP em vez de ser levado de barco. Melhor ao fim da tarde."},{"itemId":"al-porto-palermo","nota":"Alternativa em terra se o mar estiver agitado — castelo numa península a 15 min de táxi."},{"itemId":"al-livadhi","nota":"Dia sem plano nenhum na melhor praia da zona, com caminhada até à Aquarium Beach."}]}]},{"periodo":"Tarde","atividades":[{"titulo":"Praia + descanso","horario":"15:00","links":[{"label":"Detalhes: Praia de Himarë","itemId":"al-himare-praia"}],"alternativas":[{"itemId":"al-livadhi","nota":"A praia grande — vale o táxi curto para ter espaço a sério."},{"itemId":"al-potami","nota":"O lado sul da baía, mais recolhido."},{"itemId":"al-aquarium","nota":"Enseada de rochas para snorkel, a pé desde Livadhi."}]}]},{"periodo":"Noite","atividades":[{"titulo":"Jantar + bar","horario":"20:00","nota":"Mojo, Lido Cocktail Bar ou Thea Rooftop Bar","links":[{"label":"Detalhes: Mojo","itemId":"al-himare-mojo"},{"label":"Detalhes: Lido","itemId":"al-himare-lido"},{"label":"Detalhes: Thea","itemId":"al-himare-thea"}]}]}]},{"data":"9 Set (Qua)","titulo":"Himarë — dia livre","periodos":[{"periodo":"Manhã","atividades":[{"titulo":"Praia","horario":"09:30","nota":"5 praias de água cristalina a curta distância a pé do centro","links":[{"label":"Detalhes: Praia de Himarë","itemId":"al-himare-praia"}],"alternativas":[{"itemId":"al-aquarium","nota":"Caminhada curta desde Livadhi até uma enseada quase sempre vazia — leva óculos de mergulho."},{"itemId":"al-potami","nota":"Praia mais calma, alcançável a pé com paciência."},{"itemId":"al-himare-kayak","nota":"Trocar a manhã de praia por kayak/SUP se o dia 8 tiver sido de barco."}]}]},{"periodo":"Tarde","atividades":[{"titulo":"Castelo e Centro Histórico de Himarë","horario":"16:00","duracao":"1h30","nota":"Pausa na Cafe Butterfly, com vista","links":[{"label":"Detalhes: Castelo","itemId":"al-himare-castelo"},{"label":"Detalhes: Cafe Butterfly","itemId":"al-cafe-butterfly"}],"alternativas":[{"itemId":"al-porto-palermo","nota":"Outro castelo, melhor cenário: península a sul de Himarë, ~15 min de táxi."},{"itemId":"al-livadhi","nota":"Ficar pela água em vez de subir — a subida ao castelo é a horas de calor."}]}]},{"periodo":"Noite","atividades":[{"titulo":"Jantar + bar","horario":"20:00","nota":"Taverna Pirosia (vegetariano) ou Love Souvlaki (rápido)","links":[{"label":"Detalhes: Pirosia","itemId":"al-taverna-pirosia"},{"label":"Detalhes: Love Souvlaki","itemId":"al-love-souvlaki"},{"label":"Detalhes: Mojo","itemId":"al-himare-mojo"}],"alternativas":[{"itemId":"al-lefteri","nota":"Se ainda não tiveres ido: é a refeição a não falhar em Himarë."},{"itemId":"al-elea","nota":"Jantar tranquilo num olival, fora do centro."},{"itemId":"al-himara-28","nota":"A opção mais elaborada da marginal."},{"itemId":"al-himare-mojo","nota":"Para a parte do bar: o sítio com o público mais variado da vila."}]}]}]},{"data":"10 Set (Qui)","titulo":"Himarë + Dhërmi/Drymades (excursão de um dia)","periodos":[{"periodo":"Manhã","atividades":[{"titulo":"Praia/atividade em Himarë","horario":"09:00","links":[{"label":"Detalhes: Praia de Himarë","itemId":"al-himare-praia"},{"label":"Detalhes: Kayak/SUP","itemId":"al-himare-kayak"}]}]},{"periodo":"Tarde","atividades":[{"titulo":"Táxi Himarë → Dhërmi/Drymades","horario":"15:00","nota":"~25-30 min — ver Logística","links":[{"label":"Ver logística","tab":"logistica"}]},{"titulo":"Praia de Dhërmi/Drymades","horario":"15:30","links":[{"label":"Detalhes: Dhërmi/Drymades","itemId":"al-dhermi-praia"}],"alternativas":[{"itemId":"al-gjipe","nota":"Trocar a praia fácil pela caminhada no desfiladeiro até Gjipe — vai de manhã, não à tarde."},{"itemId":"al-dhermi-aldeia","nota":"Subir à aldeia velha de pedra e às igrejas bizantinas, com melhor vista do que a praia."},{"itemId":"al-jale","nota":"Baía a meio caminho, com beach clubs — mais música, menos silêncio."}]}]},{"periodo":"Noite","atividades":[{"titulo":"Sunset + jantar em Dhërmi","horario":"19:30","links":[{"label":"Detalhes: Dhërmi/Drymades","itemId":"al-dhermi-praia"}]},{"titulo":"Nightlife (se ainda a funcionar nesta altura de Setembro)","horario":"22:00","nota":"Havana Beach Club ou Salinas/Folie Marina (Jalë)","links":[{"label":"Detalhes: Havana","itemId":"al-havana"},{"label":"Detalhes: Salinas/Folie","itemId":"al-salinas"}]},{"titulo":"Táxi de regresso a Himarë","nota":"Sem horário fixo — combinar táxi de regresso","links":[{"label":"Ver logística","tab":"logistica"}]}]}]},{"data":"11 Set (Sex)","titulo":"Himarë → Tirana","periodos":[{"periodo":"Manhã","atividades":[{"titulo":"Último banho / praia em Himarë","horario":"09:30","links":[{"label":"Detalhes: Praia de Himarë","itemId":"al-himare-praia"}]},{"titulo":"Check-out do alojamento","horario":"11:00","links":[{"label":"Ver alojamento","destinoId":"albania","subtab":"alojamento"}]}]},{"periodo":"Tarde","atividades":[{"titulo":"Autocarro Himarë → Tirana","nota":"Ver todos os horários (Riviera Tours / Olgeno) na aba Logística — decidir no dia.","links":[{"label":"Ver horários","tab":"logistica"}]}]},{"periodo":"Noite","atividades":[{"titulo":"Check-in Hotel Boutique Kotoni","nota":"Donika Kastrioti 3, Tirana","links":[{"label":"Ver alojamento","destinoId":"albania","subtab":"alojamento"}]},{"titulo":"Praça Skanderbeg + Mesquita Et'hem Bey","horario":"18:30","duracao":"1h30","links":[{"label":"Detalhes: Praça Skanderbeg","itemId":"al-skanderbeg"},{"label":"Detalhes: Et'hem Bey","itemId":"al-ethem-bey"}],"alternativas":[{"itemId":"al-bunkart2","nota":"O bunker da polícia secreta, a 5 min da praça — a coisa mais interessante para ver em Tirana."},{"itemId":"al-pazari-i-ri","nota":"Mercado renovado com grelhados e byrektore à volta — junta o passeio ao jantar."},{"itemId":"al-piramida","nota":"Paragem curta na pirâmide de Hoxha, hoje escola de tecnologia."}]},{"titulo":"Último jantar em Blloku","horario":"20:30","nota":"Oda Restaurant ou Era Blloku","links":[{"label":"Detalhes: Oda","itemId":"al-oda"},{"label":"Detalhes: Era Blloku","itemId":"al-era-blloku"}],"alternativas":[{"itemId":"al-mullixhiu","nota":"Fechar a viagem com a versão mais alta da cozinha albanesa. Reservar."},{"itemId":"al-oda","nota":"Tradicional a sério — chega antes das 19h ou apanhas espera."},{"itemId":"al-pazari-i-ri","nota":"Jantar informal a picar pelo mercado, se preferires acabar leve."}]}]}]},{"data":"12 Set (Sáb)","titulo":"Regresso — Tirana → Belgrado → Lisboa","periodos":[{"periodo":"Manhã","atividades":[{"titulo":"Manhã livre em Tirana","horario":"09:30","nota":"Pequeno-almoço no Hotel Boutique Kotoni e volta curta no centro/Blloku.","links":[{"label":"Detalhes: Praça Skanderbeg","itemId":"al-skanderbeg"}],"alternativas":[{"itemId":"al-bunkart2","nota":"Se ainda não tiveres feito: ~1h30 e fica no centro. A melhor visita de Tirana."},{"itemId":"al-house-of-leaves","nota":"Mais rápido (~1h) e igualmente forte — museu da vigilância da Sigurimi."},{"itemId":"al-dajti","nota":"Teleférico ao monte Dajti com vista sobre a cidade. Conta ~3h no total — só com tempo bom e saindo cedo."},{"itemId":"al-pazari-i-ri","nota":"Opção mais leve: mercado, café e almoço rápido antes do aeroporto."},{"itemId":"al-qofte-met-kodra","nota":"Almoço local de qofte antes de sair — barato, rápido, e não te atrasa."}]},{"titulo":"Check-out e saída para o aeroporto","horario":"12:00","nota":"Chegar a TIA ~12:30 para JU163 às 15:15.","links":[{"label":"Ver alojamento","destinoId":"albania","subtab":"alojamento"},{"label":"Ver voo","tab":"logistica"}]}]},{"periodo":"Tarde","atividades":[{"titulo":"Voo JU163 Tirana → Belgrado","horario":"15:15–16:20","nota":"Air Serbia/Bulgaria Air, reserva KTHKLN. Layover ~2h45 em Belgrado.","links":[{"label":"Ver voo","tab":"logistica"}]}]},{"periodo":"Noite","atividades":[{"titulo":"Voo JU564 Belgrado → Lisboa","horario":"19:05–22:10","nota":"Chegada a LIS Terminal 1; chegada a casa estimada ~22:45.","links":[{"label":"Ver voo","tab":"logistica"}]}]}]}],"restaurantes":[{"id":"al-oda","nome":"Oda Restaurant","categoria":"Local/Tasca","descricaoCurta":"Referência de cozinha albanesa tradicional em Blloku, Tirana.","descricaoCompleta":"Oda é uma boa primeira porta de entrada para a cozinha albanesa tradicional em Tirana. O nome remete para a sala de receber das casas antigas, e o restaurante tenta recriar esse ambiente com madeira, objetos tradicionais e pratos de conforto. A comida é mais caseira do que sofisticada: fërgesë, tavë kosi, legumes recheados, borrego, pão e vinho da casa. É especialmente útil para perceber como a cozinha albanesa mistura influências otomanas, balcânicas e mediterrânicas sem ser simplesmente 'grega' ou 'turca'. Vai sem pressa; o serviço pode ser mais lento quando está cheio, mas isso faz parte do ritmo.","precoSimbolo":"€€","precoPessoa":22,"precoInclui":"prato + bebida","distanciaAlojamento":"Blloku, Tirana","mapsQuery":"Oda Restaurant Tirana","fonte":"https://odarestaurant.al/","foto":"https://b1858819.smushcdn.com/1858819/wp-content/uploads/bb-plugin/cache/Oda-Traditional-restaurant-Albania-Tirana-Dining-Food-scaled-portrait-337b9ac7539c7cf3617ba1797f147dba-cje1sfp4r8t5.jpg?lossy=2&strip=1&webp=1","recomendacao":8.7,"recomendacaoNota":"A referência de cozinha albanesa tradicional em Tirana. Para a última noite, é a escolha que fecha a viagem com a comida certa. Chega antes das 19h ou arrisças espera.","lat":41.3222,"lng":19.813},{"id":"al-era-blloku","nome":"Era Blloku","categoria":"Local/Tasca","descricaoCurta":"Popular em Blloku, cozinha albanesa e mediterrânica.","descricaoCompleta":"Era Blloku é uma opção segura e animada no bairro mais social de Tirana. Não tem a aura tradicional da Oda nem a ambição autoral do Mullixhiu, mas compensa com consistência, movimento e uma carta ampla que funciona bem quando não queres arriscar. Blloku foi a antiga zona reservada à elite comunista e hoje concentra bares, restaurantes e vida noturna; jantar aqui ajuda a sentir essa Tirana pós-comunista, jovem e em transformação. Bom para um primeiro ou último jantar, sobretudo se quiseres depois caminhar para um bar sem mudar de bairro.","precoSimbolo":"€€","precoPessoa":18,"precoInclui":"prato + bebida","distanciaAlojamento":"Blloku, Tirana","mapsQuery":"Era Blloku Tirana","fonte":"https://era.al/en/era-bllok/","foto":"https://booked.ai/_next/image?q=75&url=https%3A%2F%2Froute-pricing-server-production-production.up.railway.app%2Fmedia%2Frailbucket-production-ofnqas%2Ffbdd6920b4c4013a4d6529d0f3bfe4dde3decba945a6bd31c72352cec724c971.jpg%3Fw%3D1200%26q%3D74%26fm%3Dwebp&w=1920","recomendacao":8.0,"recomendacaoNota":"Movimentado, fiável e no meio do Blloku — a opção óbvia para a primeira noite em Tirana, quando ainda estás a orientar-te.","lat":41.3218,"lng":19.8138},{"id":"al-mullixhiu","nome":"Mullixhiu","categoria":"Fine Dining","descricaoCurta":"Cozinha albanesa moderna, ingredientes de pequenos produtores.","descricaoCompleta":"Mullixhiu é a escolha gastronómica mais interessante em Tirana se quiseres ver a cozinha albanesa tratada como património e não só como comida de conforto. O chef Bledar Kola trabalhou fora da Albânia e trouxe uma lógica de produto local, sazonalidade e releitura moderna de receitas rurais. O nome significa 'moleiro', e essa ideia aparece no pão, nos cereais e no cuidado com ingredientes de pequenos produtores. É o sítio para um jantar mais contemplativo: menos 'vou comer qualquer coisa' e mais 'quero perceber o que a Albânia tem para dizer à mesa'. Reserva se possível.","precoSimbolo":"€€€","precoPessoa":40,"precoInclui":"prato + bebida","distanciaAlojamento":"Tirana","mapsQuery":"Mullixhiu Tirana","fonte":"https://www.mullixhiu.al/","foto":"https://i0.wp.com/www.mullixhiu.al/wp-content/uploads/2020/03/mullixhiu-garden.jpg?fit=1600%2C1066&ssl=1","recomendacao":8.5,"recomendacaoNota":"A tua imersão gastronómica no registo mais alto: cozinha albanesa reinterpretada com produto de pequenos produtores. Vale o jantar mais caro da viagem.","lat":41.3175,"lng":19.809},{"id":"al-taverna-velco","nome":"Taverna Velco","categoria":"Local/Tasca","descricaoCurta":"Terraço com vista sobre o mar Jónico, à saída do centro de Himarë.","descricaoCompleta":"Taverna Velco é um daqueles restaurantes que faz sentido numa base costeira: vista, peixe, marisco, grelhados e um ambiente familiar sem grande pose. Fica na zona de Potam, um pouco fora do centro de Himarë, por isso funciona melhor como jantar com táxi curto ou caminhada planeada, não como escolha espontânea se já estiveres cansado. A força da casa está no marisco grelhado, polvo, peixe inteiro e camarão saganaki, com influência grega/albanesa evidente. Vale ir ao pôr do sol se conseguires; é mais memorável pela combinação de comida simples, mar e luz do que por inovação culinária.","precoSimbolo":"€€","precoPessoa":20,"precoInclui":"prato + bebida","distanciaAlojamento":"Himarë","mapsQuery":"Taverna Velco Himare","fonte":"https://himara.net/blog/taverna-velco-review","foto":"https://himara.net/images/businesses/restaurants/taverna-velco/hero.webp","recomendacao":8.8,"recomendacaoNota":"A combinação que procuras nesta viagem: marisco fresco, terraço sobre o Jónico e anfitrião que puxa conversa — o melhor jantar \"de viagem\" de Himarë para quem vai sozinho.","lat":40.0965,"lng":19.7405},{"id":"al-taverna-pirosia","nome":"Taverna Pirosia","categoria":"Vegetariano","descricaoCurta":"Referência vegetariana em Himarë.","descricaoCompleta":"Taverna Pirosia entra no roteiro por uma razão prática e rara na Riviera: dá uma alternativa vegetariana/leve num destino onde peixe, carne e grelhados dominam quase tudo. É pequena, informal e mais interessante para uma refeição simples do que para uma grande noite. A fërgesë, legumes grelhados, saladas e pratos de queijo resolvem bem quando já estás farto de marisco ou queres gastar pouco. Também é boa opção se estiveres sozinho e não quiseres uma experiência de restaurante muito montada. Pensa nela como uma pausa útil no meio de dias de praia e comida pesada.","precoSimbolo":"€","precoPessoa":12,"precoInclui":"prato + bebida","distanciaAlojamento":"Himarë","mapsQuery":"Taverna Pirosia Himare","fonte":"https://www.tripadvisor.com/Restaurant_Review-g801295-d24131683-Reviews-Taverna_Pirosia-Himare_Vlore_County.html","foto":"https://himara.net/images/businesses/restaurants/taverna-pirosia/hero.webp","recomendacao":7.6,"recomendacaoNota":"Pequeno e muito elogiado, mas é a opção vegetariana — só entra à frente das outras se quiseres uma refeição mais leve entre dias de marisco.","lat":40.1012,"lng":19.7442,"coordAproximada":true},{"id":"al-elea","nome":"Elea","categoria":"Fine Dining","descricaoCurta":"Restaurante familiar num olival, cozinha albanesa moderna.","descricaoCompleta":"Elea é o jantar de Himarë para quando apetecer desacelerar. O restaurante está ligado a um ambiente de jardim/olival, com uma leitura mais cuidada da cozinha albanesa e mediterrânica. A graça está menos em 'ver e ser visto' e mais em comer com calma, num lugar verde, ligeiramente afastado da agitação da marginal. É boa escolha para uma noite em que queiras escrever, pensar, recuperar energia ou simplesmente fazer uma refeição melhor sem entrar no formato formal de fine dining. Pede pratos locais, azeite, legumes, peixe ou carne grelhada, e deixa espaço para uma sobremesa se houver algo caseiro.","precoSimbolo":"€€","precoPessoa":22,"precoInclui":"prato + bebida","distanciaAlojamento":"Himarë","mapsQuery":"Elea restaurant Himare","foto":"https://himara.net/images/businesses/restaurants/elea-restaurant/04.webp","recomendacao":8.2,"recomendacaoNota":"Jantar calmo num olival, fora do centro — bom contraponto às noites na marginal. Menos \"energia\", mais qualidade de mesa.","lat":40.094,"lng":19.737},{"id":"al-love-souvlaki","nome":"Love Souvlaki","categoria":"Casual","descricaoCurta":"Gyros e souvlaki gregos, opção rápida e informal.","descricaoCompleta":"Love Souvlaki é uma opção de sobrevivência feliz: rápida, barata e muito útil nos dias em que não queres transformar cada refeição num evento. Himarë tem uma forte camada cultural grega, e isso aparece naturalmente no gyros, souvlaki, pita, tzatziki e saladas simples. É o sítio para antes ou depois da praia, quando estás com sal no corpo e pouca paciência para menus longos. Não é uma atração gastronómica no sentido nobre, mas tem valor real no roteiro: poupa tempo, dinheiro e energia. Também funciona bem se estiveres sozinho e quiseres comer sem cerimónia.","precoSimbolo":"€","precoPessoa":8,"precoInclui":"prato + bebida","distanciaAlojamento":"Himarë","mapsQuery":"Love Souvlaki Himare","foto":"https://images.squarespace-cdn.com/content/v1/6623feafcef0693caade2984/35d9a034-0f8e-4aa1-a22e-f1761661de41/I-Love-Souvlaki-Himare-Albania.jpg","recomendacao":7.4,"recomendacaoNota":"Rápido, barato e bom para uma noite em que voltas tarde da praia e não queres jantar sentado.","lat":40.1008,"lng":19.7438,"coordAproximada":true},{"id":"al-cafe-butterfly","nome":"Cafe Butterfly","categoria":"Vista","descricaoCurta":"Junto ao Castelo de Himarë, vista privilegiada.","descricaoCompleta":"Cafe Butterfly vale sobretudo pelo contexto: fica na zona alta/antiga de Himarë, junto ao castelo, e por isso transforma uma visita histórica numa pausa com vista. Depois de subir pelas ruas de pedra e pelas ruínas, sentar aqui ajuda a perceber a geografia do lugar: a vila antiga protegida no alto, o mar Jónico em baixo, e a Himarë moderna estendida junto à praia. Não vás à espera de uma refeição marcante; pensa antes em café, bebida fria, algo leve e tempo para olhar. É uma boa paragem para fim de tarde, quando a luz deixa a costa mais dramática.","precoSimbolo":"€","precoPessoa":8,"precoInclui":"café/refeição ligeira","distanciaAlojamento":"Castelo de Himarë","mapsQuery":"Cafe Butterfly Himare","foto":"https://static.goto-where.com/158873-albums-1.jpg","recomendacao":7.2,"recomendacaoNota":"Paragem, não destino: serve a vista durante a subida ao castelo. Não organizes a noite à volta dele.","lat":40.103,"lng":19.746},{"id":"al-lefteri","nome":"Taverna Lefteri","categoria":"Local/Tasca","descricaoCurta":"Taverna à beira-água na praia de Spile — polvo grelhado e peixe do dia.","descricaoCompleta":"É o nome que aparece sempre quando se pergunta a um habitante de Himarë onde mandar um visitante. Mesas praticamente na água, na praia de Spile, cozinha greco-albanesa e peixe fresco do dia. O prato de assinatura é o polvo grelhado — tenro, fumado, servido apenas com azeite e limão. Jantar completo com entradas, prato e vinho fica à volta de 30-40 € por duas pessoas, o que para o que é servido é barato.","precoSimbolo":"€€","precoPessoa":20,"precoInclui":"prato + bebida","horario":"Almoço e jantar","distanciaAlojamento":"Praia de Spile, centro de Himarë","mapsQuery":"Taverna Lefteri Himare","fonte":"https://himara.net/restaurants/taverna-lefteri","dicas":"Chega ~90 min antes do pôr do sol para apanhar mesa da frente. Se só fizeres uma refeição de peixe em Himarë, faz esta.","recomendacao":9.0,"recomendacaoNota":"O melhor jantar da viagem em relação qualidade/preço/cenário — e a recomendação mais consistente entre fontes locais. Pede o polvo grelhado.","lat":40.1005,"lng":19.7443},{"id":"al-himara-28","nome":"Himara 28","categoria":"Fine Dining","descricaoCurta":"Cozinha mediterrânica mais cuidada, na marginal de Himarë.","descricaoCompleta":"A opção de jantar mais elaborado de Himarë — leitura contemporânea dos pratos costeiros albaneses e mediterrânicos, serviço mais formal, na promenade da vila. Boa escolha para a noite em que quiseres jantar sentado e sem pressa depois de um dia inteiro de barco ou praia.","precoSimbolo":"€€€","precoPessoa":28,"precoInclui":"prato + bebida","distanciaAlojamento":"Marginal de Himarë","mapsQuery":"Restaurant Himara 28","recomendacao":8.1,"recomendacaoNota":"O upgrade de Himarë quando o Velco e o Lefteri já estiverem feitos. Não é obrigatório — mas é a melhor mesa da vila.","lat":40.1015,"lng":19.7448,"coordAproximada":true},{"id":"al-odissea","nome":"Odissea","categoria":"Vista","descricaoCurta":"Peixe grelhado e massa de marisco em cenário à beira-mar.","descricaoCompleta":"Restaurante de praia com boa reputação pelo peixe grelhado e pela massa de marisco, num dos cenários mais bonitos da baía. Funciona melhor ao entardecer, quando a luz baixa sobre a água — jantar cedo aqui é das coisas mais fáceis de organizar em Himarë, sem reserva.","precoSimbolo":"€€","precoPessoa":22,"precoInclui":"prato + bebida","distanciaAlojamento":"Himarë, junto ao mar","mapsQuery":"Restaurant Odissea Himare","recomendacao":8.0,"recomendacaoNota":"A terceira mesa de peixe de Himarë — útil precisamente porque não precisa de reserva nem de planeamento.","lat":40.1,"lng":19.7435,"coordAproximada":true},{"id":"al-qofte-met-kodra","nome":"Qofte Tradita Met Kodra","categoria":"Casual","descricaoCurta":"Faz uma coisa só — qofte — e fá-la melhor do que ninguém em Tirana.","descricaoCompleta":"Casa pequena junto ao Blloku que serve praticamente só qofte (almôndegas albanesas grelhadas), há décadas, e é onde os tiranenses vão almoçar. Sem menu extenso, sem cenário: chegas, comes, sais. Ao almoço o ambiente é melhor e a comida mais fresca do que ao jantar.","precoSimbolo":"€","precoPessoa":7,"precoInclui":"prato + bebida","distanciaAlojamento":"Perto do Blloku, Tirana","mapsQuery":"Qofte Tradita Met Kodra Tirana","recomendacao":8.0,"recomendacaoNota":"O almoço certo para a manhã livre do último dia: barato, rápido, local, e não te compromete com uma refeição longa antes do voo.","lat":41.323,"lng":19.8145}],"atracoes":[{"id":"al-skanderbeg","nome":"Praça Skanderbeg","categoria":"Cultura","descricaoCurta":"Praça central de Tirana, ponto de partida para explorar a cidade.","descricaoCompleta":"A Praça Skanderbeg é o centro simbólico de Tirana e um bom resumo visual da história recente da Albânia. À volta dela aparecem o herói nacional Skanderbeg, a mesquita otomana Et'hem Bey, edifícios do período comunista, instituições nacionais e a Tirana contemporânea pedonalizada. A praça foi remodelada para reduzir carros e criar um grande espaço cívico, por isso funciona mais como palco urbano do que como monumento isolado. Caminha devagar, repara na escala vazia do espaço e usa-a como ponto de orientação: quase tudo no centro se organiza a partir daqui.","gratis":true,"mapsQuery":"Skanderbeg Square Tirana","foto":"https://cdn.holidayguru.ch/wp-content/uploads/2025/04/skanderberg-shutterstock_2166445249.jpg","fonte":"https://en.wikipedia.org/wiki/Skanderbeg_Square","recomendacao":7.5,"recomendacaoNota":"Ponto de orientação da cidade mais do que atracção. Serve para começar a última noite, não para encher uma tarde.","lat":41.3275,"lng":19.8187},{"id":"al-ethem-bey","nome":"Mesquita Et'hem Bey","categoria":"História","descricaoCurta":"Mesquita do séc. XVIII com frescos delicados.","descricaoCompleta":"A Mesquita Et'hem Bey é uma das peças históricas mais delicadas de Tirana. Construída entre o fim do século XVIII e início do XIX, sobreviveu ao século XX albanês, incluindo o período comunista em que a religião foi reprimida. O momento mais simbólico veio em 1991, quando milhares de pessoas entraram na mesquita apesar da proibição, num gesto associado ao regresso público da liberdade religiosa. O interior e o pórtico têm frescos raros com árvores, pontes e paisagens, pouco comuns na decoração islâmica local. Entra com respeito, fora das horas de oração, e observa os detalhes sem pressa.","gratis":true,"horario":"Fora das orações","mapsQuery":"Et'hem Bey Mosque Tirana","foto":"https://www.nitravel.org/storage/tour-places/F7GT0r8o6bjx029aD0IlIdVcTsq3xxzT9JSTSBSE.jpg","fonte":"https://en.wikipedia.org/wiki/Et%27hem_Bey_Mosque","recomendacao":7.6,"recomendacaoNota":"Interior de frescos florais raro na região e fica à porta da Praça Skanderbeg. Visita de 20-30 min, não mais.","lat":41.3271,"lng":19.8189},{"id":"al-himare-castelo","nome":"Castelo e Centro Histórico de Himarë","categoria":"História","descricaoCurta":"Vila antiga no alto de uma falésia, vista panorâmica sobre a Riviera.","descricaoCompleta":"O Castelo e Centro Histórico de Himarë são essenciais para entender que a Riviera não é só praia. A ocupação da zona remonta a mais de 2.500 anos, com camadas gregas, romanas, bizantinas, otomanas e italianas. A vila antiga fica no alto, posição defensiva clássica: longe de ataques pelo mar, mas com domínio visual sobre toda a costa. Hoje, as ruínas, igrejas, muros e casas de pedra dão uma sensação de tempo suspenso. Vai ao fim da tarde, quando o calor baixa e a luz abre sobre o Jónico. É uma visita curta, mas muda a forma como olhas para Himarë em baixo.","precoSimbolo":"€","precoPessoa":2.5,"precoInclui":"bilhete de entrada (~300 LEK)","distanciaAlojamento":"Himarë","mapsQuery":"Himara Castle","fonte":"https://himara.net/blog/himara-old-town-castle","foto":"https://www.startlap.hu/utazas/uploads/sites/3/2024/08/himare8.jpg","recomendacao":8.4,"recomendacaoNota":"Meia tarde bem gasta: vila antiga na falésia, muralhas e vista de 360º sobre o Jónico. Sobe ao fim da tarde, com a luz baixa.","lat":40.1032,"lng":19.7462},{"id":"al-himare-grama-bay","nome":"Gruta Azul + Grama Bay (passeio de barco)","categoria":"Aventura na água","descricaoCurta":"Passeio de barco às grutas e baías mais bonitas perto de Himarë.","descricaoCompleta":"O passeio de barco para Grama Bay e grutas próximas é provavelmente a experiência de mar mais forte da estadia. A costa entre Himarë, Gjipe, Grama e pequenas enseadas tem falésias claras, água muito transparente e praias que por terra seriam difíceis ou lentas de alcançar. Grama Bay tem ainda um lado histórico: durante séculos foi abrigo natural para barcos, e as rochas da zona guardam inscrições antigas de marinheiros. Escolhe tour em grupo se quiseres algo social e barato, privado se quiseres controlar ritmo e paragens. Leva saco seco, água, protetor e não planeies uma noite pesada logo depois.","precoSimbolo":"€€€","precoPessoa":90,"precoInclui":"passeio de barco, equipamento básico","distanciaAlojamento":"Saída do porto de Himarë","mapsQuery":"Himare boat tour Grama Bay","siteOficial":"https://www.himaraboattrips.com/","fonte":"https://www.himara-watertaxi.com/tours/grama-bay-tour/","dicas":"Operadores locais para contactar directamente: Himara Boat Trips (himaraboattrips.com), Sea Breeze/Himara Tours (himaratours.com), Himara Water Taxi (himara-watertaxi.com, tem versão em grupo partilhado mais barata) e Himara Nautica One (himaranauticaone.com). Nenhum publica WhatsApp/telefone online — contactar por email/site ou presencialmente em Himarë, normalmente dá para reservar no próprio dia ou véspera.","foto":"https://api.mytour.eu/images/1675780951177_gita-in-motoscafo-alla-baia-di-grama-main.png","recomendacao":9.3,"recomendacaoNota":"O ponto alto da estadia em Himarë e a razão de ter um dia dedicado a água. Grutas, baías inacessíveis por terra e paragens para nadar — é aqui que a Riviera se justifica.","lat":40.0995,"lng":19.743},{"id":"al-himare-kayak","nome":"Kayak/SUP ao pôr do sol — Praia de Filikuri","categoria":"Aventura na água","descricaoCurta":"Passeio de kayak ou stand-up paddle ao entardecer.","descricaoCompleta":"Kayak ou SUP até Filikuri é a alternativa ativa ao barco turístico. Em vez de seres levado pela costa, vais sentir a escala do mar, das falésias e das pequenas praias com o corpo. Filikuri é uma enseada mais selvagem perto de Himarë, difícil de acessar por terra, o que ajuda a manter a sensação de descoberta. O pôr do sol é o melhor horário porque o calor baixa e a luz bate nas rochas. Se estiver vento ou mar mexido, não forces: a costa é bonita, mas exposta. Para uma primeira vez, guia local é melhor do que aluguer totalmente por conta própria.","precoSimbolo":"€€","precoPessoa":38,"precoInclui":"equipamento, guia","distanciaAlojamento":"Saída do porto de Himarë","mapsQuery":"Himare kayak SUP Filikuri","siteOficial":"https://kayaksrentsups.com/","fonte":"https://himara.net/boat-tours/secret-blue-cave","dicas":"Kayaks Rents Sups (kayaksrentsups.com) é a empresa especializada neste tour. Alternativa sem reserva: alugar directamente na praia de Himarë, Livadhi ou Potami (~€10-15/hora ou ~€30/dia) e fazer o trajeto por conta própria.","foto":"https://cdn.getyourguide.com/image/format%3Dauto%2Cfit%3Dcrop%2Cgravity%3Dauto%2Cquality%3D60%2Cwidth%3D400%2Cheight%3D265%2Cdpr%3D2/tour_img/f1b35133e772d3d90f937285aa96729beea035dfd6c56cf69a888b686a0856cb.jpg","recomendacao":8.7,"recomendacaoNota":"Se preferes fazer em vez de ser levado: kayak/SUP ao pôr do sol, acessível a iniciantes. Encaixa no teu lado desporto sem exigir experiência.","lat":40.087,"lng":19.7355},{"id":"al-llogara","nome":"Passo de Llogara","categoria":"Natureza","descricaoCurta":"Miradouro panorâmico sobre a Riviera Albanesa.","descricaoCompleta":"O Passo de Llogara é a grande viragem cénica entre a Albânia interior e a Riviera. A estrada sobe pelas Montanhas Ceraunianas e depois abre, de repente, para o mar Jónico muito abaixo. Historicamente, esta barreira montanhosa ajudou a isolar e proteger as comunidades costeiras de Himarë, o que explica parte da identidade forte da região. Mesmo visto de autocarro, é um dos momentos paisagísticos da viagem. Se o transporte parar, aproveita sem pressa: a vista combina montanha, floresta de pinheiro negro, curvas de estrada e costa azul. É também zona de parapente e trilhos.","gratis":true,"mapsQuery":"Llogara Pass Albania","foto":"https://peakvisor.com/photo/SD/Llogara-pass-Ionian-sea-coast-Llogara-National-Park-Albania.jpg","fonte":"https://albaniavisit.com/attractions/llogara-national-park/","recomendacao":7.8,"recomendacaoNota":"Vês de passagem no autocarro Tirana↔Himarë — parar aqui de propósito só faz sentido com carro, que não tens nesta viagem.","lat":40.199,"lng":19.585},{"id":"al-gjipe","nome":"Gjipe Canyon","categoria":"Natureza","descricaoCurta":"Trilho até praia isolada entre falésias calcárias, perto de Dhërmi.","descricaoCompleta":"Gjipe Canyon é uma das paisagens mais dramáticas da Riviera: um desfiladeiro calcário que desce até uma praia isolada entre Dhërmi e Vuno. A experiência vale porque junta caminhada, geologia e mar no mesmo lugar. A praia pode ser alcançada por trilho ou barco, mas o canyon é o que lhe dá personalidade; as paredes estreitas fazem a chegada ao mar parecer mais remota do que realmente é. É boa opção se o dia de Dhërmi pedir aventura em vez de apenas espreguiçadeira. Leva calçado decente, água e evita o calor mais duro; não é uma praia urbana de chegar e sentar.","gratis":true,"distanciaAlojamento":"Perto de Dhërmi","mapsQuery":"Gjipe Beach Albania","foto":"https://www.reisroutes.be/userfiles/fotos/uitzicht-over-gjipe-kloof-albanie_40038_xl.jpg","fonte":"https://www.tirana-airport.com/en/article/1057/Gjipe-Canyon","recomendacao":8.9,"recomendacaoNota":"A caminhada mais espectacular da Riviera: desfiladeiro estreito até uma praia sem acesso por estrada. Vai de manhã — a descida ao sol do meio-dia é castigo.","lat":40.129,"lng":19.6225},{"id":"al-bunkart2","nome":"Bunk'Art 2","categoria":"História","descricaoCurta":"Bunker nuclear no centro de Tirana, hoje museu da polícia secreta.","descricaoCompleta":"Bunk'Art 2 ocupa um bunker construído sob o centro de Tirana para o Ministério do Interior e conta a história da Sigurimi, a polícia secreta que vigiou o país durante quase meio século. Percorre-se sala a sala, cada uma dedicada a um período ou a um mecanismo de repressão. É a visita que explica porque é que a Albânia parece ter saltado quarenta anos — e fica a 5 minutos da Praça Skanderbeg, o que a torna fácil de encaixar.","precoSimbolo":"€€","precoPessoa":10,"precoInclui":"bilhete de entrada","horario":"09:00–20:00 (confirmar no local)","distanciaAlojamento":"Centro de Tirana, junto à Praça Skanderbeg","mapsQuery":"Bunk'Art 2 Tirana","recomendacao":8.6,"recomendacaoNota":"A coisa mais interessante para ver em Tirana e a que melhor encaixa no tempo curto que lá tens. Se só fizeres um museu na Albânia, faz este.","lat":41.3277,"lng":19.8172},{"id":"al-house-of-leaves","nome":"Casa das Folhas (House of Leaves)","categoria":"História","descricaoCurta":"Museu da vigilância, na antiga central de escutas da Sigurimi.","descricaoCompleta":"Instalado no edifício onde funcionava o centro de escutas do regime, o museu mostra o equipamento real de vigilância, os ficheiros e os métodos usados para controlar a população — microfones, câmaras escondidas, dossiês. Mais pequeno e mais frio do que o Bunk'Art 2, e por isso mais perturbador. Uma hora chega.","precoSimbolo":"€€","precoPessoa":7,"precoInclui":"bilhete de entrada","distanciaAlojamento":"Centro de Tirana","mapsQuery":"House of Leaves Museum Tirana","recomendacao":8.4,"recomendacaoNota":"Complemento natural do Bunk'Art 2 — e se tiveres de escolher só um pela manhã do dia 12, este é mais rápido de ver.","lat":41.3256,"lng":19.8226},{"id":"al-porto-palermo","nome":"Castelo de Porto Palermo","categoria":"História","descricaoCurta":"Fortaleza de Ali Pasha numa península, a sul de Himarë.","descricaoCompleta":"Fortaleza triangular do início do século XIX construída para Ali Pasha de Tepelena, plantada numa península que entra pela baía adentro. O interior é pouco mais do que salas vazias e um terraço — mas o cenário, com a água dos dois lados, é dos melhores da costa. Fica a ~15 minutos de táxi a sul de Himarë, o que a torna a saída mais fácil da estadia sem depender de barco.","precoSimbolo":"€","precoPessoa":3,"precoInclui":"bilhete de entrada","distanciaAlojamento":"~15 min de táxi a sul de Himarë","mapsQuery":"Porto Palermo Castle Albania","recomendacao":8.5,"recomendacaoNota":"A melhor alternativa \"em terra\" para uma tarde em Himarë: barata, perto e com cenário à altura do resto da viagem.","lat":40.0455,"lng":19.7935},{"id":"al-dajti","nome":"Teleférico Dajti Ekspres","categoria":"Natureza","descricaoCurta":"15 minutos de teleférico até ao monte Dajti, com vista sobre Tirana.","descricaoCompleta":"O teleférico sobe sobre pinhal até ao topo do monte Dajti, a mais de 1000 m, com vista sobre toda a planície de Tirana — em dias limpos vê-se até ao Adriático. No topo há trilhos, esplanadas e um restaurante panorâmico. É a forma mais rápida de sair da cidade sem carro e a melhor opção se a manhã livre do último dia estiver com bom tempo.","precoSimbolo":"€€","precoPessoa":12,"precoInclui":"bilhete ida e volta","horario":"Encerra às segundas (confirmar antes de ir)","distanciaAlojamento":"15-20 min de táxi do centro de Tirana","mapsQuery":"Dajti Ekspres cable car Tirana","recomendacao":8.2,"recomendacaoNota":"A melhor forma de gastar a manhã do dia 12 se o tempo estiver bom — mas conta ~3h no total com deslocações, e tens o voo às 15:15.","lat":41.3345,"lng":19.8722},{"id":"al-pazari-i-ri","nome":"Pazari i Ri (Novo Bazar)","categoria":"Cultura","descricaoCurta":"Mercado renovado rodeado de grelhados, byrektore e cafés.","descricaoCompleta":"O mercado central de Tirana foi recuperado e é hoje a zona mais agradável da cidade para comer de forma informal: bancas de fruta e produto local no meio, e à volta um anel de grelhados, casas de byrek, pastelarias e pequenos bistros. É o sítio para provar comida albanesa sem entrar num restaurante — e a poucos minutos a pé da Praça Skanderbeg.","gratis":true,"horario":"Manhã e início da tarde (mercado); restauração até à noite","distanciaAlojamento":"10 min a pé da Praça Skanderbeg","mapsQuery":"Pazari i Ri Tirana","recomendacao":8.3,"recomendacaoNota":"Junta as tuas duas prioridades — gastronomia e andar a pé sem plano — numa só paragem. Perfeito para a manhã do último dia.","lat":41.3308,"lng":19.8199},{"id":"al-piramida","nome":"Pirâmide de Tirana","categoria":"Cultura","descricaoCurta":"Antigo museu de Enver Hoxha, hoje centro tecnológico com escadas até ao topo.","descricaoCompleta":"Construída como mausoléu-museu do ditador Enver Hoxha, ficou décadas abandonada e coberta de graffiti até ser reconvertida num centro de tecnologia e educação para jovens. Hoje sobe-se por escadas exteriores até ao topo, com vista sobre o centro de Tirana. Vale sobretudo pelo que representa: o mesmo edifício que servia o culto do regime é agora uma sala de aulas.","gratis":true,"distanciaAlojamento":"Centro de Tirana","mapsQuery":"Pyramid of Tirana","recomendacao":7.3,"recomendacaoNota":"Paragem de 20 minutos a caminho de outra coisa, não um destino. Boa para esticar as pernas na última noite.","lat":41.323,"lng":19.8226},{"id":"al-dhermi-aldeia","nome":"Aldeia velha de Dhërmi","categoria":"Cultura","descricaoCurta":"Aldeia de pedra na encosta, com igrejas bizantinas e vista sobre a costa.","descricaoCompleta":"Acima da praia, a aldeia antiga de Dhërmi mantém casas de pedra, ruelas estreitas e um conjunto de pequenas igrejas ortodoxas medievais espalhadas pela encosta. É o contraponto tranquilo aos beach clubs lá em baixo, e a vista sobre a baía ao fim da tarde é melhor do que a da praia.","gratis":true,"distanciaAlojamento":"Acima da praia de Dhërmi","mapsQuery":"Dhermi old village Albania","recomendacao":7.7,"recomendacaoNota":"Bom uso da hora antes do pôr do sol no dia da excursão — mas exige subir a encosta com calor.","lat":40.1495,"lng":19.6455}],"praias":[{"id":"al-himare-praia","nome":"Praia de Himarë","categoria":"Praia","descricaoCurta":"Praia principal, ladeada de cafés e restaurantes — base da estadia.","descricaoCompleta":"A Praia de Himarë é menos 'cartão-postal secreto' e mais base prática da viagem. Fica junto ao centro, com cafés, restaurantes, mercados e alojamentos por perto, o que a torna perfeita para dias sem logística. O valor está nessa facilidade: acordar, tomar café, nadar, voltar ao quarto, sair para jantar, tudo a pé. A praia também ajuda a observar a vida local e o ritmo de Setembro, quando a Riviera já não está no pico caótico de Julho/Agosto. Usa-a como praia de manutenção: boa para primeiro banho, fim de tarde, dias cansados e planos flexíveis entre atividades maiores.","gratis":true,"distanciaAlojamento":"Himarë","mapsQuery":"Himare Beach Albania","fonte":"https://himara.net/blog/himara-bus-station-guide","foto":"https://www.islands.com/img/gallery/europes-most-underappreciated-destination-is-a-beachy-and-affordable-albanian-paradise/l-intro-1735832196.jpg","recomendacao":8.0,"recomendacaoNota":"A praia da porta ao lado: sem transporte, sem plano, bom para as manhãs em que só queres desligar.","lat":40.1005,"lng":19.7448},{"id":"al-dhermi-praia","nome":"Praia de Dhërmi/Drymades","categoria":"Praia","descricaoCurta":"Praia da excursão de um dia, mistura de seixos e areia.","descricaoCompleta":"Dhërmi/Drymades é a versão mais expansiva e fotogénica da Riviera: praia longa, água azul forte, montanha a cair sobre o mar e uma camada de beach clubs que tornou a zona famosa no verão. A aldeia antiga fica mais acima, nas encostas, e a zona de praia desenvolveu-se como destino sazonal. Em Setembro, a vantagem é haver menos confusão; o risco é alguns clubes já estarem a reduzir ritmo. Vale como excursão de um dia desde Himarë para mudar de cenário, ver o sunset e testar se ainda há nightlife. Combina táxi de ida e volta antes de beber.","gratis":true,"mapsQuery":"Dhermi Beach Albania","fonte":"https://en.wikipedia.org/wiki/Dh%C3%ABrmi","foto":"https://reisgenie.nl/wp-content/uploads/2024/06/dhermi-beach-1.jpg","recomendacao":8.6,"recomendacaoNota":"A praia mais bonita a que chegas de táxi a partir de Himarë — justifica a excursão de um dia. Drymades tem a água mais limpa e os beach clubs.","lat":40.15,"lng":19.6395},{"id":"al-livadhi","nome":"Praia de Livadhi","categoria":"Praia","descricaoCurta":"A praia grande de Himarë — longa, de seixo, nunca cheia.","descricaoCompleta":"Livadhi é a praia mais elogiada de toda a zona de Himarë: uma extensão longa de seixo e água transparente, com espaço suficiente para não ficar apinhada mesmo em época alta. Tem bares e aluguer de espreguiçadeiras numa ponta e zonas completamente vazias na outra. Daqui saem também caminhadas curtas pela costa, incluindo a que leva à Aquarium Beach.","gratis":true,"estacionamento":"Não aplicável (sem carro)","distanciaAlojamento":"~10 min de táxi ou caminhada longa desde o centro","mapsQuery":"Livadhi Beach Himare","recomendacao":8.8,"recomendacaoNota":"A melhor praia acessível sem carro a partir da tua base — e a única com escala para desaparecer durante um dia inteiro.","lat":40.0925,"lng":19.7385},{"id":"al-potami","nome":"Praia de Potami","categoria":"Praia","descricaoCurta":"A praia mais recolhida do lado sul da baía de Himarë.","descricaoCompleta":"Fica na ponta sul da baía, mais afastada do centro e por isso normalmente mais calma. Água muito clara e fundo de seixo, com alguns bares de praia sazonais. Boa escolha para uma manhã em que queiras evitar a movimentação do centro.","gratis":true,"distanciaAlojamento":"Sul da baía de Himarë, curta caminhada/táxi","mapsQuery":"Potami Beach Himare","recomendacao":8.4,"recomendacaoNota":"Alternativa directa à praia de Himarë quando quiseres o mesmo sem gente. Chega-se a pé com paciência.","lat":40.0865,"lng":19.7345},{"id":"al-aquarium","nome":"Aquarium Beach","categoria":"Praia","descricaoCurta":"Enseada escondida entre rochas, acessível a pé desde Livadhi.","descricaoCompleta":"Pequena enseada entre rochedos com água tão transparente que dá nome à praia. Chega-se por uma caminhada curta a partir de Livadhi, o que a mantém quase sempre vazia. É o melhor sítio da zona para snorkel a partir de terra — leva óculos.","gratis":true,"distanciaAlojamento":"Caminhada curta desde a praia de Livadhi","mapsQuery":"Aquarium Beach Himare","recomendacao":8.2,"recomendacaoNota":"Junta caminhada e água transparente numa só manhã, sem depender de barco nem de táxi — exactamente o tipo de coisa que procuras nesta viagem.","lat":40.091,"lng":19.7375},{"id":"al-jale","nome":"Praia de Jalë","categoria":"Praia","descricaoCurta":"Baía entre Himarë e Dhërmi, com beach clubs e ambiente mais jovem.","descricaoCompleta":"Jalë é a baía onde se concentra parte da noite da Riviera (Folie Marina, Salinas) e onde a praia tem mais música do que silêncio. Em Setembro fica bastante mais calma — o que pode ser bom ou mau, conforme o que procures nesse dia.","gratis":true,"distanciaAlojamento":"Entre Himarë e Dhërmi (táxi)","mapsQuery":"Jale Beach Albania","recomendacao":7.6,"recomendacaoNota":"Só compensa o táxi se quiseres o ambiente de beach club; para nadar, Livadhi e Aquarium são melhores e mais perto.","lat":40.133,"lng":19.698}],"nightlife":[{"id":"al-himare-mojo","nome":"Mojo","categoria":"Nightlife","descricaoCurta":"Bar mais movimentado de Himarë — mistura de casais, grupos, solo e locais.","descricaoCompleta":"Mojo é o bar de Himarë para uma noite fácil, sem transformar o plano numa operação. A vantagem não é luxo nem conceito: é movimento, mistura de viajantes, locais, casais e grupos, e uma energia mais social do que muitos bares pequenos da marginal. Funciona bem depois de jantar, sobretudo se estiveres sozinho e quiseres ficar disponível para conversa sem entrar num club pesado. Em Setembro, é mais seguro apostar neste tipo de bar central do que depender exclusivamente dos beach clubs de Dhërmi. Vai para um ou dois copos; se estiver morto, muda rápido para Lido ou Thea.","precoSimbolo":"€€","mapsQuery":"Mojo bar Himare","fonte":"https://himara.net/blog/himara-nightlife-guide","foto":"https://www.greencoast-albania.com/wp-content/uploads/sites/10/2024/09/himare-mojo-cocktails-bar.jpg","recomendacao":8.2,"recomendacaoNota":"O bar com o público mais variado de Himarë — a melhor hipótese de conversa para quem viaja sozinho. Não é clube pesado.","lat":40.101,"lng":19.744,"coordAproximada":true},{"id":"al-himare-lido","nome":"Lido Cocktail Bar","categoria":"Nightlife","descricaoCurta":"Bar de cocktails junto à costa.","descricaoCompleta":"Lido Cocktail Bar é uma alternativa simples para beber junto à costa, com menos pressão de 'noite grande'. É o tipo de lugar que encaixa bem depois de um dia de praia ou barco: cocktail, ar do mar, gente a passar e pouca logística. Não precisa ser o destino principal da noite; pode ser paragem entre jantar e cama, ou plano B se Mojo estiver vazio. A vantagem de Himarë é justamente esta: nightlife compacta, onde dá para testar dois ou três sítios a pé antes de decidir ficar. Em Setembro, olha primeiro para o movimento real na rua e escolhe pelo ambiente, não pelo nome.","precoSimbolo":"€€","mapsQuery":"Lido Cocktail Bar Himare","fonte":"https://himara.net/blog/himara-nightlife-guide","foto":"https://photos.wikimapia.org/p/00/08/98/76/05_big.jpg","recomendacao":7.8,"recomendacaoNota":"Cocktails junto ao mar, ambiente descontraído. Terceira escolha se as outras duas estiverem mortas.","lat":40.1005,"lng":19.7435,"coordAproximada":true},{"id":"al-himare-thea","nome":"Thea Rooftop Bar","categoria":"Nightlife","descricaoCurta":"Bar de terraço com vista sobre Himarë.","descricaoCompleta":"Thea Rooftop Bar vale pela perspetiva: subir um pouco, beber algo e ver Himarë de cima em vez de ficar sempre ao nível da praia. É melhor para início de noite ou fim de tarde do que para madrugada, especialmente se quiseres um momento mais calmo antes de decidir se sais de verdade. A vista ajuda a ligar as peças da estadia: a praia, a marginal, as colinas e a vila antiga. Pensa nele como bar de transição: bom para um cocktail, uma nota no telemóvel, fotos e leitura do ambiente antes de descer para Mojo, Lido ou simplesmente jantar.","precoSimbolo":"€€","mapsQuery":"Thea Rooftop Bar Himare","fonte":"https://himara.net/blog/himara-nightlife-guide","foto":"https://himara.net/images/businesses/bars/thea-rooftop/01.webp","recomendacao":8.0,"recomendacaoNota":"Rooftop com vista para começar a noite. Faz par natural com o Mojo a seguir, descendo para a marginal.","lat":40.1015,"lng":19.7445,"coordAproximada":true},{"id":"al-havana","nome":"Havana Beach Club","categoria":"Nightlife","descricaoCurta":"O beach club mais conhecido de Dhërmi — piscina, DJs, festas.","descricaoCompleta":"Havana Beach Club representa o lado mais conhecido e festivo de Dhërmi: piscina, DJs, estética de beach club e noites longas em época alta. É o tipo de lugar que tornou a Riviera albanesa mais visível para viajantes jovens, mas também é muito sazonal. Em Setembro, convém tratar como possibilidade e não garantia; antes de organizar táxi e noite, confirma nas redes sociais ou pergunta localmente se há evento. Se estiver aberto e com público, pode ser a noite mais energética da viagem. Se estiver vazio, não forces: a excursão a Dhërmi ainda vale por praia e sunset.","precoSimbolo":"€€","precoPessoa":20,"precoInclui":"consumo mínimo estimado","mapsQuery":"Havana Beach Club Dhermi","fonte":"https://terrainvestsolutions.com/blog/beyond-the-beach-adventure-activities-albanian-riviera/","foto":"https://photos.wikimapia.org/p/00/07/95/40/92_big.jpg","recomendacao":7.0,"recomendacaoNota":"Nome maior da noite da Riviera, mas em Setembro a época já está a fechar — confirma no próprio dia antes de contar com ele.","lat":40.1505,"lng":19.64},{"id":"al-salinas","nome":"Salinas / Folie Marina","categoria":"Nightlife","descricaoCurta":"Alternativa em Jalë, também muito conhecida na Riviera.","descricaoCompleta":"Salinas / Folie Marina, na zona de Jalë, é a alternativa se a noite de Dhërmi estiver fraca ou se ouvires localmente que há evento melhor ali. Jalë tem reputação de praia mais jovem e festiva, com clubes e música em época alta, mas sofre da mesma sazonalidade: setembro pode ser ótimo ou pode parecer fim de temporada. O valor deste item é funcionar como carta na manga, não como obrigação. Antes de ir, confirma distância, táxi de regresso e programação; depois de beber, não improvises transporte. Se houver evento, pode compensar mais do que Havana.","precoSimbolo":"€€","precoPessoa":18,"precoInclui":"consumo mínimo estimado","mapsQuery":"Folie Marina Jale Albania","fonte":"https://terrainvestsolutions.com/blog/beyond-the-beach-adventure-activities-albanian-riviera/","foto":"https://www.greencoast-albania.com/wp-content/uploads/sites/10/2024/09/salinas-beach-bar-dhermi.jpg","recomendacao":6.8,"recomendacaoNota":"Mesma ressalva de época que o Havana, e ainda por cima em Jalë (mais um salto de táxi). Só se estiveres mesmo com vontade de clube.","lat":40.133,"lng":19.6975}]}]};

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s === undefined || s === null ? "" : String(s);
  return d.innerHTML;
}
function mapsDirUrl(query) {
  return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(query);
}
function waShareUrl(text) {
  return "https://wa.me/?text=" + encodeURIComponent(text);
}
function mailShareUrl(subject, body) {
  return "mailto:?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
}
function fmtPreco(item) {
  if (item.precoSimbolo === "Grátis" || item.gratis) return "Grátis";
  if (item.precoPessoa === undefined || item.precoPessoa === null) return "Preço não disponível";
  const pessoas = DATA.meta.numeroPessoas || 1;
  const total = (Number(item.precoPessoa) * pessoas).toFixed(0);
  return `${item.precoSimbolo || ""} ~€${item.precoPessoa}/pessoa` + (pessoas > 1 ? ` · total ~€${total}` : "");
}

let tabAtual = "resumo";
let destinoSubtab = {};
const storageKey = "travel-os:roteiro:" + viagemSlug();
let salvosMemoria = loadSalvos();

function recNivel(v) {
  return v >= 8.5 ? "alta" : (v >= 7 ? "media" : "baixa");
}

function recBadgeHtml(v, extraClass) {
  if (v === undefined || v === null || v === "") return "";
  const n = Number(v);
  if (isNaN(n)) return "";
  return `<span class="rec ${recNivel(n)}${extraClass ? " " + extraClass : ""}" title="Índice de recomendação para este perfil de viagem (0-10)">★ ${n.toFixed(1).replace(".", ",")}</span>`;
}

function recValor(it) {
  if (!it || it.recomendacao === undefined || it.recomendacao === null) return -1;
  const n = Number(it.recomendacao);
  return isNaN(n) ? -1 : n;
}

function render() {
  renderTabsTopo();
  renderMain();
}

function renderTabsTopo() {
