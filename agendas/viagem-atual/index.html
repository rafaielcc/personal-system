ro e Côa, cozinha de tradição beirã.","descricaoCompleta":"Dentro do próprio Museu do Côa, este restaurante combina uma vista privilegiada sobre o vale com uma cozinha bem enraizada na tradição da Beira: cabrito e bacalhau muito bem confecionados, com destaque para as migas que acompanham o cabrito. Bom sítio para o almoço do dia da visita ao museu e ao parque arqueológico.","precoSimbolo":"€€","distanciaAlojamento":"~20 min de carro","mapsQuery":"Restaurante Museu do Côa","recomendacao":8.4,"recomendacaoNota":"Vista + comida regional bem feita, mesmo ao lado do museu — combina perfeitamente com a manhã de arte rupestre."},{"id":"dr-preguica","nome":"Petiscaria Preguiça","categoria":"Petiscos / Peixe do Rio","descricaoCurta":"Peixe do rio frito e sopa, vista sobre o rio Douro, em Freixo de Numão.","descricaoCompleta":"Petisqueira simples em Freixo de Numão com vista sobre o Douro — peixe do rio frito é a especialidade, ambiente informal e sem cerimónia. Boa opção de almoço depois da manhã a explorar o Castelo Velho e as ruínas.","precoSimbolo":"€","distanciaAlojamento":"~10 min de carro","mapsQuery":"Petisqueira Preguiça Freixo de Numão","recomendacao":7.8,"recomendacaoNota":"Simples, barato e com vista — sem grandes cerimónias, boa pausa a meio do dia."},{"id":"dr-restaurante-sao-leonardo","nome":"Restaurante São Leonardo","categoria":"Gastronomia do Douro","descricaoCurta":"Junto ao melhor miradouro do Douro Vinhateiro, em São Leonardo da Galafura.","descricaoCompleta":"Mesmo junto ao Miradouro de São Leonardo da Galafura, o restaurante aproveita a mesma vista de 640 m sobre o Douro. Bom ponto de paragem depois do miradouro, antes de continuar para a quinta à tarde.","precoSimbolo":"€€","distanciaAlojamento":"Douro Vinhateiro (dia de escapadela)","mapsQuery":"Restaurante Sao Leonardo Galafura","recomendacao":7.9,"recomendacaoNota":"Aproveita a vista do miradouro sem teres de te deslocar outra vez — prático para o dia mais longo da viagem."},{"id":"dr-rebentao","nome":"O Rebentão","categoria":"Gastronomia Transmontana","descricaoCurta":"Bife à lareira e posta em Torre de Moncorvo.","descricaoCompleta":"Em Torre de Moncorvo, especialista em carnes grelhadas à lareira — bife, posta à lareira, costeleta de vitela — além de polvo à lagareiro e bacalhau assado na brasa. Cozinha transmontana sem grandes voltas, feita bem.","precoSimbolo":"€€","distanciaAlojamento":"~25 min de carro","mapsQuery":"O Rebentao Torre de Moncorvo","recomendacao":7.9,"recomendacaoNota":"Carnes à lareira bem feitas, ambiente sem pretensões — bom fecho para o dia mais tranquilo da viagem."},{"id":"dr-adega-caneco","nome":"Adega O Caneco","categoria":"Gastronomia Transmontana","descricaoCurta":"Casa de comidas em Torre de Moncorvo desde 1981.","descricaoCompleta":"Adega tradicional em Torre de Moncorvo a servir comida caseira desde 1981 — cozinha simples e genuína, sem artifícios. Boa alternativa ao Rebentão se preferirem algo ainda mais informal.","precoSimbolo":"€","distanciaAlojamento":"~25 min de carro","mapsQuery":"Adega O Caneco Torre de Moncorvo","recomendacao":7.3,"recomendacaoNota":"Décadas de história na cozinha — casa antiga, sem pressa nenhuma."},{"id":"dr-calca-curta","nome":"Restaurante Calça Curta","categoria":"Peixe do Rio","descricaoCurta":"Escabeche, ensopado de enguias e arroz de lampreia, vista sobre o Douro.","descricaoCompleta":"Em Carrazeda de Ansiães, especialista em peixe do rio: escabeche, ensopado e caldeirada de enguias, arroz de lampreia e sável — pratos que raramente se encontram fora desta zona do Douro. Vista sobre o rio incluída.","precoSimbolo":"€€","distanciaAlojamento":"~20 min de carro","mapsQuery":"Restaurante Calca Curta Carrazeda de Ansiaes","recomendacao":8.0,"recomendacaoNota":"Pratos de peixe de rio que não se encontram em qualquer lado — vale o desvio para quem gosta de sair da carne."},{"id":"dr-taberna-helena","nome":"Taberna da Helena","categoria":"Casual","descricaoCurta":"Cozinha mediterrânica e europeia em Carrazeda de Ansiães.","descricaoCompleta":"Ambiente descontraído em Carrazeda de Ansiães, cozinha mais europeia/mediterrânica do que transmontana clássica — boa opção para variar se já tiverem comido carnes grelhadas e peixe de rio nos dias anteriores.","precoSimbolo":"€€","distanciaAlojamento":"~20 min de carro","mapsQuery":"Taberna da Helena Carrazeda de Ansiaes","recomendacao":7.5,"recomendacaoNota":"Boa opção para variar o registo a meio da semana."},{"id":"dr-a-lareira","nome":"A Lareira","categoria":"Gastronomia Transmontana","descricaoCurta":"Restaurante em Vila Nova de Foz Côa.","descricaoCompleta":"Um dos restaurantes bem cotados de Vila Nova de Foz Côa, cozinha regional. Boa opção de reserva no centro da vila, perto do museu e do parque arqueológico.","precoSimbolo":"€€","distanciaAlojamento":"~20 min de carro","mapsQuery":"A Lareira Vila Nova de Foz Coa","recomendacao":7.6,"recomendacaoNota":"Alternativa central em Foz Côa, ainda não testada — vale reservar com antecedência."},{"id":"dr-paleolitico","nome":"Restaurante Paleolítico","categoria":"Gastronomia Transmontana","descricaoCurta":"Restaurante em Vila Nova de Foz Côa, nome a condizer com a arte rupestre da região.","descricaoCompleta":"Outro nome bem cotado em Vila Nova de Foz Côa, batizado em homenagem à arte rupestre paleolítica do Vale do Côa. Cozinha regional no centro da vila.","precoSimbolo":"€€","distanciaAlojamento":"~20 min de carro","mapsQuery":"Restaurante Paleolitico Vila Nova de Foz Coa","recomendacao":7.5,"recomendacaoNota":"Nome divertido, localização central — boa opção de reserva em Foz Côa."}],"atracoes":[{"id":"dr-fraga-ola","nome":"Miradouro e Cascata da Fraga do Ôla","categoria":"Miradouro","gratis":true,"descricaoCurta":"Estrutura metálica com vista sobre a cascata e o vale do Douro, mesmo ao pé do alojamento.","descricaoCompleta":"Estrutura metálica construída de raiz sobre a cascata da Fraga do Ôla, com vista panorâmica extraordinária sobre um grande troço do vale do Douro e do ribeiro da aldeia. Fica na estrada municipal que liga o Pinhal do Douro a Coleja — literalmente ao virar da esquina do alojamento.","distanciaAlojamento":"A poucos minutos a pé/carro","mapsQuery":"Miradouro Fraga do Ola Pinhal do Douro","recomendacao":8.6,"recomendacaoNota":"O miradouro mais conveniente de toda a viagem — literalmente ao pé de casa, ótimo para o fim do primeiro dia com os cães."},{"id":"dr-santa-barbara","nome":"Miradouro de Santa Bárbara","categoria":"Miradouro","gratis":true,"descricaoCurta":"Vista sobre o Douro Superior, perto do alojamento.","descricaoCompleta":"Miradouro na mesma zona do Pinhal do Douro, com vista aberta sobre o Douro Superior. Boa opção rápida para uma pausa ao ar livre com os cães sem grande deslocação.","distanciaAlojamento":"Muito perto do alojamento","mapsQuery":"Miradouro Santa Barbara Pinhal do Douro","recomendacao":7.8,"recomendacaoNota":"Alternativa rápida à Fraga do Ôla, sem quase nenhuma condução."},{"id":"dr-sao-martinho","nome":"Miradouro de São Martinho e Barragem da Valeira","categoria":"Miradouro","gratis":true,"descricaoCurta":"Vista sobre a barragem da Valeira, no rio Douro.","descricaoCompleta":"Vista sobre a Barragem da Valeira, uma das barragens do rio Douro, com a paisagem típica de socalcos e encosta a pique sobre a água. Fica no caminho entre o alojamento e Freixo de Numão, fácil de encaixar noutro dia.","distanciaAlojamento":"~10 min de carro","mapsQuery":"Miradouro Sao Martinho Barragem da Valeira","recomendacao":8.0,"recomendacaoNota":"Vista de barragem/socalcos sem sair da vizinhança imediata do alojamento."},{"id":"dr-castelo-velho","nome":"Freixo de Numão — Castelo Velho e Ruínas do Prazo","categoria":"História","descricaoCurta":"Aldeia com camadas de ocupação pré-histórica, romana e medieval, e um miradouro.","descricaoCompleta":"Freixo de Numão é uma pequena vila que concentra uma densidade rara de património: o Castelo Velho (sítio pré-histórico com miradouro), as Ruínas do Prazo (ocupação desde a pré-história até época romana e medieval, um dos complexos arqueológicos mais bem preservados do país), o Museu da Casa Grande (etnografia local — pastorícia, vinho, azeite e amêndoa) e o pelourinho da vila. Dá para passear tudo a pé, boa parte ao ar livre.","distanciaAlojamento":"~10 min de carro","mapsQuery":"Freixo de Numao Castelo Velho","recomendacao":8.7,"recomendacaoNota":"Talvez a manhã mais rica em história de toda a viagem, e tudo a uma curta distância do alojamento."},{"id":"dr-museu-coa","nome":"Museu do Côa","categoria":"Museu","precoSimbolo":"€","descricaoCurta":"Museu de contexto para a arte rupestre paleolítica do Vale do Côa, Património Mundial UNESCO.","descricaoCompleta":"Construído numa das encostas onde se encontram os rios Douro e Côa, o Museu do Côa serve de porta de entrada para a maior coleção a céu aberto de arte rupestre paleolítica do mundo (gravuras datadas de há 22.000 a 10.000 anos). Tem também um miradouro próprio sobre o rio e os socalcos do Douro. Bilhete combinado com o Museu da Casa Grande: €6,50 (€4 reduzido).","distanciaAlojamento":"~20 min de carro","mapsQuery":"Museu do Coa Vila Nova de Foz Coa","recomendacao":9.0,"recomendacaoNota":"Essencial para dar contexto antes de ver as gravuras a sério no parque arqueológico — não saltar este passo.","dicas":"Fechado às segundas-feiras e nos feriados de 1 Jan, Páscoa, 1 Mai e 25 Dez."},{"id":"dr-parque-coa","nome":"Parque Arqueológico do Vale do Côa","categoria":"Arqueologia","precoSimbolo":"€€","descricaoCurta":"Visitas guiadas às gravuras rupestres paleolíticas, em veículos todo-o-terreno.","descricaoCompleta":"As visitas às gravuras propriamente ditas fazem-se a partir dos centros de receção de Muxagata e Castelo Melhor, em grupos de 8 pessoas, com transporte todo-o-terreno do próprio parque, até três sítios: Canada do Inferno, Penascosa e Ribeira de Piscos. Bilhete normal: €10 por pessoa e por sítio visitado. Reserva prévia obrigatória.","distanciaAlojamento":"~25-30 min de carro (Muxagata/Castelo Melhor)","mapsQuery":"Centro de Receção Muxagata Parque Arqueologico Coa","recomendacao":9.2,"recomendacaoNota":"O grande motivo de vir a esta zona do Douro — reservar com bastante antecedência, os grupos são pequenos.","dicas":"Confirmar antes se os cães podem ir no veículo todo-o-terreno (+351 279 768 260 / visitas@arte-coa.pt) — se não puderem, combinar revezamento entre os dois."},{"id":"dr-foz-coa-centro","nome":"Centro histórico de Vila Nova de Foz Côa","categoria":"História","gratis":true,"descricaoCurta":"Igreja Matriz manuelina e pelourinho, no centro da vila.","descricaoCompleta":"A Igreja Matriz de estilo manuelino e o pelourinho são os pontos altos de um passeio a pé pelo centro de Vila Nova de Foz Côa — vila pequena, fácil de percorrer com os cães depois do almoço.","distanciaAlojamento":"~20 min de carro","mapsQuery":"Igreja Matriz Vila Nova de Foz Coa","recomendacao":7.4,"recomendacaoNota":"Passeio leve para fechar a tarde, sem grande investimento de tempo."},{"id":"dr-faia-brava","nome":"Reserva da Faia Brava","categoria":"Natureza","gratis":true,"descricaoCurta":"Maior reserva privada de conservação de Portugal — trilhos e observação de aves.","descricaoCompleta":"A maior área de conservação privada do país, com trilhos e boas condições para observação de aves de rapina sobre as escarpas do Côa. Alternativa mais tranquila e ao ar livre ao centro histórico de Foz Côa, se preferirem mais natureza e menos pedra.","distanciaAlojamento":"~25 min de carro","mapsQuery":"Reserva Faia Brava","recomendacao":8.1,"recomendacaoNota":"Boa opção se estiverem saturados de igrejas e museus — natureza pura, e os cães vão adorar."},{"id":"dr-sao-leonardo","nome":"Miradouro de São Leonardo da Galafura","categoria":"Miradouro","gratis":true,"descricaoCurta":"O melhor miradouro do Douro Vinhateiro clássico, a 640 m de altitude.","descricaoCompleta":"Considerado o melhor miradouro de todo o Alto Douro, a 640 m de altitude, com vista desimpedida sobre o rio e os socalcos. Tem capela, zona de piquenique com bancos de pedra e sombra, e um marco geodésico. Fica bem mais longe do alojamento do que os miradouros do dia a dia — vale a pena confirmar se compensa a condução extra com os cães.","distanciaAlojamento":"Douro Vinhateiro (dia de escapadela)","mapsQuery":"Miradouro Sao Leonardo da Galafura","recomendacao":8.8,"recomendacaoNota":"A vista mais icónica de todo o Douro — mas é o dia que exige mais condução, pesar bem se vale a pena com os cães no carro."},{"id":"dr-quinta-vallado","nome":"Quinta do Vallado","categoria":"Vinho","precoSimbolo":"€€","descricaoCurta":"Quinta em Peso da Régua que aceita cães, com passeio pelas vinhas.","descricaoCompleta":"Uma das poucas quintas do Douro claramente preparadas para receber cães — passeio pelas vinhas incluído. A prova de vinhos em si é melhor fazer-se por turnos, com um dos dois a ficar de fora com o Pub e o Dexter, já que o espaço de prova costuma ser interior.","distanciaAlojamento":"Douro Vinhateiro (dia de escapadela)","mapsQuery":"Quinta do Vallado Peso da Regua","recomendacao":8.3,"recomendacaoNota":"Rara quinta genuinamente pet-friendly no Douro — vale a pena por isso mesmo.","dicas":"Reservar a visita com antecedência e perguntar diretamente sobre a política de animais no momento da reserva."},{"id":"dr-quinta-sol","nome":"Quinta do Sol (Tendais)","categoria":"Turismo Rural","precoSimbolo":"€€","descricaoCurta":"Turismo rural pet-friendly no Douro, com animais da quinta.","descricaoCompleta":"Propriedade de turismo rural onde os animais de estimação são bem-vindos — tem égua, cabras-anãs, faisões e cães da Serra da Estrela residentes. Mais casual e menos focada em vinho do que a Quinta do Vallado, boa alternativa se preferirem um ambiente de quinta tradicional.","distanciaAlojamento":"Douro Vinhateiro (dia de escapadela)","mapsQuery":"Quinta do Sol Tendais","recomendacao":7.7,"recomendacaoNota":"Mais quinta tradicional do que enoturismo — boa se quiserem variar function esc(s) {
  const d = document.createElement("div");
  d.textContent = s === undefined || s === null ? "" : String(s);
  return d.innerHTML;
}
function mapsDirUrl(query) {
  return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(query);
}
function waShareUrl(text) {
  return "https://wa.me/?text=" + encodeURIComponent(text);
}
function mailShareUrl(subject, body) {
  return "mailto:?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
}
function fmtPreco(item) {
  if (item.precoSimbolo === "Grátis" || item.gratis) return "Grátis";
  if (item.precoPessoa === undefined || item.precoPessoa === null) return "Preço não disponível";
  const pessoas = DATA.meta.numeroPessoas || 1;
  const total = (Number(item.precoPessoa) * pessoas).toFixed(0);
  return `${item.precoSimbolo || ""} ~€${item.precoPessoa}/pessoa` + (pessoas > 1 ? ` · total ~€${total}` : "");
}

let tabAtual = "resumo";
let destinoSubtab = {};
const storageKey = "travel-os:roteiro:" + viagemSlug();
let salvosMemoria = loadSalvos();

function recNivel(v) {
  return v >= 8.5 ? "alta" : (v >= 7 ? "media" : "baixa");
}

function recBadgeHtml(v, extraClass) {
  if (v === undefined || v === null || v === "") return "";
  const n = Number(v);
  if (isNaN(n)) return "";
  return `<span class="rec ${recNivel(n)}${extraClass ? " " + extraClass : ""}" title="Índice de recomendação para este perfil de viagem (0-10)">★ ${n.toFixed(1).replace(".", ",")}</span>`;
}

function recValor(it) {
  if (!it || it.recomendacao === undefined || it.recomendacao === null) return -1;
  const n = Number(it.recomendacao);
  return isNaN(n) ? -1 : n;
}

function render() {
  renderTabsTopo();
  renderMain();
}

function renderTabsTopo() {
  const tabs = [{ id: "resumo", label: "Resumo" }, { id: "logistica", label: "Logística" }, { id: "roteiro", label: "Roteiro" }]
    .concat(DATA.destinos.map((d) => ({ id: d.id, label: d.nome })));
  document.getElementById("tabsTopo").innerHTML = tabs.map((t) => `
    <button class="tab ${tabAtual === t.id ? "ativo" : ""}" data-tab="${t.id}">${esc(t.label)}</button>`).join("");
}

function renderMain() {
  const main = document.getElementById("main");
  if (tabAtual === "resumo") { main.innerHTML = renderResumo(); return; }
  if (tabAtual === "logistica") { main.innerHTML = renderLogistica(); return; }
  if (tabAtual === "roteiro") { main.innerHTML = renderRoteiro(); return; }
  const destino = DATA.destinos.find((d) => d.id === tabAtual);
  if (destino) { main.innerHTML = renderDestino(destino); return; }
}

function viagemSlug() {
  const raw = (DATA.meta && (DATA.meta.slug || DATA.meta.titulo)) || "viagem";
  return String(raw).normalize("NFD").replace(/[̀-ͯ]/g, "")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "viagem";
}

function loadSalvos() {
  try {
    const raw = window.localStorage.getItem(storageKey);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed.filter(Boolean) : [];
  } catch (e) {
    return [];
  }
}

function saveSalvos() {
  try {
    window.localStorage.setItem(storageKey, JSON.stringify(salvosMemoria));
  } catch (e) {
    // Em modo privado ou contextos restritos, o roteiro fica apenas em memória.
  }
}

function getSalvos() {
  return salvosMemoria.slice();
}

function isSalvo(id) {
  return salvosMemoria.includes(id);
}

function toggleSalvo(id) {
  if (!id) return;
  if (isSalvo(id)) salvosMemoria = salvosMemoria.filter((x) => x !== id);
  else salvosMemoria = salvosMemoria.concat(id);
  saveSalvos();
  render();
  if (document.getElementById("overlay").classList.contains("ativo")) openModal(id);
}

function renderResumo() {
  const m = DATA.meta;
  const highlights = (m.highlights || []).map((h) => `<li>${esc(h)}</li>`).join("");
  let fuelHtml = "";
  if (DATA.combustivel) {
    const f = DATA.combustivel;
    fuelHtml = `
      <div class="card-resumo">
        <h2 class="seccao" style="margin-top:0">Custos de combustível</h2>
        <div class="fuel-grid">

        <div class="fuel-resultado" id="fuelResultado"></div>

function calcFuel() {
  const distancia = Number(document.getElementById("fuelDistancia").value) || 0;
  const consumo = Number(document.getElementById("fuelConsumo").value) || 0;
  const preco = Number(document.getElementById("fuelPreco").value) || 0;
  const litros = (distancia * consumo) / 100;
  const custo = litros * preco;
  document.getElementById("fuelResultado").innerHTML =
    `Estimativa: <strong>${litros.toFixed(1)} L</strong> · <strong>~€${custo.toFixed(2)}</strong>`;
}

function renderRoteiro() {
  const ids = new Set(getSalvos());
  const salvos = [];
  DATA.destinos.forEach((destino) => {
    const todos = [].concat(destino.restaurantes || [], destino.atracoes || [], destino.praias || [], destino.nightlife || []);
    todos.forEach((item) => {
      if (ids.has(item.id)) salvos.push({ item, destino });
    });
  });

  if (!salvos.length) {
    return `
      <div class="card-resumo">
        <h2 class="seccao" style="margin-top:0">Roteiro salvo</h2>
        <p>Ainda não guardaste nada. Toca no ☆ de um restaurante, atração, praia ou bar para o adicionar aqui.</p>
      </div>`;
  }

  const porDestino = {};
  salvos.forEach(({ item, destino }) => {
    const destinoKey = destino.id || destino.nome;
    if (!porDestino[destinoKey]) porDestino[destinoKey] = { destino, categorias: {} };
    const cat = item.categoria || "Outros";
    (porDestino[destinoKey].categorias[cat] = porDestino[destinoKey].categorias[cat] || []).push(item);
  });

  return Object.keys(porDestino).map((destinoKey) => {
    const grupoDestino = porDestino[destinoKey];
    const tituloDestino = DATA.destinos.length > 1 ? `<h2 class="seccao">${esc(grupoDestino.destino.nome)}</h2>` : `<h2 class="seccao">Roteiro salvo</h2>`;
    const categorias = Object.keys(grupoDestino.categorias).map((cat) => `
      <div class="categoria-grupo">
        <p class="categoria-titulo">${esc(cat)}</p>
        <div class="grid-cards">
          ${grupoDestino.categorias[cat].map((it) => cardHtml(it)).join("")}
        </div>
      </div>`).join("");
    return `${tituloDestino}${categorias}`;
  }).join("");
}

function renderDestino(destino) {
  const sub = destinoSubtab[destino.id] || "itinerario";
  const subtabs = [
    { id: "itinerario", label: "Itinerário" },
    { id: "comer", label: "Comer" },
    { id: "ver", label: "Ver" },
    { id: "alojamento", label: "Alojamento" },
  ];
  const subtabsHtml = subtabs.map((t) => `
    <button class="subtab ${sub === t.id ? "ativo" : ""}" data-subtab="${t.id}">${esc(t.label)}</button>`).join("");

  let conteudo = "";
  if (sub === "itinerario") conteudo = renderItinerario(destino);
  else if (sub === "comer") conteudo = renderCards(destino.restaurantes || [], destino.id);
  else if (sub === "ver") conteudo = renderCardsVer(destino);
  else if (sub === "alojamento") conteudo = renderAlojamentoDestino(destino);

  return `<nav class="subtabs">${subtabsHtml}</nav><div style="padding-top:16px">${conteudo}</div>`;
}

function renderItinerario(destino) {
  const indice = (destino.dias || []).map((d, i) => `<a href="#dia-${destino.id}-${i}">${esc(d.data)}</a>`).join("");
  const dias = (destino.dias || []).map((d, i) => `
    <div class="dia-bloco" id="dia-${destino.id}-${i}">
      <h3 class="dia-titulo">${esc(d.data)} — ${esc(d.titulo)}</h3>
      ${(d.periodos || []).map((p) => `
        <div class="periodo">
          <p class="periodo-nome">${esc(p.periodo)}</p>
          ${(p.atividades || []).map((a) => atividadeHtml(a)).join("")}
        </div>`).join("")}
      <a class="voltar-indice" href="#topo-${destino.id}">↑ Voltar ao índice</a>
    </div>`).join("");
  return `<div id="topo-${destino.id}"></div><div class="indice-dias">${indice}</div>${dias}`;
}

function atividadeHtml(a) {
  const temAlternativas = !!(a.alternativas && a.alternativas.length);
  return `
    <div class="atividade">
      <div class="atividade-titulo">${esc(a.titulo)}${temAlternativas ? `<span class="sugerido-chip">Sugerido</span>` : ""}${recBadgeHtml(a.recomendacao)}</div>
      <div class="atividade-meta">${[a.horario, a.duracao].filter(Boolean).join(" · ")}</div>
      ${a.nota ? `<div class="atividade-nota">${esc(a.nota)}</div>` : ""}
      ${atividadeLinksHtml(a)}
      ${alternativasHtml(a)}
    </div>`;
}

function alternativasHtml(a) {
  const alts = (a.alternativas || []).slice();
  if (!alts.length) return "";
  alts.sort((x, y) => {
    const rx = x.recomendacao !== undefined && x.recomendacao !== null ? Number(x.recomendacao) : (x.itemId && findItemById(x.itemId) ? recValor(findItemById(x.itemId).item) : -1);
    const ry = y.recomendacao !== undefined && y.recomendacao !== null ? Number(y.recomendacao) : (y.itemId && findItemById(y.itemId) ? recValor(findItemById(y.itemId).item) : -1);
    return ry - rx;
  });
  const itens = alts.map((alt) => {
    const found = alt.itemId ? findItemById(alt.itemId) : null;
    const nome = alt.titulo || (found ? found.item.nome : "Alternativa");
    const rec = (alt.recomendacao !== undefined && alt.recomendacao !== null)
      ? alt.recomendacao
      : (found ? found.item.recomendacao : null);
    const nota = alt.nota || (found ? found.item.descricaoCurta : "");
    const acoes = [
      found ? `<button class="btn secundario" type="button" data-open-item="${esc(alt.itemId)}">Detalhes</button>` : "",
      found ? `<button class="btn secundario" type="button" data-salvo-toggle="${esc(alt.itemId)}">${isSalvo(alt.itemId) ? "★ Guardado" : "☆ Guardar"}</button>` : "",
      alt.mapsQuery ? `<a class="btn secundario" href="${mapsDirUrl(alt.mapsQuery)}" target="_blank" rel="noopener">Direções</a>` : "",
    ].filter(Boolean).join("");
    return `
      <div class="alt-item">
        <div class="alt-titulo">${esc(nome)}${recBadgeHtml(rec)}</div>
        ${nota ? `<div class="alt-nota">${esc(nota)}</div>` : ""}
        ${acoes ? `<div class="alt-acoes">${acoes}</div>` : ""}
      </div>`;
  }).join("");
  return `
    <details class="alt">
      <summary>▾ Em vez disto — ${alts.length} alternativa${alts.length > 1 ? "s" : ""}</summary>
      <div class="alt-lista">${itens}</div>
    </details>`;
}

function atividadeLinksHtml(a) {
  const links = [];
  (a.links || []).forEach((link) => links.push(link));
  const itemIds = [];
  if (a.itemId) itemIds.push(a.itemId);
  (a.itemIds || []).forEach((id) => itemIds.push(id));
  itemIds.forEach((id) => links.push({ itemId: id }));
  if (!links.length) return "";

  const html = links.map((link) => {
    if (link.itemId) {
      const found = findItemById(link.itemId);
      if (!found) return "";
      const label = link.label || found.item.nome || "Detalhes";
      return `<button class="btn secundario" type="button" data-open-item="${esc(link.itemId)}">${esc(label)}</button>`;
    }
    if (link.destinoId && link.subtab) {
      return `<button class="btn secundario" type="button" data-open-destino="${esc(link.destinoId)}" data-open-subtab="${esc(link.subtab)}">${esc(link.label || "Abrir")}</button>`;
    }
    if (link.tab) {
      return `<button class="btn secundario" type="button" data-open-tab="${esc(link.tab)}">${esc(link.label || "Abrir")}</button>`;
    }
    return "";
  }).filter(Boolean).join("");
  return html ? `<div class="atividade-acoes">${html}</div>` : "";
}

function renderCards(items, destinoId) {
  const grupos = {};
  items.forEach((it) => { (grupos[it.categoria] = grupos[it.categoria] || []).push(it); });
  // dentro de cada categoria, o melhor recomendado aparece primeiro
  Object.keys(grupos).forEach((cat) => grupos[cat].sort((a, b) => recValor(b) - recValor(a)));
  return Object.keys(grupos).map((cat) => `
    <div class="categoria-grupo">
      <p class="categoria-titulo">${esc(cat)}</p>
      <div class="grid-cards">
        ${grupos[cat].map((it) => cardHtml(it)).join("")}
      </div>
    </div>`).join("");
}

function renderCardsVer(destino) {
  const todos = [].concat(destino.atracoes || [], destino.praias || [], destino.nightlife || []);
  return renderCards(todos, destino.id);
}

function renderAlojamentoDestino(destino) {
  const items = destino.alojamento || [];
  if (!items.length) return "<p>Ainda não há alojamento definido para este destino.</p>";
  return `<ul class="lista-simples">${items.map((a) => a.aDecidir ? `
    <li class="alojamento-pendente">
      <strong>${a.morada ? esc(a.morada) + " — " : ""}${esc(a.checkin || "")}${a.checkout ? " a " + esc(a.checkout) : ""}<span class="pendente-badge">A decidir</span></strong>
      ${a.observacoes ? esc(a.observacoes) : "Ainda por escolher — ver ferramenta de seleção de alojamento."}
    </li>` : `
    <li>
      <strong>${esc(a.nome)}</strong>
      ${a.morada ? esc(a.morada) + "<br>" : ""}
      ${a.checkin ? `Check-in: ${esc(a.checkin)}` : ""}${a.checkout ? ` · Check-out: ${esc(a.checkout)}` : ""}<br>
      ${[a.plataforma, a.contacto, a.telefone, a.email].filter(Boolean).map(esc).join(" · ")}
      ${a.observacoes ? `<br><em>${esc(a.observacoes)}</em>` : ""}
      <div class="btn-row"><a class="btn secundario" href="${mapsDirUrl(a.mapsQuery || a.nome)}" target="_blank" rel="noopener">Direções</a></div>
    </li>`).join("")}</ul>`;
}

function cardHtml(it) {
  // src nunca fica "" — um <img src=""> nem sempre dispara onerror (em vários
  // browsers resolve para a própria página), por isso a falta de foto já
  // arranca directamente no placeholder; onerror cobre só o caso de URL quebrado.
  const src = it.foto || placeholderImg(it.nome);
  const salvo = isSalvo(it.id);
  return `
    <div class="card" data-item-id="${esc(it.id)}">
      ${recBadgeHtml(it.recomendacao, "card-rec")}
      <button class="salvo-btn ${salvo ? "ativo" : ""}" type="button" data-salvo-toggle="${esc(it.id)}" aria-pressed="${salvo ? "true" : "false"}" aria-label="${salvo ? "Remover do roteiro" : "Guardar no roteiro"}" title="${salvo ? "Remover do roteiro" : "Guardar no roteiro"}">${salvo ? "★" : "☆"}</button>
      <img src="${esc(src)}" alt="${esc(it.nome)}" loading="lazy" onerror="this.onerror=null;this.src=placeholderImg(this.alt)">
      <div class="card-body">
        <span class="card-categoria">${esc(it.categoria)}</span>
        <span class="card-nome">${esc(it.nome)}</span>
        <span class="card-desc">${esc(it.descricaoCurta)}</span>
        <span class="card-preco">${fmtPreco(it)}</span>
      </div>
    </div>`;
}

function placeholderImg(nome) {
  const letra = (nome || "?").trim().charAt(0).toUpperCase();
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'><rect width='100%' height='100%' fill='%23f1e4d2'/><text x='50%' y='50%' font-family='Georgia,serif' font-size='90' fill='%23a8763e' text-anchor='middle' dominant-baseline='central'>${letra}</text></svg>`;
  return "data:image/svg+xml," + svg;
}

function findItemById(id) {
  for (const d of DATA.destinos) {
    const all = [].concat(d.restaurantes || [], d.atracoes || [], d.praias || [], d.nightlife || []);
    const found = all.find((it) => it.id === id);
    if (found) return { item: found, destino: d };
  }
  return null;
}

function openModal(id) {
  const found = findItemById(id);
  if (!found) return;
  const it = found.item, destino = found.destino;
  const pessoas = DATA.meta.numeroPessoas || 1;
  const salvo = isSalvo(it.id);
  const precoBloco = it.gratis || it.precoSimbolo === "Grátis"
    ? `<div class="modal-linha"><span>Preço</span><span>Grátis</span></div>`

      ? `<div class="modal-linha"><span>Preço por pessoa</span><span>€${it.precoPessoa}${it.precoInclui ? " (" + esc(it.precoInclui) + ")" : ""}</span></div>
         ${pessoas > 1 ? `<div class="modal-linha"><span>Total (${pessoas} pessoas)</span><span>€${(it.precoPessoa * pessoas).toFixed(0)}</span></div>` : ""}`
      : `<div class="modal-linha"><span>Preço</span><span>Não disponível</span></div>`);
  const estacionamento = it.estacionamento ? `<div class="modal-linha"><span>🅿 Estacionamento</span><span>${esc(it.estacionamento)}</span></div>` : "";

  const botoes = [
    `<a class="btn" href="${mapsDirUrl(it.mapsQuery || it.nome)}" target="_blank" rel="noopener">Direções</a>`,
    it.siteOficial ? `<a class="btn secundario" href="${esc(it.siteOficial)}" target="_blank" rel="noopener">Site oficial</a>` : "",
    it.fonte ? `<a class="btn secundario" href="${esc(it.fonte)}" target="_blank" rel="noopener">Fonte</a>` : "",
    it.reserva ? `<a class="btn secundario" href="${esc(it.reserva)}" target="_blank" rel="noopener">Reserva / Bilhetes</a>` : "",
    `<a class="btn secundario" href="${waShareUrl("📍 " + it.nome + " — " + destino.nome + "\n" + (it.descricaoCurta || "") + "\n📍 " + mapsDirUrl(it.mapsQuery || it.nome))}" target="_blank" rel="noopener">WhatsApp</a>`,
    `<a class="btn secundario" href="${mailShareUrl(it.nome, (it.descricaoCompleta || it.descricaoCurta || "") + "\n\n" + mapsDirUrl(it.mapsQuery || it.nome))}">Email</a>`,
  ].filter(Boolean).join("");

  document.getElementById("modal").innerHTML = `
    <button class="modal-fechar" id="fecharModal">✕</button>
    <img src="${esc(it.foto || placeholderImg(it.nome))}" alt="${esc(it.nome)}" loading="lazy" onerror="this.onerror=null;this.src=placeholderImg(this.alt)">
    <div class="modal-body">
      <div class="modal-topo">
        <div>
          <span class="modal-categoria">${esc(it.categoria)}</span>
          <h3 class="modal-nome">${esc(it.nome)}</h3>
        </div>
        <button class="btn secundario" type="button" data-salvo-toggle="${esc(it.id)}" aria-pressed="${salvo ? "true" : "false"}">${salvo ? "★ Guardado" : "☆ Guardar"}</button>
      </div>
      <p class="modal-desc">${esc(it.descricaoCompleta || it.descricaoCurta || "")}</p>
      ${it.recomendacao !== undefined && it.recomendacao !== null ? `<div class="modal-linha"><span>Índice de recomendação</span><span>${recBadgeHtml(it.recomendacao)}</span></div>` : ""}
      ${it.recomendacaoNota ? `<p class="rec-nota">${esc(it.recomendacaoNota)}</p>` : ""}
      ${it.horario ? `<div class="modal-linha"><span>Horário</span><span>${esc(it.horario)}</span></div>` : ""}
      ${precoBloco}
      ${estacionamento}
      ${it.distanciaAlojamento ? `<div class="modal-linha"><span>Distância do alojamento</span><span>${esc(it.distanciaAlojamento)}</span></div>` : ""}
      ${it.reviews ? `<div class="modal-linha"><span>Reviews</span><span>${esc(it.reviews)}</span></div>` : ""}
      ${it.dicas ? `<p class="modal-dicas">${esc(it.dicas)}</p>` : ""}
      <div class="modal-botoes">${botoes}</div>
    </div>`;
  document.getElementById("overlay").classList.add("ativo");
  document.getElementById("fecharModal").addEventListener("click", closeModal);
}

function closeModal() {
  document.getElementById("overlay").classList.remove("ativo");
}

document.getElementById("overlay").addEventListener("click", (e) => {
  if (e.target.id === "overlay") closeModal();
});

document.getElementById("tabsTopo").addEventListener("click", (e) => {
  const btn = e.target.closest("button.tab");
  if (!btn) return;
  tabAtual = btn.dataset.tab;
  render();
});

document.getElementById("main").addEventListener("click", (e) => {
  const subtab = e.target.closest("button.subtab");
  if (subtab) {
    destinoSubtab[tabAtual] = subtab.dataset.subtab;
    renderMain();
    return;
  }
  const itemBtn = e.target.closest("[data-open-item]");
  if (itemBtn) {
    e.preventDefault();
    e.stopPropagation();
    openModal(itemBtn.dataset.openItem);
    return;
  }
  const destinoBtn = e.target.closest("[data-open-destino][data-open-subtab]");
  if (destinoBtn) {
    e.preventDefault();
    e.stopPropagation();
    tabAtual = destinoBtn.dataset.openDestino;
    destinoSubtab[tabAtual] = destinoBtn.dataset.openSubtab;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  const tabBtn = e.target.closest("[data-open-tab]");
  if (tabBtn) {
    e.preventDefault();
    e.stopPropagation();
    tabAtual = tabBtn.dataset.openTab;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  const salvoBtn = e.target.closest("[data-salvo-toggle]");
  if (salvoBtn) {
    e.preventDefault();
    e.stopPropagation();
    toggleSalvo(salvoBtn.dataset.salvoToggle);
    return;
  }
  const card = e.target.closest(".card");
  if (card) { openModal(card.dataset.itemId); return; }
  if (e.target.id === "fuelPartida" || e.target.id === "fuelConsumo" || e.target.id === "fuelDistancia" || e.target.id === "fuelPreco") return;
});
document.getElementById("main").addEventListener("input", (e) => {
  if (["fuelPartida", "fuelConsumo", "fuelDistancia", "fuelPreco"].includes(e.target.id)) calcFuel();
});
document.getElementById("modal").addEventListener("click", (e) => {
  const salvoBtn = e.target.closest("[data-salvo-toggle]");
  if (!salvoBtn) return;
  e.preventDefault();
  e.stopPropagation();
  toggleSalvo(salvoBtn.dataset.salvoToggle);
});

render();
if (DATA.combustivel) setTimeout(calcFuel, 0);
</script>
</body>
</html>
