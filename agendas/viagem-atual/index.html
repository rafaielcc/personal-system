"links":[{"label":"Detalhes: 20/44","itemId":"bg-2044"},{"label":"Detalhes: Lasta","itemId":"bg-lasta"}]}]}]},{"data":"6 Set (Dom)","titulo":"Belgrado → Tirana","periodos":[{"periodo":"Manhã","atividades":[{"titulo":"Museu Nikola Tesla ou Zemun","horario":"10:00","duracao":"2h","nota":"Opcional, conforme energia","links":[{"label":"Detalhes: Museu Tesla","itemId":"bg-tesla-museu"}]}]},{"periodo":"Tarde","atividades":[{"titulo":"Voo JU162 Belgrado → Tirana","horario":"13:20–14:30","nota":"Terminal 2","links":[{"label":"Ver voo","tab":"logistica"}]},{"titulo":"Check-in Metro Hotel Tirana","horario":"14:30","nota":"Rruga Nikolla Tupe Numer 3 — check-in disponível a partir das 14:00","links":[{"label":"Ver alojamento","destinoId":"albania","subtab":"alojamento"}]},{"titulo":"Centro de Tirana + Blloku","horario":"16:30","nota":"Jantar, eventualmente sair para beber algo","links":[{"label":"Detalhes: Oda","itemId":"al-oda"},{"label":"Detalhes: Era Blloku","itemId":"al-era-blloku"}]}]}]}],"restaurantes":[{"id":"bg-dva-jelena","nome":"Dva Jelena","categoria":"Local/Tasca","descricaoCurta":"Kafana histórica em Skadarlija, música ao vivo e comida sérvia clássica.","descricaoCompleta":"Dva Jelena é uma das grandes instituições de Skadarlija: uma kafana aberta em 1832, quando este bairro ainda estava a consolidar a sua fama boémia. Vale menos pela subtileza e mais pelo ritual completo: mesas de madeira, música tradicional ao vivo, pratos sérvios fartos e a sensação de jantar dentro de uma memória antiga de Belgrado. É boa escolha para a noite em Skadarlija porque combina comida, história local e ambiente social no mesmo sítio. Vai com fome, pede carne grelhada ou um prato tradicional da casa e aceita que o jantar possa ser mais barulhento e teatral do que elegante.","precoSimbolo":"€€","precoPessoa":20,"precoInclui":"prato + bebida","horario":"11:00–01:00","distanciaAlojamento":"10 min a pé","reviews":"4.3/5 (Google)","dicas":"Pedir mesa perto da banda para a experiência completa.","mapsQuery":"Dva Jelena Skadarlija Belgrade","fonte":"https://www.dvajelena.rs/en/about-us","foto":"https://www.kudaveceras.rs/images/news/1646874295-skadarlija-restoran-dva-jelena.jpg"},{"id":"bg-manufaktura","nome":"Manufaktura","categoria":"Fine Dining","descricaoCurta":"Cozinha sérvia contemporânea perto de Knez Mihailova.","descricaoCompleta":"Manufaktura é uma opção mais polida para experimentar comida sérvia sem cair no formato de taberna clássica. Fica numa zona central, perto de Knez Mihailova, e mistura cozinha local, produtos regionais e apresentação mais contemporânea. É útil no roteiro como almoço ou jantar 'arrumado': suficiente para sentir Belgrado gastronómica, mas sem exigir uma noite inteira como Skadarlija. A esplanada e os guarda-chuvas vermelhos tornaram-se quase uma imagem de marca; se estiver calor, tenta mesa fora. Bom para grelhados, queijos, enchidos, pão quente e pratos balcânicos com uma leitura mais moderna.","precoSimbolo":"€€€","precoPessoa":35,"precoInclui":"prato + bebida","horario":"12:00–00:00","distanciaAlojamento":"8 min a pé","mapsQuery":"Manufaktura restaurant Belgrade","foto":"https://www.beogradnocu.com/wp-content/uploads/2021/06/manufaktura-beograd-6-770x513.jpg"}],"atracoes":[{"id":"bg-kalemegdan","nome":"Fortaleza de Kalemegdan","categoria":"História","descricaoCurta":"Fortaleza no ponto onde o Sava encontra o Danúbio.","descricaoCompleta":"Kalemegdan é o lugar onde Belgrado fica mais fácil de entender: uma fortaleza sobre a confluência do Sava com o Danúbio, no mesmo ponto estratégico que fez a cidade ser disputada durante séculos. A zona tem camadas romanas, bizantinas, otomanas, austríacas e sérvias; mais do que 'ver muralhas', a graça é caminhar por um mapa vivo das mudanças de império nos Balcãs. Vai sem pressa, entra pelos portões, procura o Pobednik e guarda tempo para simplesmente olhar os rios. De manhã é mais calmo; ao fim da tarde a luz deixa a vista muito melhor.","gratis":true,"horario":"24h (parque)","distanciaAlojamento":"10 min a pé","mapsQuery":"Kalemegdan Fortress Belgrade","dicas":"Combina bem com uma caminhada até ao Portão de Stambol logo a seguir.","foto":"https://www.roadaffair.com/wp-content/uploads/2019/04/kalemegdan-fortress-belgrade-serbia-shutterstock_744488563.jpg","fonte":"https://en.wikipedia.org/wiki/Belgrade_Fortress"},{"id":"bg-knez-mihailova","nome":"Knez Mihailova","categoria":"Cultura","descricaoCurta":"Rua pedonal principal, cafés e arquitetura do séc. XIX.","descricaoCompleta":"Knez Mihailova é a espinha dorsal pedonal do centro antigo de Belgrado, ligando a Praça da República à entrada de Kalemegdan. A rua ganhou o seu ar atual no século XIX, quando a elite urbana construiu aqui fachadas comerciais e residenciais que ainda dão escala europeia à cidade. Hoje é mais passeio do que atração isolada: lojas, livrarias, cafés, artistas de rua e muito movimento local. Funciona bem depois de Kalemegdan, para regressar ao centro sem depender de transporte. Não precisa de plano: basta caminhar, parar para café e observar a mistura de Belgrado imperial, socialista e contemporânea.","gratis":true,"distanciaAlojamento":"5 min a pé","mapsQuery":"Knez Mihailova Belgrade","foto":"https://belgrade4you.com/img/tour_box_5.jpg"},{"id":"bg-skadarlija","nome":"Skadarlija","categoria":"Cultura","descricaoCurta":"Bairro boémio de ruas de calçada, antigo reduto de escritores e artistas.","descricaoCompleta":"Skadarlija é o bairro boémio de Belgrado, frequentemente comparado a uma pequena Montmartre balcânica. O caráter artístico consolidou-se no fim do século XIX e início do XX, quando escritores, atores e músicos passaram a ocupar as kafanas da rua depois do fecho de antigos pontos de encontro no centro. A calçada, as fachadas baixas e a música ao vivo criam uma experiência muito diferente de uma zona de bares moderna. Vai ao fim da tarde para ver a rua acordar e fica para jantar se quiseres o pacote completo: comida sérvia, vinho/rakia, bandas de mesa em mesa e um certo teatro nostálgico.","gratis":true,"distanciaAlojamento":"12 min a pé","mapsQuery":"Skadarlija Belgrade","dicas":"Ir com fome — é também onde se janta.","foto":"https://commons.wikimedia.org/wiki/Special:FilePath/Skadarlija%20street%2C%20Belgrade%2C%20Serbia.jpg","fonte":"https://en.wikipedia.org/wiki/Skadarlija"},{"id":"bg-tesla-museu","nome":"Museu Nikola Tesla","categoria":"Cultura","descricaoCurta":"Museu dedicado ao inventor, com demonstrações interativas.","descricaoCompleta":"O Museu Nikola Tesla é pequeno, mas é uma boa âncora cultural para uma manhã curta em Belgrado. Guarda parte importante do espólio pessoal e científico de Tesla e costuma ter visitas guiadas com demonstrações elétricas, o que o torna mais vivo do que um museu de vitrines. O interesse não está só no inventor em si, mas na forma como os Balcãs disputam e celebram a memória de uma figura que pertenceu a várias geografias culturais ao mesmo tempo. Se fores, tenta encaixar uma visita guiada; sem demonstração, a experiência perde bastante força.","precoSimbolo":"€€","precoPessoa":8,"precoInclui":"bilhete de entrada","horario":"09:00–20:00","distanciaAlojamento":"15 min a pé","mapsQuery":"Nikola Tesla Museum Belgrade","foto":"https://www.roadaffair.com/wp-content/uploads/2019/04/nikola-tesla-museum-belgrade-serbia-shutterstock_430379356.jpg"}],"praias":[],"nightlife":[{"id":"bg-2044","nome":"20/44","categoria":"Nightlife","descricaoCurta":"Clube alternativo de Belgrado, agora em Karađorđeva 44.","descricaoCompleta":"O 20/44 é uma boa escolha se a ideia for sair da noite turística e entrar numa Belgrado mais alternativa. Durante anos foi lendário como clube flutuante, mas depois das mudanças regulatórias nos splavovi passou para Karađorđeva 44, mantendo a identidade ligada à eletrónica, DJs e programação menos comercial. É mais para ouvir música e apanhar a energia underground da cidade do que para um copo tranquilo. Confirma a noite específica antes de ir, porque o ambiente muda muito conforme o DJ. Se estiveres cansado, faz sentido escolher só este ou Lasta, não tentar cumprir tudo.","precoSimbolo":"€€","precoPessoa":15,"precoInclui":"consumo mínimo estimado","horario":"23:00–06:00","mapsQuery":"Klub 20/44 Karadjordjeva 44 Belgrade","fonte":"https://ra.co/events/2506064","foto":"https://www.klubskascena.hr/wp-content/uploads/2024/12/20-44-naslovna.jpg","distanciaAlojamento":"Curto Bolt/táxi a partir de Stari Grad"},{"id":"bg-lasta","nome":"Lasta","categoria":"Nightlife","descricaoCurta":"Splav com música pop/funk/R&B, ambiente mais descontraído.","descricaoCompleta":"Lasta é a opção de noite mais direta se quiseres o imaginário clássico dos clubes de rio de Belgrado sem mergulhar tão fundo na cena alternativa. A proposta é mais social e mainstream: música acessível, público arranjado, bebidas e energia de festa junto à água. É menos interessante historicamente do que Skadarlija ou 20/44, mas pode funcionar bem como fecho de sábado se ainda houver energia depois do jantar. Vale confirmar programação e dress code no próprio dia, porque muitos clubes de Belgrado variam bastante entre noites e eventos privados.","precoSimbolo":"€€","precoPessoa":12,"precoInclui":"consumo mínimo estimado","mapsQuery":"Lasta splav Belgrade","fonte":"https://lastabelgrade.com/en/","foto":"https://clubbable.blob.core.windows.net/medias/Lasta-Belgrade-1"}]},{"id":"albania","nome":"Albânia","pais":"Albânia","alojamento":[{"nome":"Metro Hotel Tirana","morada":"Rruga Nikolla Tupe Numer 3, kati 1, 1019 Tirana, Albânia","mapsQuery":"Metro Hotel Tirana","plataforma":"Reserva directa","observacoes":"Estadia de chegada, 6→7 Set. €73,90. Check-in 14:00, check-out 11:00.","checkin":"6 Set, 14:00","checkout":"7 Set, 11:00"},{"nome":"Alojamento Himarë (Airbnb)","morada":"3QV3+MVM, SH8, Himarë, Vlorë County 9425, Albânia","mapsQuery":"3QV3+MVM Himare Albania","plataforma":"Airbnb","contacto":"Código de confirmação: HM25W8KWWH","observacoes":"4 noites, 7→11 Set. Link: https://www.airbnb.com/l/kdGZCKWj. Nome da propriedade e preço não confirmados nesta sessão.","checkin":"7 Set, 15:00","checkout":"11 Set, 11:00"},{"nome":"Hotel Boutique Kotoni","morada":"Donika Kastrioti 3, Tirana, Albânia","mapsQuery":"Hotel Boutique Kotoni Tirana","plataforma":"Reserva directa","telefone":"+355 4 22 74888","contacto":"www.hotelkotoni.com · contacto por email: Era","observacoes":"Estadia de regresso, 11→12 Set. €90/noite com pequeno-almoço incluído.","checkin":"11 Set","checkout":"12 Set"}],"dias":[{"data":"7 Set (Seg)","titulo":"Tirana → Himarë","periodos":[{"periodo":"Manhã","atividades":[{"titulo":"Autocarro Tirana → Himarë","nota":"Ver todos os horários (Olgeno / Riviera Tours) na aba Logística — decidir no dia.","links":[{"label":"Ver horários","tab":"logistica"}]}]},{"periodo":"Tarde","atividades":[{"titulo":"Chegada e check-in no alojamento","horario":"15:00","nota":"3QV3+MVM, SH8, Himarë · código HM25W8KWWH","links":[{"label":"Ver alojamento","destinoId":"albania","subtab":"alojamento"}]},{"titulo":"Primeiro contacto com a praia e o centro de Himarë","horario":"16:30","links":[{"label":"Detalhes: Praia de Himarë","itemId":"al-himare-praia"}]}]},{"periodo":"Noite","atividades":[{"titulo":"Jantar em Himarë","horario":"20:00","nota":"Taverna Velco (vista mar) ou Elea (jardim de oliveiras)","links":[{"label":"Detalhes: Taverna Velco","itemId":"al-taverna-velco"},{"label":"Detalhes: Elea","itemId":"al-elea"}]}]}]},{"data":"8 Set (Ter)","titulo":"Himarë — dia de aventura na água","periodos":[{"periodo":"Manhã","atividades":[{"titulo":"Passeio de barco — Gruta Azul + Grama Bay","horario":"10:00","duracao":"2h30-6h","nota":"Contactar Himara Boat Trips, Himara Water Taxi ou Himara Nautica One — reservar no próprio dia ou véspera","links":[{"label":"Detalhes: passeio de barco","itemId":"al-himare-grama-bay"}]}]},{"periodo":"Tarde","atividades":[{"titulo":"Praia + descanso","horario":"15:00","links":[{"label":"Detalhes: Praia de Himarë","itemId":"al-himare-praia"}]}] -dhermi-praia"}]},{"titulo":"Nightlife (se ainda a funcionar nesta altura de Setembro)","horario":"22:00","nota":"Havana Beach Club ou Salinas/Folie Marina (Jalë)","links":[{"label":"Detalhes: Havana","itemId":"al-havana"},{"label":"Detalhes: Salinas/Folie","itemId":"al-salinas"}]},{"titulo":"Táxi de regresso a Himarë","nota":"Sem horário fixo — combinar táxi de regresso","links":[{"label":"Ver logística","tab":"logistica"}]}]}]},{"data":"11 Set (Sex)","titulo":"Himarë → Tirana","periodos":[{"periodo":"Manhã","atividades":[{"titulo":"Último banho / praia em Himarë","horario":"09:30","links":[{"label":"Detalhes: Praia de Himarë","itemId":"al-himare-praia"}]},{"titulo":"Check-out do alojamento","horario":"11:00","links":[{"label":"Ver alojamento","destinoId":"albania","subtab":"alojamento"}]}]},{"periodo":"Tarde","atividades":[{"titulo":"Autocarro Himarë → Tirana","nota":"Ver todos os horários (Riviera Tours / Olgeno) na aba Logística — decidir no dia.","links":[{"label":"Ver horários","tab":"logistica"}]}]},{"periodo":"Noite","atividades":[{"titulo":"Check-in Hotel Boutique Kotoni","nota":"Donika Kastrioti 3, Tirana","links":[{"label":"Ver alojamento","destinoId":"albania","subtab":"alojamento"}]},{"titulo":"Praça Skanderbeg + Mesquita Et'hem Bey","horario":"18:30","duracao":"1h30","links":[{"label":"Detalhes: Praça Skanderbeg","itemId":"al-skanderbeg"},{"label":"Detalhes: Et'hem Bey","itemId":"al-ethem-bey"}]},{"titulo":"Último jantar em Blloku","horario":"20:30","nota":"Oda Restaurant ou Era Blloku","links":[{"label":"Detalhes: Oda","itemId":"al-oda"},{"label":"Detalhes: Era Blloku","itemId":"al-era-blloku"}]}]}]},{"data":"12 Set (Sáb)","titulo":"Regresso — Tirana → Belgrado → Lisboa","periodos":[{"periodo":"Manhã","atividades":[{"titulo":"Manhã livre em Tirana","horario":"09:30","nota":"Pequeno-almoço no Hotel Boutique Kotoni e volta curta no centro/Blloku.","links":[{"label":"Detalhes: Praça Skanderbeg","itemId":"al-skanderbeg"}]},{"titulo":"Check-out e saída para o aeroporto","horario":"12:00","nota":"Chegar a TIA ~12:30 para JU163 às 15:15.","links":[{"label":"Ver alojamento","destinoId":"albania","subtab":"alojamento"},{"label":"Ver voo","tab":"logistica"}]}]},{"periodo":"Tarde","atividades":[{"titulo":"Voo JU163 Tirana → Belgrado","horario":"15:15–16:20","nota":"Air Serbia/Bulgaria Air, reserva KTHKLN. Layover ~2h45 em Belgrado.","links":[{"label":"Ver voo","tab":"logistica"}]}]},{"periodo":"Noite","atividades":[{"titulo":"Voo JU564 Belgrado → Lisboa","horario":"19:05–22:10","nota":"Chegada a LIS Terminal 1; chegada a casa estimada ~22:45.","links":[{"label":"Ver voo","tab":"logistica"}]}]}]}],"restaurantes":[{"id":"al-oda","nome":"Oda Restaurant","categoria":"Local/Tasca","descricaoCurta":"Referência de cozinha albanesa tradicional em Blloku, Tirana.","descricaoCompleta":"Oda é uma boa primeira porta de entrada para a cozinha albanesa tradicional em Tirana. O nome remete para a sala de receber das casas antigas, e o restaurante tenta recriar esse ambiente com madeira, objetos tradicionais e pratos de conforto. A comida é mais caseira do que sofisticada: fërgesë, tavë kosi, legumes recheados, borrego, pão e vinho da casa. É especialmente útil para perceber como a cozinha albanesa mistura influências otomanas, balcânicas e mediterrânicas sem ser simplesmente 'grega' ou 'turca'. Vai sem pressa; o serviço pode ser mais lento quando está cheio, mas isso faz parte do ritmo.","precoSimbolo":"€€","precoPessoa":22,"precoInclui":"prato + bebida","distanciaAlojamento":"Blloku, Tirana","mapsQuery":"Oda Restaurant Tirana","fonte":"https://odarestaurant.al/","foto":"https://b1858819.smushcdn.com/1858819/wp-content/uploads/bb-plugin/cache/Oda-Traditional-restaurant-Albania-Tirana-Dining-Food-scaled-portrait-337b9ac7539c7cf3617ba1797f147dba-cje1sfp4r8t5.jpg?lossy=2&strip=1&webp=1"},{"id":"al-era-blloku","nome":"Era Blloku","categoria":"Local/Tasca","descricaoCurta":"Popular em Blloku, cozinha albanesa e mediterrânica.","descricaoCompleta":"Era Blloku é uma opção segura e animada no bairro mais social de Tirana. Não tem a aura tradicional da Oda nem a ambição autoral do Mullixhiu, mas compensa com consistência, movimento e uma carta ampla que funciona bem quando não queres arriscar. Blloku foi a antiga zona reservada à elite comunista e hoje concentra bares, restaurantes e vida noturna; jantar aqui ajuda a sentir essa Tirana pós-comunista, jovem e em transformação. Bom para um primeiro ou último jantar, sobretudo se quiseres depois caminhar para um bar sem mudar de bairro.","precoSimbolo":"€€","precoPessoa":18,"precoInclui":"prato + bebida","distanciaAlojamento":"Blloku, Tirana","mapsQuery":"Era Blloku Tirana","fonte":"https://era.al/en/era-bllok/","foto":"https://booked.ai/_next/image?q=75&url=https%3A%2F%2Froute-pricing-server-production-production.up.railway.app%2Fmedia%2Frailbucket-production-ofnqas%2Ffbdd6920b4c4013a4d6529d0f3bfe4dde3decba945a6bd31c72352cec724c971.jpg%3Fw%3D1200%26q%3D74%26fm%3Dwebp&w=1920"},{"id":"al-mullixhiu","nome":"Mullixhiu","categoria":"Fine Dining","descricaoCurta":"Cozinha albanesa moderna, ingredientes de pequenos produtores.","descricaoCompleta":"Mullixhiu é a escolha gastronómica mais interessante em Tirana se quiseres ver a cozinha albanesa tratada como património e não só como comida de conforto. O chef Bledar Kola trabalhou fora da Albânia e trouxe uma lógica de produto local, sazonalidade e releitura moderna de receitas rurais. O nome significa 'moleiro', e essa ideia aparece no pão, nos cereais e no cuidado com ingredientes de pequenos produtores. É o sítio para um jantar mais contemplativo: menos 'vou comer qualquer coisa' e mais 'quero perceber o que a Albânia tem para dizer à mesa'. Reserva se possível.","precoSimbolo":"€€€","precoPessoa":40,"precoInclui":"prato + bebida","distanciaAlojamento":"Tirana","mapsQuery":"Mullixhiu Tirana","fonte":"https://www.mullixhiu.al/","foto":"https://i0.wp.com/www.mullixhiu.al/wp-content/uploads/2020/03/mullixhiu-garden.jpg?fit=1600%2C1066&ssl=1"},{"id":"al-taverna-velco","nome":"Taverna Velco","categoria":"Local/Tasca","descricaoCurta":"Terraço com vista sobre o mar Jónico, à saída do centro de Himarë.","descricaoCompleta":"Taverna Velco é um daqueles restaurantes que faz sentido numa base costeira: vista, peixe, marisco, grelhados e um ambiente familiar sem grande pose. Fica na zona de Potam, um pouco fora do centro de Himarë, por isso funciona melhor como jantar com táxi curto ou caminhada planeada, não como escolha espontânea se já estiveres cansado. A força da casa está no marisco grelhado, polvo, peixe inteiro e camarão saganaki, com influência grega/albanesa evidente. Vale ir ao pôr do sol se conseguires; é mais memorável pela combinação de comida simples, mar e luz do que por inovação culinária.","precoSimbolo":"€€","precoPessoa":20,"precoInclui":"prato + bebida","distanciaAlojamento":"Himarë","mapsQuery":"Taverna Velco Himare","fonte":"https://himara.net/blog/taverna-velco-review","foto":"https://himara.net/images/businesses/restaurants/taverna-velco/hero.webp"},{"id":"al-taverna-pirosia","nome":"Taverna Pirosia","categoria":"Vegetariano","descricaoCurta":"Referência vegetariana em Himarë.","descricaoCompleta":"Taverna Pirosia entra no roteiro por uma razão prática e rara na Riviera: dá uma alternativa vegetariana/leve num destino onde peixe, carne e grelhados dominam quase tudo. É pequena, informal e mais interessante para uma refeição simples do que para uma grande noite. A fërgesë, legumes grelhados, saladas e pratos de queijo resolvem bem quando já estás farto de marisco ou queres gastar pouco. Também é boa opção se estiveres sozinho e não quiseres uma experiência de restaurante muito montada. Pensa nela como uma pausa útil no meio de dias de praia e comida pesada.","precoSimbolo":"€","precoPessoa":12,"precoInclui":"prato + bebida","distanciaAlojamento":"Himarë","mapsQuery":"Taverna Pirosia Himare","fonte":"https://www.tripadvisor.com/Restaurant_Review-g801295-d24131683-Reviews-Taverna_Pirosia-Himare_Vlore_County.html","foto":"https://himara.net/images/businesses/restaurants/taverna-pirosia/hero.webp"},{"id":"al-elea","nome":"Elea","categoria":"Fine Dining","descricaoCurta":"Restaurante familiar num olival, cozinha albanesa moderna.","descricaoCompleta":"Elea é o jantar de Himarë para quando apetecer desacelerar. O restaurante está ligado a um ambiente de jardim/olival, com uma leitura mais cuidada da cozinha albanesa e mediterrânica. A graça está menos em 'ver e ser visto' e mais em comer com calma, num lugar verde, ligeiramente afastado da agitação da marginal. É boa escolha para uma noite em que queiras escrever, pensar, recuperar energia ou simplesmente fazer uma refeição melhor sem entrar no formato formal de fine dining. Pede pratos locais, azeite, legumes, peixe ou carne grelhada, e deixa espaço para uma sobremesa se houver algo caseiro.","precoSimbolo":"€€","precoPessoa":22,"precoInclui":"prato + bebida","distanciaAlojamento":"Himarë","mapsQuery":"Elea restaurant Himare","foto":"https://himara.net/images/businesses/restaurants/elea-restaurant/04.webp"},{"id":"al-love-souvlaki","nome":"Love Souvlaki","categoria":"Casual","descricaoCurta":"Gyros e souvlaki gregos, opção rápida e informal.","descricaoCompleta":"Love Souvlaki é uma opção de sobrevivência feliz: rápida, barata e muito útil nos dias em que não queres transformar cada refeição num evento. Himarë tem uma forte camada cultural grega, e isso aparece naturalmente no gyros, souvlaki, pita, tzatziki e saladas simples. É o sítio para antes ou depois da praia, quando estás com sal no corpo e pouca paciência para menus longos. Não é uma atração gastronómica no sentido nobre, mas tem valor real no roteiro: poupa tempo, dinheiro e energia. Também funciona bem se estiveres sozinho e quiseres comer sem cerimónia.","precoSimbolo":"€","precoPessoa":8,"precoInclui":"prato + bebida","distanciaAlojamento":"Himarë","mapsQuery":"Love Souvlaki Himare","foto":"https://images.squarespace-cdn.com/content/v1/6623feafcef0693caade2984/35d9a034-0f8e-4aa1-a22e-f1761661de41/I-Love-Souvlaki-Himare-Albania.jpg"},{"id":"al-cafe-butterfly","nome":"Cafe Butterfly","categoria":"Vista","descricaoCurta":"Junto ao Castelo de Himarë, vista privilegiada.","descricaoCompleta":"Cafe Butterfly vale sobretudo pelo contexto: fica na zona alta/antiga de Himarë, junto ao castelo, e por isso transforma uma visita histórica numa pausa com vista. Depois de subir pelas ruas de pedra e pelas ruínas, sentar aqui ajuda a perceber a geografia do lugar: a vila antiga protegida no alto, o mar Jónico em baixo, e a Himarë moderna estendida junto à praia. Não vás à espera de uma refeição marcante; pensa antes em café, bebida fria, algo leve e tempo para olhar. É uma boa paragem para fim de tarde, quando a luz deixa a costa mais dramática.","precoSimbolo":"€","precoPessoa":8,"precoInclui":"café/refeição ligeira","distanciaAlojamento":"Castelo de Himarë","mapsQuery":"Cafe Butterfly Himare","foto":"https://static.goto-where.com/158873-albums-1.jpg"}],"atracoes":[{"id":"al-skanderbeg","nome":"Praça Skanderbeg","categoria":"Cultura","descricaoCurta":"Praça central de Tirana, ponto de partida para explorar a cidade.","descricaoCompleta":"A Praça Skanderbeg é o centro simbólico de Tirana e um bom resumo visual da história recente da Albânia. À volta dela aparecem o herói nacional Skanderbeg, a mesquita otomana Et'hem Bey, edifícios do período comunista, instituições nacionais e a Tirana contemporânea pedonalizada. A praça foi remodelada para reduzir carros e criar um grande espaço cívico, por isso funciona mais como palco urbano do que como monumento isolado. Caminha devagar, repara na escala vazia do espaço e usa-a como ponto de orientação: quase tudo no centro se organiza a partir daqui.","gratis":true,"mapsQuery":"Skanderbeg Square Tirana","foto":"https://cdn.holidayguru.ch/wp-content/uploads/2025/04/skanderberg-shutterstock_2166445249.jpg","fonte":"https://en.wikipedia.org/wiki/Skanderbeg_Square"},{"id":"al-ethem-bey","nome":"Mesquita Et'hem Bey","categoria":"História","descricaoCurta":"Mesquita do séc. XVIII com frescos delicados.","descricaoCompleta":"A Mesquita Et'hem Bey é uma das peças históricas mais delicadas de Tirana. Construída entre o fim do século XVIII e início do XIX, sobreviveu ao século XX albanês, incluindo o período comunista em que a religião foi reprimida. O momento mais simbólico veio em 1991, quando milhares de pessoas entraram na mesquita apesar da proibição, num gesto associado ao regresso público da liberdade religiosa. O interior e o pórtico têm frescos raros com árvores, pontes e paisagens, pouco comuns na decoração islâmica local. Entra com respeito, fora das horas de oração, e observa os detalhes sem pressa.","gratis":true,"horario":"Fora das orações","mapsQuery":"Et'hem Bey Mosque Tirana","foto":"https://www.nitravel.org/storage/tour-places/F7GT0r8o6bjx029aD0IlIdVcTsq3xxzT9JSTSBSE.jpg","fonte":"https://en.wikipedia.org/wiki/Et%27hem_Bey_Mosque"},{"id":"al-himare-castelo","nome":"Castelo e Centro Histórico de Himarë","categoria":"História","descricaoCurta":"Vila antiga no alto de uma falésia, vista panorâmica sobre a Riviera.","descricaoCompleta":"O Castelo e Centro Histórico de Himarë são essenciais para entender que a Riviera não é só praia. A ocupação da zona remonta a mais de 2.500 anos, com camadas gregas, romanas, bizantinas, otomanas e italianas. A vila antiga fica no alto, posição defensiva clássica: longe de ataques pelo mar, mas com domínio visual sobre toda a costa. Hoje, as ruínas, igrejas, muros e casas de pedra dão uma sensação de tempo suspenso. Vai ao fim da tarde, quando o calor baixa e a luz abre sobre o Jónico. É uma visita curta, mas muda a forma como olhas para Himarë em baixo.","precoSimbolo":"€","precoPessoa":2.5,"precoInclui":"bilhete de entrada (~300 LEK)","distanciaAlojamento":"Himarë","mapsQuery":"Himara Castle","fonte":"https://himara.net/blog/himara-old-town-castle","foto":"https://www.startlap.hu/utazas/uploads/sites/3/2024/08/himare8.jpg"},{"id":"al-himare-grama-bay","nome":"Gruta Azul + Grama Bay (passeio de barco)","categoria":"Aventura na água","descricaoCurta":"Passeio de barco às grutas e baías mais bonitas perto de Himarë.","descricaoCompleta":"O passeio de barco para Grama Bay e grutas próximas é provavelmente a experiência de mar mais forte da estadia. A costa entre Himarë, Gjipe, Grama e pequenas enseadas tem falésias claras, água muito transparente e praias que por terra seriam difíceis ou lentas de alcançar. Grama Bay tem ainda um lado histórico: durante séculos foi abrigo natural para barcos, e as rochas da zona guardam inscrições antigas de marinheiros. Escolhe tour em grupo se quiseres algo social e barato, privado se quiseres controlar ritmo e paragens. Leva saco seco, água, protetor e não planeies uma noite pesada logo depois.","precoSimbolo":"€€€","precoPessoa":90,"precoInclui":"passeio de barco, equipamento básico","distanciaAlojamento":"Saída do porto de Himarë","mapsQuery":"Himare boat tour Grama Bay","siteOficial":"https://www.himaraboattrips.com/","fonte":"https://www.himara-watertaxi.com/tours/grama-bay-tour/","dicas":"Operadores locais para contactar directamente: Himara Boat Trips (himaraboattrips.com), Sea Breeze/Himara Tours (himaratours.com), Himara Water Taxi (himara-watertaxi.com, tem versão em grupo partilhado mais barata) e Himara Nautica One (himaranauticaone.com). Nenhum publica WhatsApp/telefone online — contactar por email/site ou presencialmente em Himarë, normalmente dá para reservar no próprio dia ou véspera.","foto":"https://api.mytour.eu/images/1675780951177_gita-in-motoscafo-alla-baia-di-grama-main.png"},{"id":"al-himare-kayak","nome":"Kayak/SUP ao pôr do sol — Praia de Filikuri","categoria":"Aventura na água","descricaoCurta":"Passeio de kayak ou stand-up paddle ao entardecer.","descricaoCompleta":"Kayak ou SUP até Filikuri é a alternativa ativa ao barco turístico. Em vez de seres levado pela costa, vais sentir a escala do mar, das falésias e das pequenas praias com o corpo. Filikuri é uma enseada mais selvagem perto de Himarë, difícil de acessar por terra, o que ajuda a manter a sensação de descoberta. O pôr do sol é o melhor horário porque o calor baixa e a luz bate nas rochas. Se estiver vento ou mar mexido, não forces: a costa é bonita, mas exposta. Para uma primeira vez, guia local é melhor do que aluguer totalmente por conta própria.","precoSimbolo":"€€","precoPessoa":38,"precoInclui":"equipamento, guia","distanciaAlojamento":"Saída do porto de Himarë","mapsQuery":"Himare kayak SUP Filikuri","siteOficial":"https://kayaksrentsups.com/","fonte":"https://himara.net/boat-tours/secret-blue-cave","dicas":"Kayaks Rents Sups (kayaksrentsups.com) é a empresa especializada neste tour. Alternativa sem reserva: alugar directamente na praia de Himarë, Livadhi ou Potami (~€10-15/hora ou ~€30/dia) e fazer o trajeto por conta própria.","foto":"https://cdn.getyourguide.com/image/format%3Dauto%2Cfit%3Dcrop%2Cgravity%3Dauto%2Cquality%3D60%2Cwidth%3D400%2Cheight%3D265%2Cdpr%3D2/tour_img/f1b35133e772d3d90f937285aa96729beea035dfd6c56cf69a888b686a0856cb.jpg"},{"id":"al-llogara","nome":"Passo de Llogara","categoria":"Natureza","descricaoCurta":"Miradouro panorâmico sobre a Riviera Albanesa.","descricaoCompleta":"O Passo de Llogara é a grande viragem cénica entre a Albânia interior e a Riviera. A estrada sobe pelas Montanhas Ceraunianas e depois abre, de repente, para o mar Jónico muito abaixo. Historicamente, esta barreira montanhosa ajudou a isolar e proteger as comunidades costeiras de Himarë, o que explica parte da identidade forte da região. Mesmo visto de autocarro, é um dos momentos paisagísticos da viagem. Se o transporte parar, aproveita sem pressa: a vista combina montanha, floresta de pinheiro negro, curvas de estrada e costa azul. É também zona de parapente e trilhos.","gratis":true,"mapsQuery":"Llogara Pass Albania","foto":"https://peakvisor.com/photo/SD/Llogara-pass-Ionian-sea-coast-Llogara-National-Park-Albania.jpg","fonte":"https://albaniavisit.com/attractions/llogara-national-park/"},{"id":"al-gjipe","nome":"Gjipe Canyon","categoria":"Natureza","descricaoCurta":"Trilho até praia isolada entre falésias calcárias, perto de Dhërmi.","descricaoCompleta":"Gjipe Canyon é uma das paisagens mais dramáticas da Riviera: um desfiladeiro calcário que desce até uma praia isolada entre Dhërmi e Vuno. A experiência vale porque junta caminhada, geologia e mar no mesmo lugar. A praia pode ser alcançada por trilho ou barco, mas o canyon é o que lhe dá personalidade; as paredes estreitas fazem a chegada ao mar parecer mais remota do que realmente é. É boa opção se o dia de Dhërmi pedir aventura em vez de apenas espreguiçadeira. Leva calçado decente, água e evita o calor mais duro; não é uma praia urbana de chegar e sentar.","gratis":true,"distanciaAlojamento":"Perto de Dhërmi","mapsQuery":"Gjipe Beach Albania","foto":"https://www.reisroutes.be/userfiles/fotos/uitzicht-over-gjipe-kloof-albanie_40038_xl.jpg","fonte":"https://www.tirana-airport.com/en/article/1057/Gjipe-Canyon"}],"praias":[{"id":"al-himare-praia","nome":"Praia de Himarë","categoria":"Praia","descricaoCurta":"Praia principal, ladeada de cafés e restaurantes — base da estadia.","descricaoCompleta":"A Praia de Himarë é menos 'cartão-postal secreto' e mais base prática da viagem. Fica junto ao centro, com cafés, restaurantes, mercados e alojamentos por perto, o que a torna perfeita para dias sem logística. O valor está nessa facilidade: acordar, tomar café, nadar, voltar ao quarto, sair para jantar, tudo a pé. A praia também ajuda a observar a vida local e o ritmo de Setembro, quando a Riviera já não está no pico caótico de Julho/Agosto. Usa-a como praia de manutenção: boa para primeiro banho, fim de tarde, dias cansados e planos flexíveis entre atividades maiores.","gratis":true,"distanciaAlojamento":"Himarë","mapsQuery":"Himare Beach Albania","fonte":"https://himara.net/blog/himara-bus-station-guide","foto":"https://www.islands.com/img/gallery/europes-most-underappreciated-destination-is-a-beachy-and-affordable-albanian-paradise/l-intro-1735832196.jpg"},{"id":"al-dhermi-praia","nome":"Praia de Dhërmi/Drymades","categoria":"Praia","descricaoCurta":"Praia da excursão de um dia, mistura de seixos e areia.","descricaoCompleta":"Dhërmi/Drymades é a versão mais expansiva e fotogénica da Riviera: praia longa, água azul forte, montanha a cair sobre o mar e uma camada de beach clubs que tornou a zona famosa no verão. A aldeia antiga fica mais acima, nas encostas, e a zona de praia desenvolveu-se como destino sazonal. Em Setembro, a vantagem é haver menos confusão; o risco é alguns clubes já estarem a reduzir ritmo. Vale como excursão de um dia desde Himarë para mudar de cenário, ver o sunset e testar se ainda há nightlife. Combina táxi de ida e volta antes de beber.","gratis":true,"mapsQuery":"Dhermi Beach Albania","fonte":"https://en.wikipedia.org/wiki/Dh%C3%ABrmi","foto":"https://reisgenie.nl/wp-content/uploads/2024/06/dhermi-beach-1.jpg"}],"nightlife":[{"id":"al-himare-mojo","nome":"Mojo","categoria":"Nightlife","descricaoCurta":"Bar mais movimentado de Himarë — mistura de casais, grupos, solo e locais.","descricaoCompleta":"Mojo é o bar de Himarë para uma noite fácil, sem transformar o plano numa operação. A vantagem não é luxo nem conceito: é movimento, mistura de viajantes, locais, casais e grupos, e uma energia mais social do que muitos bares pequenos da marginal. Funciona bem depois de jantar, sobretudo se estiveres sozinho e quiseres ficar disponível para conversa sem entrar num club pesado. Em Setembro, é mais seguro apostar neste tipo de bar central do que depender exclusivamente dos beach clubs de Dhërmi. Vai para um ou dois copos; se estiver morto, muda rápido para Lido ou Thea.","precoSimbolo":"€€","mapsQuery":"Mojo bar Himare","fonte":"https://himara.net/blog/himara-nightlife-guide","foto":"https://www.greencoast-albania.com/wp-content/uploads/sites/10/2024/09/himare-mojo-cocktails-bar.jpg"},{"id":"al-himare-lido","nome":"Lido Cocktail Bar","categoria":"Nightlife","descricaoCurta":"Bar de cocktails junto à costa.","descricaoCompleta":"Lido Cocktail Bar é uma alternativa simples para beber junto à costa, com menos pressão de 'noite grande'. É o tipo de lugar que encaixa bem depois de um dia de praia ou barco: cocktail, ar do mar, gente a passar e pouca logística. Não precisa ser o destino principal da noite; pode ser paragem entre jantar e cama, ou plano B se Mojo estiver vazio. A vantagem de Himarë é justamente esta: nightlife compacta, onde dá para testar dois ou três sítios a pé antes de decidir ficar. Em Setembro, olha primeiro para o movimento real na rua e escolhe pelo ambiente, não pelo nome.","precoSimbolo":"€€","mapsQuery":"Lido Cocktail Bar Himare","fonte":"https://himara.net/blog/himara-nightlife-guide","foto":"https://photos.wikimapia.org/p/00/08/98/76/05_big.jpg"},{"id":"al-himare-thea","nome":"Thea Rooftop Bar","categoria":"Nightlife","descricaoCurta":"Bar de terraço com vista sobre Himarë.","descricaoCompleta":"Thea Rooftop Bar vale pela perspetiva: subir um pouco, beber algo e ver Himarë de cima em vez de ficar sempre ao nível da praia. É melhor para início de noite ou fim de tarde do que para madrugada, especialmente se quiseres um momento mais calmo antes de decidir se sais de verdade. A vista ajuda a ligar as peças da estadia: a praia, a marginal, as colinas e a vila antiga. Pensa nele como bar de transição: bom para um cocktail, uma nota no telemóvel, fotos e leitura do ambiente antes de descer para Mojo, Lido ou simplesmente jantar.","precoSimbolo":"€€","mapsQuery":"Thea Rooftop Bar Himare","fonte":"https://himara.net/blog/himara-nightlife-guide","foto":"https://himara.net/images/businesses/bars/thea-rooftop/01.webp"},{"id":"al-havana","nome":"Havana Beach Club","categoria":"Nightlife","descricaoCurta":"O beach club mais conhecido de Dhërmi — piscina, DJs, festas.","descricaoCompleta":"Havana Beach Club representa o lado mais conhecido e festivo de Dhërmi: piscina, DJs, estética de beach club e noites longas em época alta. É o tipo de lugar que tornou a Riviera albanesa mais visível para viajantes jovens, mas também é muito sazonal. Em Setembro, convém tratar como possibilidade e não garantia; antes de organizar táxi e noite, confirma nas redes sociais ou pergunta localmente se há evento. Se estiver aberto e com público, pode ser a noite mais energética da viagem. Se estiver vazio, não forces: a excursão a Dhërmi ainda vale por praia e sunset.","precoSimbolo":"€€","precoPessoa":20,"precoInclui":"consumo mínimo estimado","mapsQuery":"Havana Beach Club Dhermi","fonte":"https://terrainvestsolutions.com/blog/beyond-the-beach-adventure-activities-albanian-riviera/","foto":"https://photos.wikimapia.org/p/00/07/95/40/92_big.jpg"},{"id":"al-salinas","nome":"Salinas / Folie Marina","categoria":"Nightlife","descricaoCurta":"Alternativa em Jalë, também muito conhecida na Riviera.","descricaoCompleta":"Salinas / Folie Marina, na zona de Jalë, é a alternativa se a noite de Dhërmi estiver fraca ou se ouvires localmente que há evento melhor ali. Jalë tem reputação de praia mais jovem e festiva, com clubes e música em época alta, mas sofre da mesma sazonalidade: setembro pode ser ótimo ou pode parecer fim de temporada. O valor deste item é funcionar como carta na manga, não como obrigação. Antes de ir, confirma distância, táxi de regresso e programação; depois de beber, não improvises transporte. Se houver evento, pode compensar mais do que Havana.","precoSimbolo":"€€","precoPessoa":18,"precoInclui":"consumo mínimo estimado","mapsQuery":"Folie Marina Jale Albania","fonte":"https://terrainvestsolutions.com/blog/beyond-the-beach-adventure-activities-albanian-riviera/","foto":"https://www.greencoast-albania.com/wp-content/uploads/sites/10/2024/09/salinas-beach-bar-dhermi.jpg"}]}]};

function fmtPreco(item) {
  if (item.precoSimbolo === "Grátis" || item.gratis) return "Grátis";
  if (item.precoPessoa === undefined || item.precoPessoa === null) return "Preço não disponível";
  const pessoas = DATA.meta.numeroPessoas || 1;
  const total = (Number(item.precoPessoa) * pessoas).toFixed(0);
  return `${item.precoSimbolo || ""} ~€${item.precoPessoa}/pessoa` + (pessoas > 1 ? ` · total ~€${total}` : "");
}

function renderTabsTopo() {
  const tabs = [{ id: "resumo", label: "Resumo" }, { id: "logistica", label: "Logística" }, { id: "roteiro", label: "Roteiro" }]
    .concat(DATA.destinos.map((d) => ({ id: d.id, label: d.nome })));
  document.getElementById("tabsTopo").innerHTML = tabs.map((t) => `
    <button class="tab ${tabAtual === t.id ? "ativo" : ""}" data-tab="${t.id}">${esc(t.label)}</button>`).join("");
}

function renderMain() {
  const main = document.getElementById("main");
  if (tabAtual === "resumo") { main.innerHTML = renderResumo(); return; }
  if (tabAtual === "logistica") { main.innerHTML = renderLogistica(); return; }
  if (tabAtual === "roteiro") { main.innerHTML = renderRoteiro(); return; }
  const destino = DATA.destinos.find((d) => d.id === tabAtual);
  if (destino) { main.innerHTML = renderDestino(destino); return; }
}

function viagemSlug() {
  const raw = (DATA.meta && (DATA.meta.slug || DATA.meta.titulo)) || "viagem";
  return String(raw).normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "viagem";
}

function loadSalvos() {
  try {
    const raw = window.localStorage.getItem(storageKey);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed.filter(Boolean) : [];
  } catch (e) {
    return [];
  }
}

function saveSalvos() {
  try {
    window.localStorage.setItem(storageKey, JSON.stringify(salvosMemoria));
  } catch (e) {
    // Em modo privado ou contextos restritos, o roteiro fica apenas em memória.
  }
}

function getSalvos() {
  return salvosMemoria.slice();
}

function isSalvo(id) {
  return salvosMemoria.includes(id);
}

function toggleSalvo(id) {
  if (!id) return;
  if (isSalvo(id)) salvosMemoria = salvosMemoria.filter((x) => x !== id);
  else salvosMemoria = salvosMemoria.concat(id);
  saveSalvos();
  render();
  if (document.getElementById("overlay").classList.contains("ativo")) openModal(id);
}

function renderResumo() {
  const m = DATA.meta;
  const highlights = (m.highlights || []).map((h) => `<li>${esc(h)}</li>`).join("");
  let fuelHtml = "";
  if (DATA.combustivel) {
    const f = DATA.combustivel;
    fuelHtml = `
      <div class="card-resumo">
        <h2 class="seccao" style="margin-top:0">Custos de combustível</h2>
        <div class="fuel-grid">
          <label>Local de partida<input id="fuelPartida" type="text" value="${esc(f.localPartida || "")}"></label>
          <label>Consumo médio (L/100km)<input id="fuelConsumo" type="number" step="0.1" value="${esc(f.consumoMedio || "")}"></label>
          <label>Distância total estimada (km)<input id="fuelDistancia" type="number" value="${esc(f.distanciaKm || "")}"></label>
          <label>Preço combustível (€/L)<input id="fuelPreco" type="number" step="0.01" value="${esc(f.precoLitro || "")}"></label>
        </div>
        <div class="fuel-resultado" id="fuelResultado"></div>
      </div>`;
  }
  const shareTexto = `${m.titulo} — ${m.subtitulo}\n${(m.highlights || []).join(" · ")}`;
  return `
    <div class="card-resumo">
      <h2 class="seccao" style="margin-top:0">Destaques da viagem</h2>
      <ul class="highlights">${highlights}</ul>
      <div class="btn-row">
        <a class="btn" href="${waShareUrl(shareTexto)}" target="_blank" rel="noopener">Partilhar WhatsApp</a>
        <a class="btn secundario" href="${mailShareUrl(m.titulo, shareTexto)}">Partilhar Email</a>
      </div>
    </div>
    ${fuelHtml}
  `;
}

function calcFuel() {
  const distancia = Number(document.getElementById("fuelDistancia").value) || 0;
  const consumo = Number(document.getElementById("fuelConsumo").value) || 0;
  const preco = Number(document.getElementById("fuelPreco").value) || 0;
  const litros = (distancia * consumo) / 100;
  const custo = litros * preco;
  document.getElementById("fuelResultado").innerHTML =
    `Estimativa: <strong>${litros.toFixed(1)} L</strong> · <strong>~€${custo.toFixed(2)}</strong>`;
}

function renderLogistica() {
  const l = DATA.logistica;
  const voos = (l.voos || []).map((v) => `
    <div class="voo-bloco">
      <p class="voo-titulo">${esc(v.trecho)}</p>
      <div class="voo-linha"><span>Companhia</span><span>${esc(v.companhia)}</span></div>
      <div class="voo-linha"><span>Voo</span><span>${esc(v.numero)}</span></div>
      <div class="voo-linha"><span>Partida</span><span>${esc(v.partidaLocal)} — ${esc(v.partidaHora)}</span></div>
      <div class="voo-linha"><span>Chegada</span><span>${esc(v.chegadaLocal)} — ${esc(v.chegadaHora)}</span></div>
      ${v.terminal ? `<div class="voo-linha"><span>Terminal</span><span>${esc(v.terminal)}</span></div>` : ""}
      ${v.porta ? `<div class="voo-linha"><span>Porta</span><span>${esc(v.porta)}</span></div>` : ""}
      <div class="voo-linha"><span>Reserva</span><span>${esc(v.reserva)}</span></div>
    </div>`).join("");

  const horarios = `
    <div class="voo-bloco">
      <p class="voo-titulo">Horários gerais</p>
      ${l.saidaCasa ? `<div class="voo-linha"><span>Saída de casa</span><span>${esc(l.saidaCasa)}</span></div>` : ""}
      ${l.chegadaCasa ? `<div class="voo-linha"><span>Chegada a casa</span><span>${esc(l.chegadaCasa)}</span></div>` : ""}
      ${l.recomendacaoAeroporto ? `<div class="voo-linha"><span>No aeroporto</span><span>${esc(l.recomendacaoAeroporto)}</span></div>` : ""}
    </div>`;

  const alojamentos = (DATA.destinos.flatMap((d) => (d.alojamento || []).map((a) => ({ ...a, destino: d.nome }))))
    .map((a) => a.aDecidir ? `
      <li class="alojamento-pendente">
        <strong>${esc(a.morada || a.destino)}${a.checkin ? " — " + esc(a.checkin) : ""}${a.checkout ? " a " + esc(a.checkout) : ""}<span class="pendente-badge">A decidir</span></strong>
        ${a.observacoes ? esc(a.observacoes) : "Ainda por escolher — ver ferramenta de seleção de alojamento."}
      </li>` : `
      <li>
        <strong>${esc(a.nome)} — ${esc(a.destino)}</strong>
        ${a.morada ? esc(a.morada) + "<br>" : ""}
        ${a.checkin ? `Check-in: ${esc(a.checkin)}` : ""}${a.checkout ? ` · Check-out: ${esc(a.checkout)}` : ""}<br>
        ${[a.plataforma, a.contacto, a.telefone, a.email].filter(Boolean).map(esc).join(" · ")}
        ${a.observacoes ? `<br><em>${esc(a.observacoes)}</em>` : ""}
        <div class="btn-row"><a class="btn secundario" href="${mapsDirUrl(a.mapsQuery || a.nome)}" target="_blank" rel="noopener">Direções</a></div>
      </li>`).join("");

  const transportes = (l.transportesEntreDestinos || []).map((t) => transporteHtml(t)).join("");

  const numeros = (l.numerosUteis || []).map((n) => `<li><strong>${esc(n.local)}</strong>Emergência: ${esc(n.emergencia)}</li>`).join("");
  const apps = (l.appsEssenciais || []).map((a) => `<li>${esc(a)}</li>`).join("");

  return `
    <h2 class="seccao">Voos</h2>
    ${voos}
    ${horarios}
    <h2 class="seccao">Alojamentos</h2>
    <ul class="lista-simples">${alojamentos}</ul>
    ${transportes ? `<h2 class="seccao">Transportes entre destinos</h2><ul class="lista-simples">${transportes}</ul>` : ""}
    ${numeros ? `<h2 class="seccao">Números úteis</h2><ul class="lista-simples">${numeros}</ul>` : ""}
    ${apps ? `<h2 class="seccao">Apps essenciais</h2><ul class="lista-simples">${apps}</ul>` : ""}
  `;
}

function renderRoteiro() {
  const ids = new Set(getSalvos());
  const salvos = [];
  DATA.destinos.forEach((destino) => {
    const todos = [].concat(destino.restaurantes || [], destino.atracoes || [], destino.praias || [], destino.nightlife || []);
    todos.forEach((item) => {
      if (ids.has(item.id)) salvos.push({ item, destino });
    });
  });

  if (!salvos.length) {
    return `
      <div class="card-resumo">
        <h2 class="seccao" style="margin-top:0">Roteiro salvo</h2>
        <p>Ainda não guardaste nada. Toca no ☆ de um restaurante, atração, praia ou bar para o adicionar aqui.</p>
      </div>`;
  }

  const porDestino = {};
  salvos.forEach(({ item, destino }) => {
    const destinoKey = destino.id || destino.nome;
    if (!porDestino[destinoKey]) porDestino[destinoKey] = { destino, categorias: {} };
    const cat = item.categoria || "Outros";
    (porDestino[destinoKey].categorias[cat] = porDestino[destinoKey].categorias[cat] || []).push(item);
  });

  return Object.keys(porDestino).map((destinoKey) => {
    const grupoDestino = porDestino[destinoKey];
    const tituloDestino = DATA.destinos.length > 1 ? `<h2 class="seccao">${esc(grupoDestino.destino.nome)}</h2>` : `<h2 class="seccao">Roteiro salvo</h2>`;
    const categorias = Object.keys(grupoDestino.categorias).map((cat) => `
      <div class="categoria-grupo">
        <p class="categoria-titulo">${esc(cat)}</p>
        <div class="grid-cards">
          ${grupoDestino.categorias[cat].map((it) => cardHtml(it)).join("")}
        </div>
      </div>`).join("");
    return `${tituloDestino}${categorias}`;
  }).join("");
}

function transporteHtml(t) {
  const horariosHtml = (t.horarios && t.horarios.length) ? `
    <div class="horarios-tabela">
      <table>
        <thead><tr><th>Saída</th><th>Chegada</th><th>Duração</th><th>Empresa</th><th>Preço</th></tr></thead>
        <tbody>
          ${t.horarios.map((h) => `<tr><td>${esc(h.saida)}</td><td>${esc(h.chegada)}</td><td>${esc(h.duracao || "")}</td><td>${esc(h.empresa || "")}</td><td>${esc(h.preco || "")}</td></tr>`).join("")}
        </tbody>
      </table>
    </div>
    <p class="horarios-nota">Decidir no dia — reconfirmar antes de comprar.</p>` : "";
  return `
    <li>
      <strong>${esc(t.de)} → ${esc(t.para)}</strong>
      ${esc(t.modo)}${t.detalhe ? " — " + esc(t.detalhe) : ""}
      ${horariosHtml}
    </li>`;
}

function renderDestino(destino) {
  const sub = destinoSubtab[destino.id] || "itinerario";
  const subtabs = [
    { id: "itinerario", label: "Itinerário" },
    { id: "comer", label: "Comer" },
    { id: "ver", label: "Ver" },
    { id: "alojamento", label: "Alojamento" },
  ];
  const subtabsHtml = subtabs.map((t) => `
    <button class="subtab ${sub === t.id ? "ativo" : ""}" data-subtab="${t.id}">${esc(t.label)}</button>`).join("");

  let conteudo = "";
  if (sub === "itinerario") conteudo = renderItinerario(destino);
  else if (sub === "comer") conteudo = renderCards(destino.restaurantes || [], destino.id);
  else if (sub === "ver") conteudo = renderCardsVer(destino);
  else if (sub === "alojamento") conteudo = renderAlojamentoDestino(destino);

  return `<nav class="subtabs">${subtabsHtml}</nav><div style="padding-top:16px">${conteudo}</div>`;
}

function renderItinerario(destino) {
  const indice = (destino.dias || []).map((d, i) => `<a href="#dia-${destino.id}-${i}">${esc(d.data)}</a>`).join("");
  const dias = (destino.dias || []).map((d, i) => `
    <div class="dia-bloco" id="dia-${destino.id}-${i}">
      <h3 class="dia-titulo">${esc(d.data)} — ${esc(d.titulo)}</h3>
      ${(d.periodos || []).map((p) => `
        <div class="periodo">
          <p class="periodo-nome">${esc(p.periodo)}</p>
          ${(p.atividades || []).map((a) => atividadeHtml(a)).join("")}
        </div>`).join("")}
      <a class="voltar-indice" href="#topo-${destino.id}">↑ Voltar ao índice</a>
    </div>`).join("");
  return `<div id="topo-${destino.id}"></div><div class="indice-dias">${indice}</div>${dias}`;
}

function atividadeHtml(a) {
  return `
    <div class="atividade">
      <div class="atividade-titulo">${esc(a.titulo)}</div>
      <div class="atividade-meta">${[a.horario, a.duracao].filter(Boolean).join(" · ")}</div>
      ${a.nota ? `<div class="atividade-nota">${esc(a.nota)}</div>` : ""}
      ${atividadeLinksHtml(a)}
    </div>`;
}

function atividadeLinksHtml(a) {
  const links = [];
  (a.links || []).forEach((link) => links.push(link));
  const itemIds = [];
  if (a.itemId) itemIds.push(a.itemId);
  (a.itemIds || []).forEach((id) => itemIds.push(id));
  itemIds.forEach((id) => links.push({ itemId: id }));
  if (!links.length) return "";

  const html = links.map((link) => {
    if (link.itemId) {
      const found = findItemById(link.itemId);
      if (!found) return "";
      const label = link.label || found.item.nome || "Detalhes";
      return `<button class="btn secundario" type="button" data-open-item="${esc(link.itemId)}">${esc(label)}</button>`;
    }
    if (link.destinoId && link.subtab) {
      return `<button class="btn secundario" type="button" data-open-destino="${esc(link.destinoId)}" data-open-subtab="${esc(link.subtab)}">${esc(link.label || "Abrir")}</button>`;
    }
    if (link.tab) {
      return `<button class="btn secundario" type="button" data-open-tab="${esc(link.tab)}">${esc(link.label || "Abrir")}</button>`;
    }
    return "";
  }).filter(Boolean).join("");
  return html ? `<div class="atividade-acoes">${html}</div>` : "";
}

function renderCards(items, destinoId) {
  const grupos = {};
  items.forEach((it) => { (grupos[it.categoria] = grupos[it.categoria] || []).push(it); });
  return Object.keys(grupos).map((cat) => `
    <div class="categoria-grupo">
      <p class="categoria-titulo">${esc(cat)}</p>
      <div class="grid-cards">
        ${grupos[cat].map((it) => cardHtml(it)).join("")}
      </div>
    </div>`).join("");
}

function renderCardsVer(destino) {
  const todos = [].concat(destino.atracoes || [], destino.praias || [], destino.nightlife || []);
  return renderCards(todos, destino.id);
}

function renderAlojamentoDestino(destino) {
  const items = destino.alojamento || [];
  if (!items.length) return "<p>Ainda não há alojamento definido para este destino.</p>";
  return `<ul class="lista-simples">${items.map((a) => a.aDecidir ? `
    <li class="alojamento-pendente">
      <strong>${a.morada ? esc(a.morada) + " — " : ""}${esc(a.checkin || "")}${a.checkout ? " a " + esc(a.checkout) : ""}<span class="pendente-badge">A decidir</span></strong>
      ${a.observacoes ? esc(a.observacoes) : "Ainda por escolher — ver ferramenta de seleção de alojamento."}
    </li>` : `
    <li>
      <strong>${esc(a.nome)}</strong>
      ${a.morada ? esc(a.morada) + "<br>" : ""}
      ${a.checkin ? `Check-in: ${esc(a.checkin)}` : ""}${a.checkout ? ` · Check-out: ${esc(a.checkout)}` : ""}<br>
      ${[a.plataforma, a.contacto, a.telefone, a.email].filter(Boolean).map(esc).join(" · ")}
      ${a.observacoes ? `<br><em>${esc(a.observacoes)}</em>` : ""}
      <div class="btn-row"><a class="btn secundario" href="${mapsDirUrl(a.mapsQuery || a.nome)}" target="_blank" rel="noopener">Direções</a></div>
    </li>`).join("")}</ul>`;
}

function cardHtml(it) {
  // src nunca fica "" — um <img src=""> nem sempre dispara onerror (em vários
  // browsers resolve para a própria página), por isso a falta de foto já
  // arranca directamente no placeholder; onerror cobre só o caso de URL quebrado.
  const src = it.foto || placeholderImg(it.nome);
  const salvo = isSalvo(it.id);
  return `
    <div class="card" data-item-id="${esc(it.id)}">
      <button class="salvo-btn ${salvo ? "ativo" : ""}" type="button" data-salvo-toggle="${esc(it.id)}" aria-pressed="${salvo ? "true" : "false"}" aria-label="${salvo ? "Remover do roteiro" : "Guardar no roteiro"}" title="${salvo ? "Remover do roteiro" : "Guardar no roteiro"}">${salvo ? "★" : "☆"}</button>
      <img src="${esc(src)}" alt="${esc(it.nome)}" loading="lazy" onerror="this.onerror=null;this.src='${placeholderImg(it.nome)}'">
      <div class="card-body">
        <span class="card-categoria">${esc(it.categoria)}</span>
        <span class="card-nome">${esc(it.nome)}</span>
        <span class="card-desc">${esc(it.descricaoCurta)}</span>
        <span class="card-preco">${fmtPreco(it)}</span>
      </div>
    </div>`;
}

function placeholderImg(nome) {
  const letra = (nome || "?").trim().charAt(0).toUpperCase();
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'><rect width='100%' height='100%' fill='%23f1e4d2'/><text x='50%' y='50%' font-family='Georgia,serif' font-size='90' fill='%23a8763e' text-anchor='middle' dominant-baseline='central'>${letra}</text></svg>`;
  return "data:image/svg+xml," + svg;
}

function findItemById(id) {
  for (const d of DATA.destinos) {
    const all = [].concat(d.restaurantes || [], d.atracoes || [], d.praias || [], d.nightlife || []);
    const found = all.find((it) => it.id === id);
    if (found) return { item: found, destino: d };
  }
  return null;
}

function openModal(id) {
  const found = findItemById(id);
  if (!found) return;
  const it = found.item, destino = found.destino;
  const pessoas = DATA.meta.numeroPessoas || 1;
  const salvo = isSalvo(it.id);
  const precoBloco = it.gratis || it.precoSimbolo === "Grátis"
    ? `<div class="modal-linha"><span>Preço</span><span>Grátis</span></div>`
    : (it.precoPessoa !== undefined && it.precoPessoa !== null
      ? `<div class="modal-linha"><span>Preço por pessoa</span><span>€${it.precoPessoa}${it.precoInclui ? " (" + esc(it.precoInclui) + ")" : ""}</span></div>
         ${pessoas > 1 ? `<div class="modal-linha"><span>Total (${pessoas} pessoas)</span><span>€${(it.precoPessoa * pessoas).toFixed(0)}</span></div>` : ""}`
      : `<div class="modal-linha"><span>Preço</span><span>Não disponível</span></div>`);
  const estacionamento = it.estacionamento ? `<div class="modal-linha"><span>🅿 Estacionamento</span><span>${esc(it.estacionamento)}</span></div>` : "";

  const botoes = [
    `<a class="btn" href="${mapsDirUrl(it.mapsQuery || it.nome)}" target="_blank" rel="noopener">Direções</a>`,
    it.siteOficial ? `<a class="btn secundario" href="${esc(it.siteOficial)}" target="_blank" rel="noopener">Site oficial</a>` : "",
    it.fonte ? `<a class="btn secundario" href="${esc(it.fonte)}" target="_blank" rel="noopener">Fonte</a>` : "",
    it.reserva ? `<a class="btn secundario" href="${esc(it.reserva)}" target="_blank" rel="noopener">Reserva / Bilhetes</a>` : "",
    `<a class="btn secundario" href="${waShareUrl("📍 " + it.nome + " — " + destino.nome + "\n" + (it.descricaoCurta || "") + "\n📍 " + mapsDirUrl(it.mapsQuery || it.nome))}" target="_blank" rel="noopener">WhatsApp</a>`,
    `<a class="btn secundario" href="${mailShareUrl(it.nome, (it.descricaoCompleta || it.descricaoCurta || "") + "\n\n" + mapsDirUrl(it.mapsQuery || it.nome))}">Email</a>`,
  ].filter(Boolean).join("");

  document.getElementById("modal").innerHTML = `
    <button class="modal-fechar" id="fecharModal">✕</button>
    <img src="${esc(it.foto || placeholderImg(it.nome))}" alt="${esc(it.nome)}" loading="lazy" onerror="this.onerror=null;this.src='${placeholderImg(it.nome)}'">
    <div class="modal-body">
      <div class="modal-topo">
        <div>
          <span class="modal-categoria">${esc(it.categoria)}</span>
          <h3 class="modal-nome">${esc(it.nome)}</h3>
        </div>
        <button class="btn secundario" type="button" data-salvo-toggle="${esc(it.id)}" aria-pressed="${salvo ? "true" : "false"}">${salvo ? "★ Guardado" : "☆ Guardar"}</button>
      </div>
      <p class="modal-desc">${esc(it.descricaoCompleta || it.descricaoCurta || "")}</p>
      ${it.horario ? `<div class="modal-linha"><span>Horário</span><span>${esc(it.horario)}</span></div>` : ""}
      ${precoBloco}
      ${estacionamento}
      ${it.distanciaAlojamento ? `<div class="modal-linha"><span>Distância do alojamento</span><span>${esc(it.distanciaAlojamento)}</span></div>` : ""}
      ${it.reviews ? `<div class="modal-linha"><span>Reviews</span><span>${esc(it.reviews)}</span></div>` : ""}
      ${it.dicas ? `<p class="modal-dicas">${esc(it.dicas)}</p>` : ""}
      <div class="modal-botoes">${botoes}</div>
    </div>`;
  document.getElementById("overlay").classList.add("ativo");
  document.getElementById("fecharModal").addEventListener("click", closeModal);
}

function closeModal() {
  document.getElementById("overlay").classList.remove("ativo");
}

document.getElementById("overlay").addEventListener("click", (e) => {
  if (e.target.id === "overlay") closeModal();
});

document.getElementById("tabsTopo").addEventListener("click", (e) => {
  const btn = e.target.closest("button.tab");
  if (!btn) return;
  tabAtual = btn.dataset.tab;
  render();
});

document.getElementById("main").addEventListener("click", (e) => {
  const subtab = e.target.closest("button.subtab");
  if (subtab) {
    destinoSubtab[tabAtual] = subtab.dataset.subtab;
    renderMain();
    return;
  }
  const itemBtn = e.target.closest("[data-open-item]");
  if (itemBtn) {
    e.preventDefault();
    e.stopPropagation();
    openModal(itemBtn.dataset.openItem);
    return;
  }
  const destinoBtn = e.target.closest("[data-open-destino][data-open-subtab]");
  if (destinoBtn) {
    e.preventDefault();
    e.stopPropagation();
    tabAtual = destinoBtn.dataset.openDestino;
    destinoSubtab[tabAtual] = destinoBtn.dataset.openSubtab;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  const tabBtn = e.target.closest("[data-open-tab]");
  if (tabBtn) {
    e.preventDefault();
    e.stopPropagation();
    tabAtual = tabBtn.dataset.openTab;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  const salvoBtn = e.target.closest("[data-salvo-toggle]");
  if (salvoBtn) {
    e.preventDefault();
    e.stopPropagation();
    toggleSalvo(salvoBtn.dataset.salvoToggle);
    return;
  }
  const card = e.target.closest(".card");
  if (card) { openModal(card.dataset.itemId); return; }
  if (e.target.id === "fuelPartida" || e.target.id === "fuelConsumo" || e.target.id === "fuelDistancia" || e.target.id === "fuelPreco") return;
});
document.getElementById("main").addEventListener("input", (e) => {
  if (["fuelPartida", "fuelConsumo", "fuelDistancia", "fuelPreco"].includes(e.target.id)) calcFuel();
});
document.getElementById("modal").addEventListener("click", (e) => {
  const salvoBtn = e.target.closest("[data-salvo-toggle]");
  if (!salvoBtn) return;
  e.preventDefault();
  e.stopPropagation();
  toggleSalvo(salvoBtn.dataset.salvoToggle);
});

render();
if (DATA.combustivel) setTimeout(calcFuel, 0);
</script>
</body>
</html>
