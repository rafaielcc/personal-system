<!doctype html>
<!--
  AGENDA · HOME HUB — TEMPLATE DE ESTRUTURA (v7 DARK · 2 modos, Classico/Polegar, 23 Set 2026)
  =============================================================================================
  Consumido por render.py (mesma pasta Drive): a LLM produz apenas o JSON
  canonico do modulo dashboard; este ficheiro e preenchido por substituicao
  de texto pura, sem juizo de conteudo. Placeholders {{TOKEN}} — ver schema
  no cabecalho de render.py. NENHUM token mudou desde a v6 — render.py v6
  continua valido sem alteracoes.

  Mudancas v7 (23 Set 2026, pedido do Rafa apos usar a v6 em real: sentiu
  falta do alternador de modo removido na v6): reintroduz um alternador no
  rodape, agora com APENAS 2 modos (nao os 3 antigos da v5 — a faixa de
  prioridades do antigo modo Polegar nao volta, esse conteudo continua fora
  do hub):
    - Classico (por omissao, igual ao layout unico da v6): barra do tempo
      horizontal no topo, grelha de 12 icones em 4 colunas por baixo.
    - Polegar: barra do tempo passa a faixa VERTICAL encostada ao lado
      DIREITO do ecra; a grelha de icones desloca-se para o lado ESQUERDO
      (2 colunas, mais larga) — pedido explicito do Rafa para ficar mais
      acessivel ao polegar ao segurar o telemovel com uma mao.
  Preferencia de modo guardada em localStorage (so no browser do proprio
  Rafa, conveniencia de UI — nunca afecta o JSON canonico nem o que a LLM
  produz). Sem alteracao ao schema/dados: mesmos campos meta/counts/weather
  de sempre, so a disposicao visual muda por modo.

  HOSTING (actual): Cloudflare Pages serve o repositorio GitHub
  rafaielcc/personal-system automaticamente. Site base:
    https://personal-system-hs5.pages.dev/
  Estrutura publicada (caminhos SEMPRE tal como no GitHub — atencao a
  maiusculas/minusculas, e case-sensitive):
    agendas/index.html            ← ESTE ficheiro (o Dashboard e a raiz de agendas/)
    agendas/briefing/index.html   ← briefing diario (tabs internas; audio no topo da tab Hoje)
    agendas/Hff/index.html        ← painel HFF pessoal (H maiusculo!)
    agendas/bo/index.html         ← lista cirurgica da equipa (sem icone — intencional)
    agendas/lazer/index.html      ← agenda de lazer
    agendas/noticiasB3/index.html ← pagina standalone Noticias/Financas B3 (rotina AII)
    agendas/artigos/index.html    ← Artigos Cientificos (trigger proprio, skill artigos)
    agendas/viagem-atual/index.html ← guia da viagem em curso
    agendas/cirped/index.html     ← modulo CIRPED, Historia & Charada (trigger proprio, skill cirped)
    agendas/notificacoes/index.html ← triagem de notificacoes WhatsApp (trigger proprio, skill notificacoes)
    personal-development/testme/index.html ← modulo TestMe (caminho absoluto, ver atalho JS no fim)
    personal-development/carnegie/{curso-completo.html, semanas/semana-NN.html} ← curso Carnegie/Personal Dev
  Como este ficheiro vive em agendas/, os links relativos abaixo sao
  directos as subpastas (Hff/index.html, briefing/index.html#tempo, ...).

  NOTA TECNICA — deep link para tabs do briefing:
  O link do tempo usa fragmento (#tempo — tab existente no briefing). Para
  abrir ja na tab certa, o briefing precisa de um pequeno hash-router no
  arranque (ja implementado, ver agendas/briefing/index.html):
    window.addEventListener('DOMContentLoaded', () => {
      const h = location.hash.replace('#','');
      if (h) showTab(h);
    });
  (nota de implementacao para o ficheiro de destino, nao faz parte deste hub)

  Expansiveis nativos (details/summary) — sem JS adicional, offline. Nao ha
  nenhum neste template.
-->
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda · Início</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frances:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0C1E2A;
    --bg-2:#0A1822;
    --navy:#1A3D52;
    --navy-2:#102B3A;
    --card:#16303F;
    --border:#28495C;
    --ink:#F3EDE0;          /* texto principal — creme brilhante */
    --ink-strong:#FFFFFF;
    --muted:#9FB4C2;
    --terracotta:#E07A4B;
    --gold:#E3B858;
    --sage:#8FBE95;
    --teal:#2CC7B4;
    --red:#E36A5A;
    --blue:#7FAFD9;
    --radius:16px;
    --radius-sm:12px;
    --shadow:0 1px 3px rgba(0,0,0,.35), 0 6px 16px rgba(0,0,0,.30);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(180deg, var(--bg), var(--bg-2));
    color:var(--ink);
    font-family:'DM Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:88px; /* espaço para a barra de modo fixa no rodapé */
  }
  h1,h2,h3{ font-family:'Frances', serif; margin:0; }
  a{ text-decoration:none; color:inherit; }
  .wrap{ max-width:680px; margin:0 auto; padding:0 14px 32px; }

  /* ===== TOPBAR — linha unica, condensado ===== */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(160deg, var(--navy), var(--navy-2));
    padding:12px 14px 10px;
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{ max-width:680px; margin:0 auto; }
  .topbar-row1{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .datebig{
    font-family:'Frances', serif; font-size:17px; font-weight:700; color:var(--ink-strong);
    letter-spacing:.01em; white-space:nowrap;
  }
  .chip{
    font-size:12px; font-weight:700; color:var(--ink);
    background:rgba(255,255,255,.08); border:1px solid var(--border);
    border-radius:999px; padding:4px 9px;
    display:flex; align-items:center; gap:5px; white-space:nowrap;
  }
  .chip b{ color:var(--gold); font-size:12.5px; }

  /* ===== CORPO DO HUB — barra do tempo + grelha, disposicao muda por modo ===== */
  .hub-body{ display:block; }

  /* ===== BARRA DO TEMPO — clicavel, leva a aba de tempo do briefing ===== */
  .wbar-link{ display:block; }
  .wbar{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm);
    margin:12px 0 18px; padding:9px 6px;
    display:grid; grid-template-columns:repeat(3,1fr);
    transition:border-color .12s;
  }
  .wbar-link:active .wbar{ border-color:var(--gold); }
  .wbar-cell{
    text-align:center; font-size:12px; font-weight:600; color:var(--ink);
    display:flex; flex-direction:column; align-items:center; gap:1px;
    border-right:1px solid var(--border);
  }
  .wbar-cell:last-child{ border-right:none; }
  .wbar-time{ font-size:10px; color:var(--muted); font-weight:700; }
  .wbar-main{ font-size:13px; }
  .wbar-activity{ font-size:14px; margin-top:1px; }

  /* ===== GRID DE ICONES — soltos, sem caixa, com legenda ===== */
  .grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:14px 2px; margin-bottom:16px;
  }
  .tile{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:8px 0; position:relative; transition:transform .12s;
  }
  .tile:active{ transform:scale(.90); }
  .tile-circle{
    width:48px; height:48px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:21px;
    box-shadow:var(--shadow); position:relative;
  }
  .tile-label{ font-size:11px; color:var(--muted); text-align:center; line-height:1.15; }
  .c-cream{ background:#F5F0E8; }
  .c-blue{ background:#DCE9F7; }
  .c-terracotta{ background:#F7DCC9; }
  .c-coral{ background:#F5CBB8; }
  .c-red{ background:#FAD9D4; }
  .c-teal{ background:#CFF2EC; }
  .c-periwinkle{ background:#DEE2F6; }
  .c-gold{ background:#F8EBC9; }
  .c-sage{ background:#DCEBDD; }
  .c-rose{ background:#F3D9E2; }
  .c-lilac{ background:#E3DAF2; }
  .c-navy{ background:#D8E3EA; }

  /* ===== MODO POLEGAR — tempo em faixa vertical a direita, icones a esquerda ===== */
  body[data-mode="polegar"] .hub-body{
    display:flex; align-items:flex-start; gap:10px;
  }
  body[data-mode="polegar"] .grid{
    order:1; flex:1 1 auto; min-width:0;
    grid-template-columns:repeat(2,1fr); gap:16px 10px;
  }
  body[data-mode="polegar"] .wbar-link{
    order:2; flex:0 0 auto;
  }
  body[data-mode="polegar"] .wbar{
    grid-template-columns:1fr; grid-template-rows:repeat(3,1fr);
    width:64px; padding:8px 4px; margin:12px 0 0; gap:10px 0;
  }
  body[data-mode="polegar"] .wbar-cell{
    border-right:none; border-bottom:1px solid var(--border); padding-bottom:8px;
  }
  body[data-mode="polegar"] .wbar-cell:last-child{ border-bottom:none; padding-bottom:0; }

  /* ===== FOOTER ===== */
  .footer{ text-align:center; margin-top:20px; }
  .footer p{ font-size:11px; color:var(--muted); margin:0; }

  /* ===== BARRA DE MODO — fixa no rodape, 2 estados ===== */
  .mode-switch{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    max-width:680px; margin:0 auto;
    display:grid; grid-template-columns:1fr 1fr;
    background:linear-gradient(0deg, var(--navy-2), var(--navy));
    border-top:1px solid var(--border);
    box-shadow:0 -4px 12px rgba(0,0,0,.30);
  }
  .mode-btn{
    appearance:none; -webkit-appearance:none; border:none; background:transparent;
    color:var(--muted); font-family:'DM Sans', sans-serif; font-size:13px; font-weight:700;
    padding:13px 0; cursor:pointer; transition:color .12s;
  }
  .mode-btn[aria-pressed="true"]{ color:var(--ink-strong); }
  .mode-btn:active{ opacity:.7; }
</style>
</head>
<body>

  <!-- ===== TOPBAR — data + badges de calendario/tarefas ===== -->
  <div class="topbar">
    <div class="topbar-inner">
      <div class="topbar-row1">
        <div class="datebig">Qua, 23 Set</div>
        <span class="chip">📅 <b>1</b></span>
        <span class="chip">✅ <b>2</b></span>
      </div>
    </div>
  </div>

  <div class="wrap">

    <div class="hub-body" id="hubBody">

      <!-- ===== TIRA DO TEMPO — clicavel, leva a aba de tempo do briefing ===== -->
      <a class="wbar-link" href="briefing/index.html#tempo" title="Tempo — abrir no Briefing" aria-label="Tempo — abrir no Briefing">
        <div class="wbar">
          <div class="wbar-cell">
            <span class="wbar-time">08h</span>
            <span class="wbar-main">— —°</span>
            <span class="wbar-activity" title="">·</span>
          </div>
          <div class="wbar-cell">
            <span class="wbar-time">16h</span>
            <span class="wbar-main">— —°</span>
            <span class="wbar-activity" title="">·</span>
          </div>
          <div class="wbar-cell">
            <span class="wbar-time">20h</span>
            <span class="wbar-main">— —°</span>
            <span class="wbar-activity" title="">·</span>
          </div>
        </div>
      </a>

      <!-- ===== GRELHA DE 12 ICONES — atalhos estaticos, sem dados por preencher ===== -->
      <div class="grid">
        <a class="tile" href="briefing/index.html" title="Briefing · áudio do dia" aria-label="Briefing">
          <span class="tile-circle c-cream">🎧</span>
          <span class="tile-label">Briefing</span>
        </a>
        <a class="tile" href="briefing/index.html#calendario" title="Calendário" aria-label="Calendário">
          <span class="tile-circle c-blue">📅</span>
          <span class="tile-label">Calendário</span>
        </a>
        <a class="tile" href="Hff/index.html" title="Painel HFF" aria-label="Painel HFF">
          <span class="tile-circle c-terracotta">🏥</span>
          <span class="tile-label">HFF</span>
        </a>
        <a class="tile" href="Hff/index.html#cirurgias" title="Cirurgias HFF" aria-label="Cirurgias HFF">
          <span class="tile-circle c-coral">🩺</span>
          <span class="tile-label">Cirurgias</span>
        </a>
        <a class="tile" href="noticiasB3/index.html" title="Notícias do Dia · Finanças B3" aria-label="Notícias do Dia">
          <span class="tile-circle c-red">📈</span>
          <span class="tile-label">Notícias</span>
        </a>
        <a class="tile" href="lazer/index.html" title="Agenda de Lazer" aria-label="Agenda de Lazer">
          <span class="tile-circle c-teal">🎭</span>
          <span class="tile-label">Lazer</span>
        </a>
        <a class="tile" href="viagem-atual/index.html" title="Viagem atual" aria-label="Viagem atual">
          <span class="tile-circle c-periwinkle">✈️</span>
          <span class="tile-label">Viagem</span>
        </a>
        <a class="tile" href="artigos/index.html" title="Artigos Científicos" aria-label="Artigos Científicos">
          <span class="tile-circle c-gold">📄</span>
          <span class="tile-label">Artigos</span>
        </a>
        <a class="tile testme-link" href="/personal-development/testme/index.html" title="TestMe" aria-label="TestMe">
          <span class="tile-circle c-sage">🧪</span>
          <span class="tile-label">TestMe</span>
        </a>
        <a class="tile" href="cirped/index.html" title="História · Cirurgia Pediátrica" aria-label="História — Cirurgia Pediátrica">
          <span class="tile-circle c-rose">📜</span>
          <span class="tile-label">História</span>
        </a>
        <a class="tile carnegie-link" href="/personal-development/carnegie/curso-completo.html" title="Personal Dev" aria-label="Personal Dev">
          <span class="tile-circle c-lilac">📘</span>
          <span class="tile-label">Personal Dev</span>
        </a>
        <a class="tile" href="notificacoes/index.html" title="Notificações" aria-label="Notificações">
          <span class="tile-circle c-navy">🔔</span>
          <span class="tile-label">Notificações</span>
        </a>
      </div>

    </div>

    <div class="footer">
      <p>Hub leve · toca num ícone para abrir o módulo</p>
    </div>

  </div>

  <!-- ===== BARRA DE MODO — fixa no rodape, alterna Classico/Polegar ===== -->
  <div class="mode-switch" role="tablist" aria-label="Modo de visualização">
    <button type="button" class="mode-btn" data-set-mode="classico" aria-pressed="true">🖥️ Clássico</button>
    <button type="button" class="mode-btn" data-set-mode="polegar" aria-pressed="false">👍 Polegar</button>
  </div>

<script>
  // ===== Atalho TestMe — path absoluto, funciona tanto em agendas/index.html como no espelho na raiz =====
  (function(){
    var href = '/personal-development/testme/index.html';
    document.querySelectorAll('.testme-link').forEach(function(a){ a.href = href; });
  })();

  // ===== Atalho Personal Dev (Carnegie) — icone unico no grid, aponta para a semana actual (fetch ao vivo, mesmo dominio) =====
  (function(){
    function aplicarLinkCarnegie(dados){
      document.querySelectorAll('.carnegie-link').forEach(a => {
        if (dados.link_semana_html) a.href = dados.link_semana_html;
        if (dados.semana_atual && dados.total_semanas){
          var label = 'Personal Dev · Semana ' + dados.semana_atual + ' de ' + dados.total_semanas;
          a.title = label;
          a.setAttribute('aria-label', label);
        }
      });
    }

    fetch('../personal-development/carnegie/data/estado-atual.json')
      .then(r => { if (!r.ok) throw new Error('status ' + r.status); return r.json(); })
      .then(dados => aplicarLinkCarnegie(dados))
      .catch(err => console.warn('Não foi possível carregar o estado do Personal Dev:', err));
  })();

  // ===== Alternador de modo Classico/Polegar — preferencia guardada so no browser (localStorage), nunca afecta dados =====
  (function(){
    var KEY = 'agenda_dashboard_mode';
    var body = document.body;
    var buttons = document.querySelectorAll('.mode-btn');

    function applyMode(mode){
      body.setAttribute('data-mode', mode);
      buttons.forEach(function(btn){
        var active = btn.getAttribute('data-set-mode') === mode;
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
    }

    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    applyMode(saved === 'polegar' ? 'polegar' : 'classico');

    buttons.forEach(function(btn){
      btn.addEventListener('click', function(){
        var mode = btn.getAttribute('data-set-mode');
        applyMode(mode);
        try { localStorage.setItem(KEY, mode); } catch (e) {}
      });
    });
  })();
</script>

</body>
</html>
