<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TestMe</title>
<style>
  :root{
    --bg:#f6f3ee;
    --surface:#ffffff;
    --ink:#1e2428;
    --muted:#65727b;
    --line:#d9dedf;
    --blue:#2f6f9f;
    --green:#3b7a57;
    --amber:#b67818;
    --red:#b94d45;
    --lilac:#7a5c99;
    --shadow:0 8px 24px rgba(30,36,40,.10);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
  button,input,select,textarea{font:inherit}
  .wrap{max-width:980px;margin:0 auto;padding:18px 14px 42px}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}
  h1{margin:0;font-size:28px;letter-spacing:0}
  .sub{margin:4px 0 0;color:var(--muted);font-size:14px}
  .status{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}
  .chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;color:var(--muted)}
  .tabs{display:flex;gap:6px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:16px}
  .tab-btn{border:0;background:transparent;padding:11px 10px;border-bottom:3px solid transparent;color:var(--muted);font-weight:800;white-space:nowrap;cursor:pointer}
  .tab-btn.active{color:var(--blue);border-color:var(--blue)}
  .tab{display:none}
  .tab.active{display:block}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .split{display:grid;grid-template-columns:1fr 300px;gap:14px}
  h2{font-size:20px;margin:0 0 10px}
  h3{font-size:16px;margin:0 0 8px}
  p{line-height:1.5}
  .stem{font-size:18px;line-height:1.55;margin:12px 0}
  .meta{color:var(--muted);font-size:13px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer}
  .btn[aria-pressed="true"]{box-shadow:0 0 0 3px rgba(47,111,159,.18)}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:white}
  .btn.green{background:var(--green);border-color:var(--green);color:white}
  .btn.amber{background:var(--amber);border-color:var(--amber);color:white}
  .btn.red{background:var(--red);border-color:var(--red);color:white}
  .btn.icon{padding:7px 10px}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  details{border:1px solid var(--line);border-radius:8px;background:#fbfcfc;margin-top:12px}
  summary{cursor:pointer;padding:12px 13px;font-weight:900}
  details .body{padding:0 13px 13px}
  .options{display:grid;gap:8px;margin:10px 0}
  .option{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fbfcfc;display:flex;gap:9px;align-items:flex-start;cursor:pointer}
  .option input{margin-top:3px}
  .option.selected{border-color:var(--blue);background:#eef6fb}
  .progress{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
  .question-card{border-top:1px solid var(--line);padding:14px 0}
  .question-card:first-child{border-top:0;padding-top:0}
  textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;background:white}
  select,input[type="number"]{border:1px solid var(--line);border-radius:8px;padding:8px;background:white}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .stat{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fbfcfc}
  .bar{height:8px;background:#e7eaeb;border-radius:99px;overflow:hidden;margin-top:8px}
  .bar span{display:block;height:100%;background:var(--blue);width:0}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1e2428;color:white;padding:10px 13px;border-radius:8px;font-size:13px;display:none}
  .empty{color:var(--muted);font-style:italic}
  .notice{border:1px solid #ead39c;background:#fff8e8;color:#6f4b0c;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45;margin-bottom:12px}
  @media (max-width:760px){
    header{display:block}
    .status{justify-content:flex-start;margin-top:10px}
    .split{grid-template-columns:1fr}
  }
</style>
</head>

pcional; dieta precoce sem clarificar o ducto pode agravar dor, fistula ou colecoes.","source_type":"generated_practice","source_ref":"atualizar_testme_20260905_run2"},"question_bank_summary":{"total_saved":1,"by_topic":{"Upper GI":1},"by_format":{"mcq":1}},"current_exam":{"simulado_id":"sim_20260905_002","status":"em_andamento","generated_at":"2026-09-05T19:12:40+01:00","size":5,"requested_topics":[],"format_mix":{"mcq":3,"discursiva":2},"questions":[{"question_id":"sim_20260905b_q001","topic":"Upper GI","format":"mcq","difficulty":"assistente_graduado","stem":"Recem-nascido com atresia esofagica tipo C foi submetido a laqueacao da fistula e anastomose primaria sob alguma tensao. No 5.o dia, drenagem salivar pequena pelo dreno cervical/toracico, sem instabilidade, sem colecao significativa e ventilacao em desmame. Qual conduta inicial e mais defensavel?","options":[{"label":"A","text":"Reoperar imediatamente para refazer a anastomose, porque qualquer fistula salivar implica falha tecnica"},{"label":"B","text":"Tratamento conservador com drenagem adequada, antibiotico/suporte nutricional e vigilancia estreita se a fuga for pequena e bem controlada"},{"label":"C","text":"Retirar o dreno para permitir encerramento espontaneo mais rapido"},{"label":"D","text":"Dilatar precocemente a anastomose para reduzir pressao intraluminal"}],"correct_answer":"B","explanation":"Fugas pequenas, drenadas e sem sepsis podem ser manejadas conservadoramente. Reoperacao fica para deiscencia ampla, contaminacao nao controlada ou deterioracao. Retirar drenagem ou dilatar em fase aguda aumenta risco."},{"question_id":"sim_20260905b_q002","topic":"Torax","format":"mcq","difficulty":"assistente_graduado","stem":"RN com hernia diafragmatica congenita esquerda, hipertensao pulmonar significativa e necessidade de ventilacao de alta frequencia estabiliza apos 48 horas, com lactato em queda e menor suporte vasoativo. A familia pergunta quando sera operado. Qual criterio e mais apropriado para timing de reparacao?","options":[{"label":"A","text":"Operar sempre nas primeiras 6 horas para permitir expansao pulmonar"},{"label":"B","text":"Aguardar estabilizacao fisiologica cardio-respiratoria antes da reparacao, sem perseguir cirurgia emergente apenas pela anatomia"},{"label":"C","text":"Adiar obrigatoriamente ate extubacao completa"},{"label":"D","text":"Colocar dreno toracico profilatico antes da reparacao para melhorar mediastino"}],"correct_answer":"B","explanation":"Na CDH, a prioridade inicial e estabilizacao ventilatoria/hemodinamica e controlo da hipertensao pulmonar. A reparacao ocorre apos estabilizacao adequada; nem emergencia anatomica imediata nem espera por extubacao sao regras absolutas."},{"question_id":"sim_20260905b_q003","topic":"Urologia","format":"mcq","difficulty":"assistente_graduado","stem":"Lactente com hipospadias proximal, chordee acentuado e testiculo unilateral nao palpavel e referenciado para correcao. Qual passo deve preceder qualquer plano reconstrutivo definitivo?","options":[{"label":"A","text":"Circuncisao para facilitar higiene enquanto aguarda cirurgia"},{"label":"B","text":"Avaliar possibilidade de DSD com cariotipo/estudo endocrino e localizacao gonadal, alem de planear reconstrucao em equipa experiente"},{"label":"C","text":"Reparacao tubularizada em tempo unico sem estudo adicional se o meato for visivel"},{"label":"D","text":"Tratamento hormonal empirico como substituto da avaliacao anatomica"}],"correct_answer":"B","explanation":"Hipospadias proximal associado a gonada nao palpavel e sinal de alerta para DSD. Circuncisao remove tecido util para reconstrucao. O plano depende de anatomia, endocrinologia, gonadas e objetivos funcionais."},{"question_id":"sim_20260905b_q004","topic":"Oncologia","format":"discursiva","difficulty":"assistente_graduado","stem":"Crianca de 3 anos com massa suprarrenal, calcificacoes e envolvimento de vasos mesentericos/celiacos na imagem, sem instabilidade. Estrutura a abordagem inicial de um neuroblastoma suspeito com image-defined risk factors.","options":[],"correct_answer":"Resposta esperada: confirmar extensao por imagem adequada e MIBG/PET conforme disponibilidade; avaliar catecolaminas, medula, metastases, LDH/ferritina/NSE conforme protocolo; evitar resseccao primaria agressiva se ha IDRFs; obter tecido de forma segura para histologia, biologia molecular e estratificacao de risco; discutir em oncologia pediatrica/cirurgia/radiologia; iniciar tratamento neoadjuvante conforme grupo de risco e reavaliar resseccao apos resposta.","explanation":"A resposta deve distinguir biopsia/estratificacao de resseccao upfront e mostrar que IDRFs mudam risco cirurgico e timing."},{"question_id":"sim_20260905b_q005","topic":"Outros","format":"discursiva","difficulty":"assistente_graduado","stem":"Recem-nascido com malformacao linfatica cervicofacial extensa, estridor intermitente e dificuldade alimentar. Descreve prioridades de avaliacao e tratamento inicial, incluindo quando nao se deve precipitar uma excisao cirurgica.","options":[],"correct_answer":"Resposta esperada: prioridade a via aerea e alimentacao; avaliar extensao cervical/oral/mediastinica com imagem adequada; envolver ORL/anestesia/cuidados intensivos/radiologia de intervencao; planear intubacao dificil ou traqueostomia se necessario; tratar infeccao/hemorragia aguda; considerar escleroterapia, terapias sistemicas selecionadas ou cirurgia faseada conforme tipo macro/microcistico, sintomas e anatomia; evitar excisao agressiva inicial quando ha risco neurovascular/funcional elevado e sem controlo da via aerea.","explanation":"A resposta deve priorizar via aerea e estrategia multidisciplinar, nao uma excisao completa reflexa."}]},"recent_correction":{"simulado_id":"sim_20260905_001","corrected_at":"2026-09-05T19:12:40+01:00","total_score":5,"max_score":7,"items":[{"question_id":"sim_20260905_q001","topic":"Neonatologia","format":"mcq","rafael_answer":"B","correct_answer":"B","score":1,"max_points":1,"llm_comment":"Correta. Reconheceste que a deterioracao clinico-laboratorial e a alca fixa persistente podem justificar intervencao mesmo sem pneumoperitoneu."},{"question_id":"sim_20260905_q002","topic":"Hepatobiliar/Pancreatico","format":"mcq","rafael_answer":"B","correct_answer":"B","score":1,"max_points":1,"llm_comment":"Correta. A resposta privilegia excisao completa do quisto e reconstrucao biliodigestiva, evitando drenagem interna simples."},{"question_id":"sim_20260905_q003","topic":"Urologia","format":"mcq","rafael_answer":"C","correct_answer":"C","score":1,"max_points":1,"llm_comment":"Correta. O foco adequado e drenagem vesical eficaz, com valvotomia se tecnicamente segura ou vesicostomia temporaria se o contexto neonatal/anestesico assim o exigir."},{"question_id":"sim_20260905_q004","topic":"Oncologia","format":"discursiva","rafael_answer":"I'd say it depends entirely on the institution protocol because we have two main protocols. I need to see which one the institution has adopted. One protocol advocates for mastectomy, while the other advocates for neoadjuvant chemotherapy. We should check local protocol and discuss with the oncology team before making any decision.","correct_answer":"Confirmar extensao local/vascular e metastatica, avaliar trombo na veia renal/cava e relacao supra-hepatica/auricular, rim contralateral, hipertensao, funcao renal e risco anestesico; discutir em equipa multidisciplinar e seguir protocolo institucional, considerando quimioterapia pre-operatoria quando indicada e evitando ruptura/biopsia fora de protocolo.","score":0.5,"max_points":2,"llm_comment":"Resposta parcialmente correta por reconhecer a dependencia do protocolo institucional e a necessidade de oncologia/neoadjuvancia. Ficou curta para o caso: o dado discriminante era o trombo caval. Faltaram estadiamento vascular detalhado, metastases, rim contralateral, hipertensao/funcao renal, risco anestesico e planeamento de controlo vascular. A palavra 'mastectomy' esta errada neste contexto e sugere troca terminologica relevante."},{"question_id":"sim_20260905_q005","topic":"Lower GI","format":"discursiva","rafael_answer":"O tamanho do seio urogenital e decisivo para a decisao de reconstrucao das persistencias de cloaca. Um seio urogenital maior do que 2 a 3 cm e considerado longo e, portanto, a abordagem pode ser diferente e o timing diferente. Enquanto o seio urogenital curto permite uma cirurgia mais precoce com mobilizacao total do seio urogenital, o seio urogenital longo pode requerer tratamento mais estadiado, com a descompressao da parte genital que ja foi realizada e o desvio da parte fecal com a colostomia, para posterior reconstrucao complexa atraves do acesso perineal, que e frequentemente abdomino-perineal.","correct_answer":"Estabilizar com derivacao fecal e drenagem urinaria/genital quando necessario; proteger rim e tratar hidrometrocolpos/ITU; caracterizar anatomia por cloacograma, cistoscopia/vaginoscopia e imagem complementar, incluindo canal comum, uretra, vagina(s), fistulas, sacro/coluna e anomalias associadas; planear reconstrucao em centro experiente, com abordagem posterior, mobilizacao urogenital parcial/total ou combinada conforme anatomia.","score":1.5,"max_points":2,"llm_comment":"Boa resposta. Identificaste corretamente o comprimento do canal comum/seio urogenital como fator decisivo, distinguiste canal curto/longo e referiste drenagem genital e derivacao fecal. Para resposta completa faltou explicitar melhor a avaliacao pre-operatoria: protecao renal, estudo endoscopico/radiologico detalhado, anomalias urinarias/vertebro-sacras e planeamento multidisciplinar."}]},"evolution":{"by_topic":{"Neonatologia":{"percent":100,"answered":1},"Hepatobiliar/Pancreatico":{"percent":100,"answered":1},"Urologia":{"percent":100,"answered":1},"Oncologia":{"percent":25,"answered":1},"Lower GI":{"percent":75,"answered":1}},"by_format":{"mcq":{"percent":100,"answered":3},"discursiva":{"percent":50,"answered":2}},"history":[{"simulado_id":"sim_20260905_001","corrected_at":"2026-09-05T19:12:40+01:00","total_score":5,"max_score":7,"percent":71,"score_by_topic":{"Neonatologia":100,"Hepatobiliar/Pancreatico":100,"Urologia":100,"Oncologia":25,"Lower GI":75}}]}}</script>
<script>
const DATA = JSON.parse(document.getElementById('testme-data').textContent);
const $ = (sel, root=document) => root.querySelector(sel);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORE_KEY = 'testme:state:v1';
const QUEUE_KEY = 'testme:pendingActions:v1';
const localState = loadLocalState();

function loadLocalState(){
  try {
    return JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
  } catch {
    return {};
  }
}

function saveLocalState(){
  localStorage.setItem(STORE_KEY, JSON.stringify(localState));
}

function queueLocalAction(body){
  let queue = [];
  try {
    queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
  } catch {
    queue = [];
  }
  queue.push(body);
  localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
}

function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2600);
}

function speak(text){
  if (!('speechSynthesis' in window)) return toast('Audio indisponivel neste browser.');
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'pt-PT';
  window.speechSynthesis.speak(utterance);
}

async function postAction(type, payload){
  const url = DATA.config?.apps_script_url;
  const body = {type, created_at:new Date().toISOString(), payload};
  if (!url){
    queueLocalAction(body);
    renderStatus();
    toast('Guardado neste browser. Falta ligar o Apps Script para gravar na Sheet.');
    return {queued:true};
  }
  await fetch(url, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(body)});
  toast('Gravado na Sheet.');
  return {posted:true};
}

function renderStatus(){
  const q = DATA.current_question || {};
  const e = DATA.current_exam || {};
  const examState = getExamState();
  $('#statusChips').innerHTML = [
    `Pergunta: ${esc(q.status || 'ativa')}`,
    `Simulado: ${esc(examState.status || e.status || 'novo')}`,
    `Banco: ${esc(DATA.question_bank_summary?.total_saved ?? 0)}`,
    `Por gravar: ${pendingActionCount()}`
  ].map(x => `<span class="chip">${x}</span>`).join('');
}

function pendingActionCount(){
  try {
    return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]').length;
  } catch {
    return 0;
  }
}

function renderQuestion(){
  const q = DATA.current_question;
  if (!q) {
    $('#questoes').innerHTML = '<div class="panel"><p class="empty">Ainda nao ha pergunta ativa.</p></div>';
    return;
  }
  resetQuestionLocalStateIfNeeded();
  const qState = localState.currentQuestion || {};
  const isSaved = !!qState.saved;
  const isSeen = !!qState.seen;
  const wantsNext = !!qState.wants_next;
  const selected = qState.selected_option || '';
  const options = (q.options || []).map(opt => `
    <label class="option ${selected === opt.label ? 'selected' : ''}">
      <input type="radio" name="current_question_answer" value="${esc(opt.label)}" ${selected === opt.label ? 'checked' : ''} onchange="selectCurrentAnswer('${esc(opt.label)}')">
      <span><b>${esc(opt.label)}.</b> ${esc(opt.text)}</span>
    </label>`).join('');
  $('#questoes').innerHTML = `
    <div class="panel">
      ${DATA.config?.apps_script_url ? '' : '<div class="notice">Acoes ficam guardadas neste browser ate o Apps Script estar ligado. Ainda nao gravam na Sheet.</div>'}
      <div class="row">
        <span class="chip">${esc(q.topic)}</span>
        <span class="chip">${q.format === 'mcq' ? 'Escolha multipla' : 'Discursiva'}</span>
        <button class="btn icon" onclick="speak(DATA.current_question.stem)">Ouvir pergunta</button>
      </div>
      <p class="stem">${esc(q.stem)}</p>
      ${q.format === 'mcq' ? `<div class="options">${options}</div>` : `<textarea id="currentDiscursiveAnswer" placeholder="Resposta livre" oninput="selectCurrentAnswer(this.value)">${esc(qState.response_text || '')}</textarea>`}
      <details>
        <summary>Resposta e justificacao</summary>
        <div class="body">
          <div class="row"><button class="btn icon" onclick="speak(DATA.current_question.explanation)">Ouvir resposta</button></div>
          <p><b>Resposta:</b> ${esc(q.correct_answer)}</p>
          <p>${esc(q.explanation)}</p>
        </div>
      </details>
      <div class="actions">
        <button class="btn" aria-pressed="${isSeen}" onclick="markCurrentSeen()">${isSeen ? 'Vista marcada' : 'Vista'}</button>
        <button class="btn green" aria-pressed="${isSaved}" onclick="toggleCurrentSave()">${isSaved ? 'Salva - clicar para retirar' : 'Salvar'}</button>
        <button class="btn amber" aria-pressed="${wantsNext}" onclick="requestNextQuestion()">${wantsNext ? 'Proxima pedida' : 'Pedir proxima pergunta'}</button>
      </div>
      <p class="meta">A proxima pergunta aparece depois de correr <b>Atualizar TestMe</b>.</p>
    </div>`;
}

function resetQuestionLocalStateIfNeeded(){
  const qid = DATA.current_question?.question_id;
  if (localState.currentQuestion?.question_id !== qid){
    localState.currentQuestion = {question_id: qid};
    saveLocalState();
  }
}

function selectCurrentAnswer(value){
  resetQuestionLocalStateIfNeeded();
  const q = DATA.current_question || {};
  if (q.format === 'mcq') localState.currentQuestion.selected_option = value;
  else localState.currentQuestion.response_text = value;
  saveLocalState();
  if (q.format === 'mcq') renderQuestion();
}

function markCurrentSeen(){
  resetQuestionLocalStateIfNeeded();
  localState.currentQuestion.seen = true;
  saveLocalState();
  postAction('question_seen', {
    question_id: DATA.current_question.question_id,
    selected_option: localState.currentQuestion.selected_option || '',
    response_text: localState.currentQuestion.response_text || ''
  });
  renderQuestion();
}

function toggleCurrentSave(){
  resetQuestionLocalStateIfNeeded();
  localState.currentQuestion.saved = !localState.currentQuestion.saved;
  saveLocalState();
  postAction('question_save_toggle', {
    question_id: DATA.current_question.question_id,
    saved: localState.currentQuestion.saved,
    selected_option: localState.currentQuestion.selected_option || '',
    response_text: localState.currentQuestion.response_text || ''
  });
  renderQuestion();
}

function requestNextQuestion(){
  resetQuestionLocalStateIfNeeded();
  localState.currentQuestion.wants_next = true;
  saveLocalState();
  postAction('question_next_requested', {
    question_id: DATA.current_question.question_id,
    selected_option: localState.currentQuestion.selected_option || '',
    response_text: localState.currentQuestion.response_text || ''
  });
  renderQuestion();
}

function renderExam(){
  const e = DATA.current_exam || {};
  const questions = e.questions || [];
  resetExamLocalStateIfNeeded();
  const examState = getExamState();
  const isFinished = examState.status === 'terminado' || e.status === 'terminado' || e.status === 'corrigido';
  const answered = questions.filter(q => hasExamAnswer(q.question_id)).length;
  const cards = questions.map((q, idx) => `
    <div class="question-card">
      <div class="row"><span class="chip">${idx+1}</span><span class="chip">${esc(q.topic)}</span><span class="chip">${esc(q.format)}</span></div>
      <p>${esc(q.stem)}</p>
      ${q.format === 'mcq'
        ? `<select data-q="${esc(q.question_id)}" data-topic="${esc(q.topic)}" data-format="${esc(q.format)}" onchange="setExamAnswer('${esc(q.question_id)}', this.value)" ${isFinished ? 'disabled' : ''}><option value="">Resposta...</option>${(q.options||[]).map(o => `<option value="${esc(o.label)}" ${getExamAnswer(q.question_id) === o.label ? 'selected' : ''}>${esc(o.label)}. ${esc(o.text)}</option>`).join('')}</select>`
        : `<textarea data-q="${esc(q.question_id)}" data-topic="${esc(q.topic)}" data-format="${esc(q.format)}" placeholder="Resposta discursiva" oninput="setExamAnswer('${esc(q.question_id)}', this.value)" ${isFinished ? 'disabled' : ''}>${esc(getExamAnswer(q.question_id))}</textarea>`}
    </div>`).join('');
  $('#simulado').innerHTML = `
    <div class="split">
      <div class="panel">
        <h2>Simulado atual</h2>
        ${DATA.config?.apps_script_url ? '' : '<div class="notice">Salvar/Terminado ficam guardados neste browser ate o Apps Script estar ligado. Ainda nao gravam na Sheet.</div>'}
        <p class="meta">Estado: ${esc(examState.status || e.status || 'novo')} · ${questions.length} perguntas</p>
        <div class="progress"><span class="chip" id="examAnsweredChip">${answered}/${questions.length} respondidas</span><span class="chip" id="examSavedChip">${examState.saved_at ? 'Salvo: ' + esc(examState.saved_at) : 'Ainda nao salvo'}</span></div>
        ${cards || '<p class="empty">Ainda nao ha simulado gerado.</p>'}
        <div class="actions">
          <button class="btn green" onclick="saveExam()" ${isFinished ? 'disabled' : ''}>Salvar</button>
          <button class="btn red" onclick="finishExam()" ${isFinished ? 'disabled' : ''}>Terminado</button>
          <button class="btn" onclick="exportExam()">Exportar</button>
        </div>
      </div>
      <aside class="panel">
        <h3>Proximo simulado</h3>
        <p class="meta">A escolha aplica na proxima geracao.</p>
        <label>Tamanho<br><select id="nextSize">${[5,10,15,25,30].map(n => `<option ${n===(DATA.config?.next_simulado_size||5)?'selected':''}>${n}</option>`).join('')}</select></label>
        <div class="actions"><button class="btn" onclick="postAction('exam_preferences',{size:Number($('#nextSize').value)})">Guardar pedido</button></div>
      </aside>
    </div>`;
}

function resetExamLocalStateIfNeeded(){
  const simuladoId = DATA.current_exam?.simulado_id;
  if (localState.currentExam?.simulado_id !== simuladoId){
    localState.currentExam = {simulado_id: simuladoId, status: DATA.current_exam?.status || 'em_andamento', answers:{}};
    saveLocalState();
  }
  localState.currentExam.answers ||= {};
}

function getExamState(){
  resetExamLocalStateIfNeeded();
  return localState.currentExam;
}

function getExamAnswer(questionId){
  return getExamState().answers?.[questionId] || '';
}

function hasExamAnswer(questionId){
  return String(getExamAnswer(questionId)).trim().length > 0;
}

function setExamAnswer(questionId, value){
  const examState = getExamState();
  if (examState.status === 'terminado') return;
  examState.answers[questionId] = value;
  saveLocalState();
  renderStatus();
  updateExamProgressUI();
}

function updateExamProgressUI(){
  const questions = DATA.current_exam?.questions || [];
  const answered = questions.filter(q => hasExamAnswer(q.question_id)).length;
  const answeredChip = $('#examAnsweredChip');
  const savedChip = $('#examSavedChip');
  if (answeredChip) answeredChip.textContent = `${answered}/${questions.length} respondidas`;
  if (savedChip) savedChip.textContent = getExamState().saved_at ? `Salvo: ${getExamState().saved_at}` : 'Ainda nao salvo';
}

function collectExamAnswers(){
  return Array.from(document.querySelectorAll('#simulado [data-q]')).map(el => ({
    question_id: el.dataset.q,
    topic: el.dataset.topic || '',
    format: el.dataset.format || '',
    answer: getExamAnswer(el.dataset.q),
    selected_option: el.tagName === 'SELECT' ? getExamAnswer(el.dataset.q) : '',
    response_text: el.tagName === 'TEXTAREA' ? getExamAnswer(el.dataset.q) : '',
    answered_at: getExamAnswer(el.dataset.q) ? new Date().toISOString() : ''
  }));
}

function saveExam(){
  const examState = getExamState();
  examState.saved_at = new Date().toLocaleString('pt-PT');
  saveLocalState();
  postAction('exam_save',{simulado_id:DATA.current_exam?.simulado_id, answers:collectExamAnswers()});
  renderStatus();
  renderExam();
}

function finishExam(){
  const examState = getExamState();
  examState.status = 'terminado';
  examState.saved_at = new Date().toLocaleString('pt-PT');
  saveLocalState();
  postAction('exam_finish',{simulado_id:DATA.current_exam?.simulado_id, answers:collectExamAnswers()});
  renderStatus();
  renderExam();
}

async function exportExam(){
  const answers = collectExamAnswers();
  const text = [
    `Estas sao as minhas respostas do simulado TestMe de ${DATA.current_exam?.generated_at || DATA.meta?.date}.`,
    'Corrige-as, atribui nota geral e por topico/formato, comenta respostas discursivas, e prepara a atualizacao do historico de evolucao.',
    '',
    JSON.stringify({simulado:DATA.current_exam, respostas:answers}, null, 2)
  ].join('\\n');
  await navigator.clipboard.writeText(text);
  toast('Texto de exportacao copiado.');
}

function renderCorrection(){
  const c = DATA.recent_correction || {};
  const items = c.items || [];
  $('#correcao').innerHTML = `
    <div class="panel">
      <h2>Correcao recente</h2>
      <p class="meta">Nota: ${esc(c.total_score ?? '-')} / ${esc(c.max_score ?? '-')} · ${esc(c.corrected_at || '')}</p>
      ${items.map((it, idx) => `
        <div class="question-card">
          <div class="row"><span class="chip">${idx+1}</span><span class="chip">${esc(it.topic)}</span><span class="chip">${esc(it.score)}/${esc(it.max_points)}</span></div>
          <p><b>Resposta do Rafael:</b> ${esc(it.rafael_answer)}</p>
          <p><b>Resposta correta:</b> ${esc(it.correct_answer)}</p>
          <p>${esc(it.llm_comment)}</p>
        </div>`).join('') || '<p class="empty">Ainda nao ha correcao processada.</p>'}
    </div>`;
}

function statBlock(label, percent){
  const width = Math.max(0, Math.min(100, Number(percent || 0)));
  return `<div class="stat"><b>${esc(label)}</b><div class="meta">${width}%</div><div class="bar"><span style="width:${width}%"></span></div></div>`;
}

function renderEvolution(){
  const ev = DATA.evolution || {};
  const topicStats = ev.by_topic || {};
  const formatStats = ev.by_format || {};
  $('#evolucao').innerHTML = `
    <div class="panel">
      <h2>Evolucao</h2>
      <h3>Por topico</h3>
      <div class="stat-grid">${Object.entries(topicStats).map(([k,v]) => statBlock(k, v.percent)).join('') || '<p class="empty">Sem dados.</p>'}</div>
      <h3 style="margin-top:18px">Por formato</h3>
      <div class="stat-grid">${Object.entries(formatStats).map(([k,v]) => statBlock(k, v.percent)).join('') || '<p class="empty">Sem dados.</p>'}</div>
    </div>`;
}

document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === btn.dataset.tab));
}));

renderStatus();
renderQuestion();
renderExam();
renderCorrection();
renderEvolution();
</script>
</body>
</html>
