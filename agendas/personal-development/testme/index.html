  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}

  .tabs{display:flex;gap:6px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:16px}
  .tab-btn{border:0;background:transparent;padding:11px 10px;border-bottom:3px solid transparent;color:var(--muted);font-weight:800;white-space:nowrap;cursor:pointer}
  .tab-btn.active{color:var(--blue);border-color:var(--blue)}
  .tab{display:none}
  .tab.active{display:block}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .split{display:grid;grid-template-columns:1fr 300px;gap:14px}
  h2{font-size:20px;margin:0 0 10px}
  h3{font-size:16px;margin:0 0 8px}

  .stem{font-size:18px;line-height:1.55;margin:12px 0}
  .meta{color:var(--muted);font-size:13px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer}
  .btn[aria-pressed="true"]{box-shadow:0 0 0 3px rgba(47,111,159,.18)}
  .btn.green[aria-pressed="true"], .btn.red[aria-pressed="true"]{color:#c4ccd1}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:white}
  .btn.green{background:var(--green);border-color:var(--green);color:white}
  .btn.amber{background:var(--amber);border-color:var(--amber);color:white}
  .btn.red{background:var(--red);border-color:var(--red);color:white}
  .btn.ghost{background:#fbfcfc;color:var(--muted)}
  .btn.icon{padding:7px 10px}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  details{border:1px solid var(--line);border-radius:8px;background:#fbfcfc;margin-top:12px}
  summary{cursor:pointer;padding:12px 13px;font-weight:900}
  details .body{padding:0 13px 13px}
  .options{display:grid;gap:8px;margin:10px 0}
  .option{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fbfcfc;display:flex;gap:9px;align-items:flex-start;cursor:pointer}
  .option input{margin-top:3px}
  .option.selected{border-color:var(--blue);background:#eef6fb}
  .progress{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
  .question-card{border-top:1px solid var(--line);padding:14px 0}
  .question-card:first-child{border-top:0;padding-top:0}
  textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;background:white}
  select,input[type="number"]{border:1px solid var(--line);border-radius:8px;padding:8px;background:white}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .stat{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fbfcfc}
  .bar{height:8px;background:#e7eaeb;border-radius:99px;overflow:hidden;margin-top:8px}
  .bar span{display:block;height:100%;background:var(--blue);width:0}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1e2428;color:white;padding:10px 13px;border-radius:8px;font-size:13px;display:none}
  .empty{color:var(--muted);font-style:italic}
  .notice{border:1px solid #ead39c;background:#fff8e8;color:#6f4b0c;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45;margin-bottom:12px}
  @media (max-width:760px){
    header{display:block}
    .status{justify-content:flex-start;margin-top:10px}
    .split{grid-template-columns:1fr}
  }

<script id="testme-data" type="application/json">{"meta":{"module":"testme","date":"2026-09-21","generated_at":"2026-09-21T23:16:51+01:00","mode":"atualizar_testme","sheet_id":"1umzy0T45iQlN2Fv52OV73PzRpWmgF5GWHUUMBO0Y7wo","sheet_url":"https://docs.google.com/spreadsheets/d/1umzy0T45iQlN2Fv52OV73PzRpWmgF5GWHUUMBO0Y7wo"},"config":{"apps_script_url":"https://script.google.com/macros/s/AKfycbxVh9Ar5JKzm58MX10LXS2FOvmiWwyzSgoWXupgdh__0j0ymGBX7QT8QxufMUxVdSAJ3A/exec","default_simulado_size":5,"next_simulado_size":5,"next_simulado_topics":[]},"current_question":{"question_id":"q_20260921_001","status":"ativa","generated_at":"2026-09-21T23:16:51+01:00","topic":"Torax","format":"mcq","difficulty":"assistente_graduado","stem":"Lactente assintomatico de 8 meses com malformacao congenita das vias aereas pulmonares (CPAM) identificada no pre-natal, confirmada por TC toracica pos-natal, tipo macrocistico unilateral sem sinais de infecao ou compressao mediastinica. Os pais perguntam se podem esperar ate aos 5 anos para operar, ja que a crianca esta bem agora. Qual resposta e mais defensavel?","options":[{"label":"A","text":"Concordar em esperar ate aos 5 anos sem reavaliacao, porque lesoes assintomaticas nunca justificam cirurgia eletiva precoce."},{"label":"B","text":"Recomendar resseccao eletiva nos primeiros 1-2 anos de vida mesmo assintomatica, pelo risco de infecoes recorrentes e a associacao descrita com malignidade a longo prazo, equilibrando com o risco anestesico/cirurgico da idade."},{"label":"C","text":"Operar imediatamente em regime de urgencia, porque toda CPAM macrocistica tem risco iminente de pneumotorax hipertensivo."},{"label":"D","text":"Nunca operar lesoes assintomaticas, reservando cirurgia apenas para infecao estabelecida ou insuficiencia respiratoria."}],"correct_answer":"B","explanation":"A pratica corrente favorece resseccao eletiva nos primeiros 1-2 anos de vida em CPAM assintomatica, pelo risco cumulativo de infecao e pela associacao descrita com pleuropulmonary blastoma/malignidade, equilibrando com o menor risco anestesico numa crianca maior. Esperar indefinidamente aumenta o risco infeccioso/oncologico teorico; cirurgia de urgencia nao se justifica sem sinais agudos; nunca operar contraria a evidencia disponivel.","source_type":"generated_practice","source_ref":"atualizar_testme_20260921_run1"},"question_bank_summary":{"total_saved":3,"by_topic":{"Upper GI":1,"Trauma":1,"Neonatologia":1},"by_format":{"mcq":2,"discursiva":1}},"current_exam":{"simulado_id":"sim_20260921_001","status":"em_andamento","generated_at":"2026-09-21T23:16:51+01:00","size":5,"requested_topics":[],"format_mix":{"mcq":3,"discursiva":2},"questions":[{"question_id":"sim_20260921_q001","topic":"Oncologia","format":"mcq","difficulty":"assistente_graduado","stem":"Crianca de 3 anos com massa renal unilateral de 9 cm, sem trombo na veia cava, sem metastases identificadas em TC toracica/abdominal, avaliada num centro que segue protocolo tipo COG (America do Norte). A familia pergunta se deve fazer quimioterapia antes da cirurgia, como ouviu de um amigo noutro pais. Qual conduta e mais defensavel?","options":[{"label":"A","text":"Fazer sempre quimioterapia neoadjuvante antes de qualquer nefrectomia, independentemente do protocolo seguido, porque reduz sempre o risco cirurgico."},{"label":"B","text":"Seguir o protocolo do centro (upfront nefrectomia radical em tumor unilateral ressecavel sem contraindicacoes, com biopsia reservada a casos seletos), explicando que SIOP e COG divergem racionalmente na sequencia terapeutica sem que um esteja errado."},{"label":"C","text":"Fazer biopsia percutanea sistematica antes de decidir, porque sem biopsia nao e possivel operar um tumor de Wilms."},{"label":"D","text":"Recusar cirurgia e referenciar para quimioterapia isolada, pois massas renais pediatricas de grande dimensao sao sempre irressecaveis primariamente."}],"correct_answer":"B","explanation":"COG geralmente opera primeiro tumores unilaterais ressecaveis sem contraindicacoes (trombo cavo extenso, ruptura, envolvimento de estruturas vitais, doenca bilateral), reservando biopsia a casos duvidosos; SIOP prefere quimioterapia neoadjuvante sistematica. Nenhuma sequencia e universalmente correta - a decisao depende do protocolo do centro e das caracteristicas do tumor, nao da preferencia da familia isolada."},{"question_id":"sim_20260921_q002","topic":"Upper GI","format":"mcq","difficulty":"assistente_graduado","stem":"Lactente de 5 semanas, submetido a piloromiotomia laparoscopica ha 48 horas por estenose hipertrofica do piloro, mantem vomitos nao biliosos persistentes, tolera mal a progressao alimentar e o abdome permanece pouco distendido, sem sinais de peritonite. Qual e a conduta mais defensavel neste momento?","options":[{"label":"A","text":"Reoperar de imediato assumindo miotomia incompleta, sem mais avaliacao, porque vomitos persistentes as 48 horas confirmam sempre falha cirurgica."},{"label":"B","text":"Manter expectativa, com pausa alimentar breve, progressao lenta do volume e reavaliacao clinica seriada, reservando ecografia/estudo contrastado e eventual reexploracao para persistencia alem do esperado ou sinais de alarme."},{"label":"C","text":"Assumir refluxo gastroesofagico isolado e iniciar inibidor da bomba de protoes sem reavaliar a piloromiotomia."},{"label":"D","text":"Dar alta imediata com reforco de que vomitos sao normais nas primeiras semanas apos qualquer cirurgia abdominal."}],"correct_answer":"B","explanation":"Vomitos nao biliosos nos primeiros dias apos piloromiotomia sao frequentes e geralmente resolvem com progressao alimentar lenta; miotomia incompleta ou perfuracao mucosa nao reconhecida sao possiveis mas nao devem ser assumidas sem reavaliacao. Reoperacao imediata sem dados adicionais e prematura; ignorar o quadro como refluxo isolado ou dar alta sem seguimento tambem nao e defensavel."},{"question_id":"sim_20260921_q003","topic":"Urologia","format":"mcq","difficulty":"assistente_graduado","stem":"Lactente de 8 meses com criptorquidia bilateral nao palpavel, sem outras alteracoes genitais aparentes, referenciado para decisao cirurgica. Qual e a conduta inicial mais defensavel?","options":[{"label":"A","text":"Pedir ecografia abdominopelvica como exame definitivo para localizar os testiculos antes de qualquer decisao cirurgica."},{"label":"B","text":"Programar laparoscopia diagnostica como proximo passo, reservando avaliacao endocrina/genetica adicional se houver outras caracteristicas sugestivas de diferenciacao sexual atipica."},{"label":"C","text":"Assumir anorquia bilateral e nao investigar mais, porque testiculos nao palpaveis bilateralmente sao sempre ausentes."},{"label":"D","text":"Aguardar ate aos 3 anos de idade antes de qualquer investigacao ou cirurgia, porque descida espontanea tardia ainda e frequente nessa faixa etaria."}],"correct_answer":"B","explanation":"Em criptorquidia nao palpavel, a imagem (ecografia/RM) tem sensibilidade limitada e nao substitui a laparoscopia, que e diagnostica e terapeutica (permite orquidopexia em 1 ou 2 tempos, ou confirmar vasos/deferentes em fundo cego). Criptorquidia bilateral nao palpavel tambem deve levantar suspeita de diferenciacao sexual atipica se houver outros achados, justificando avaliacao adicional. Aguardar alem da idade recomendada atrasa o tratamento; imagem isolada nao e suficiente."},{"question_id":"sim_20260921_q004","topic":"Outros","format":"discursiva","difficulty":"assistente_graduado","stem":"Crianca de 6 anos, testemunha de Jeova, necessita de laparotomia urgente por hemorragia intra-abdominal apos trauma, com instabilidade hemodinamica progressiva. Os pais recusam transfusao de sangue por motivos religiosos. Descreve como estruturarias a decisao clinica, etica e legal neste cenario.","options":[],"correct_answer":"Resposta esperada: tratar como emergencia com risco de vida, priorizando estabilizacao (reanimacao com cristaloides, controlo cirurgico da hemorragia, tecnicas de poupanca de sangue quando possivel); reconhecer que a recusa parental de transfusao que coloque a crianca em risco de vida iminente nao e geralmente vinculativa em pediatria, sendo a transfusao administrada se necessaria para salvar a vida, com envolvimento precoce da equipa juridica/etica hospitalar e, se o tempo permitir, autorizacao judicial ou parecer institucional urgente; documentar cuidadosamente a discussao, comunicar com a familia de forma respeitosa e continuada, e nao atrasar tratamento salva-vidas por burocracia quando a situacao e emergente; envolver anestesia e hemoterapia na decisao sobre alternativas (eritropoietina, ferro, tecnicas de recuperacao de sangue) quando aplicavel.","explanation":"A resposta deve equilibrar urgencia clinica, direito da crianca a tratamento que preserva a vida e procedimento etico/legal adequado, sem atrasar intervencao emergente por burocracia excessiva nem ignorar completamente o dialogo com a familia."},{"question_id":"sim_20260921_q005","topic":"Hepatobiliar/Pancreatico","format":"discursiva","difficulty":"assistente_graduado","stem":"Crianca de 4 anos com quisto do coledoco tipo I confirmado por colangioressonancia, assintomatica no momento do diagnostico, sem sinais de colangite ou pancreatite. Discute como planearias o timing e a estrategia cirurgica, incluindo os principais riscos a evitar.","options":[],"correct_answer":"Resposta esperada: recomendar excisao completa do quisto com hepaticojejunostomia em Y de Roux (nao apenas drenagem interna), mesmo em doente assintomatico, pelo risco de colangite recorrente, pancreatite e malignizacao a longo prazo; nao adiar indefinidamente apenas por ausencia de sintomas, mas planear cirurgia eletiva apos avaliacao completa (anatomia biliar/pancreatica, uniao pancreatico-biliar anomala, funcao hepatica); discutir abordagem aberta vs laparoscopica/robotica conforme experiencia do centro; evitar deixar remanescente do quisto distal (risco de pancreatite/malignizacao) e assegurar anastomose alta o suficiente para remover toda a mucosa quistica; seguimento a longo prazo pelo risco residual de colangite e malignizacao mesmo apos excisao completa.","explanation":"A resposta deve reconhecer que a excisao completa (nao apenas drenagem) e o tratamento definitivo, independentemente de sintomas, pelo risco oncologico e infeccioso a longo prazo, e identificar os principais erros tecnicos a evitar."}]},"recent_correction":{"simulado_id":"sim_20260914_001","corrected_at":"2026-09-21T23:16:51+01:00","total_score":5.5,"max_score":7,"items":[{"question_id":"sim_20260914_q001","topic":"Neonatologia","format":"mcq","stem":"RN de termo com obstrucao intestinal baixa, microcolon no enema contrastado e calcificacoes peritoneais subtis na radiografia. Ao nascer teve distensao progressiva, mas esta hemodinamicamente estavel. Qual interpretacao/conduta inicial e mais defensavel?","options":[{"label":"A","text":"Assumir ileo meconial simples e tratar apenas com enemas hiperosmolares repetidos, independentemente das calcificacoes."},{"label":"B","text":"Integrar a possibilidade de perfuracao antenatal/meconio peritonite e ileo meconial complicado; estabilizar, avaliar fibrose quistica e decidir entre contraste terapeutico cauteloso e exploracao conforme sinais de complicacao."},{"label":"C","text":"Fazer colostomia esquerda como tratamento padrao, porque microcolon exclui patologia ileal."},{"label":"D","text":"Aguardar eliminacao espontanea de meconio por 72 horas se nao houver pneumoperitoneu."}],"rafael_answer":"B","correct_answer":"B","score":1,"max_points":1,"llm_comment":"Correta. Reconhece a associacao entre microcolon e calcificacoes peritoneais como sinal de perfuracao antenatal/meconio peritonite, priorizando estabilizacao e avaliacao de fibrose quistica antes de decidir entre contraste terapeutico e exploracao."},{"question_id":"sim_20260914_q002","topic":"Urologia","format":"mcq","stem":"Menina de 7 anos com duplicidade pieloureteral, ureterocelo ectopico previamente incisado no periodo neonatal, infeccoes febris recorrentes e funcao diferencial reduzida do polo superior. Ha refluxo para o polo inferior ipsilateral. Qual estrategia e mais apropriada para planear cirurgia definitiva?","options":[{"label":"A","text":"Reimplante ureteral simples do ureter do polo inferior, ignorando o remanescente do ureterocelo se a drenagem inicial foi feita."},{"label":"B","text":"Decidir com base em funcao segmentar, refluxo, anatomia vesical/colo e infeccoes; opcoes incluem heminefrectomia/polo superior, reconstrucao baixa ou combinada conforme anatomia e funcao."},{"label":"C","text":"Nefrectomia total ipsilateral obrigatoria, porque ureterocelo ectopico inviabiliza sempre o rim duplicado."},{"label":"D","text":"Profilaxia antibiotica vitalicia como tratamento definitivo se a creatinina global for normal."}],"rafael_answer":"B","correct_answer":"B","score":1,"max_points":1,"llm_comment":"Correta. A decisao sobre ureterocelo ectopico pos-incisao integra funcao segmentar, refluxo e anatomia vesical, sem impor uma unica solucao cirurgica."},{"question_id":"sim_20260914_q003","topic":"Trauma","format":"mcq","stem":"Adolescente apos traumatismo abdominal fechado tem dor epigastrica persistente, amilase/lipase moderadamente elevadas e TC inicial sem transeccao pancreatica clara. A dor piora e surge colecao crescente junto ao corpo pancreatico 48 horas depois. Qual proximo passo e mais defensavel?","options":[{"label":"A","text":"Alta se estiver hemodinamicamente estavel, porque a TC inicial excluiu lesao ductal."},{"label":"B","text":"Repetir avaliacao dirigida ao ducto pancreatico com MRCP/ERCP conforme recursos e discutir abordagem conservadora, endoscopica ou cirurgica em centro experiente."},{"label":"C","text":"Duodenopancreatectomia precoce para evitar pseudocisto em qualquer lesao do corpo pancreatico."},{"label":"D","text":"Drenar percutaneamente toda colecao antes de esclarecer se ha lesao ductal principal."}],"rafael_answer":"B","correct_answer":"B","score":1,"max_points":1,"llm_comment":"Correta. Reconhece que a TC inicial pode subestimar lesao ductal pancreatica e que a piora clinica com colecao crescente justifica reavaliacao dirigida ao ducto antes de decidir conduta."},{"question_id":"sim_20260914_q004","topic":"Torax","format":"discursiva","stem":"RN com hernia diafragmatica congenita esquerda, hipertensao pulmonar grave em estabilizacao lenta e necessidade de vasodilatador pulmonar. Discute criterios praticos para decidir timing de reparacao e como prepararias a cirurgia/anestesia.","options":[],"rafael_answer":"Em primeiro lugar esclarecer que a cirurgia não é urgência e que o time cirúrgico ocorre após a estabilização do bebê.  A fase inicial é de medidas puramente clínicas para controle da hipertensão pulmonar grave e estabilização dos outros parâmetros clínicos do bebê, quando ele estiver em condições clínicas satisfatórias e a hipertensão pulmonar estiver controlada. Pode-se então programar a cirurgia.  Tem que: - fazer avaliação cardíaca - avaliar se há outras malformações associadas - conversar com o time da anestesia para avaliar e preparar este doente adequadamente - programar o time do intensivo para o segmento de bebê no pós-operatório","correct_answer":"Resposta esperada: nao operar por urgencia anatomica isolada; aguardar estabilizacao fisiologica com queda de lactato, menor suporte vasoativo/ventilatorio, oxigenacao aceitavel e hipertensao pulmonar controlada; discutir ecocardiografia seriada, estrategia ventilatoria protetora, disponibilidade de UCI neonatal, sangue, anestesia experiente e eventual ECMO/centro de referencia conforme gravidade; planear acesso e tipo de reparo conforme defeito, evitando descompensacao hemodinamica intraoperatoria.","score":1.5,"max_points":2,"llm_comment":"Resposta parcialmente correta. Valorizaste bem que a cirurgia nao e urgente e que depende de estabilizacao fisiologica, alem de referires avaliacao cardiaca, rastreio de malformacoes associadas, articulacao com a anestesia e planeamento do pos-operatorio em UCI. Faltou nomear os criterios praticos concretos pedidos - queda de lactato, reducao do suporte vasoativo/ventilatorio, oxigenacao aceitavel, ecocardiografia seriada, estrategia ventilatoria protetora - e a consideracao de ECMO/centro de referencia conforme gravidade."},{"question_id":"sim_20260914_q005","topic":"Lower GI","format":"discursiva","stem":"Crianca com malformacao anorectal alta, colostomia neonatal e suspeita de fistula retouretral. Descreve a avaliacao pre-PSARP e os pontos que mudam a estrategia cirurgica.","options":[],"rafael_answer":"Primeiramente avaliar o estado geral da criança e fazer análises para verificar a parte do modelo hemocoagulação e a análise bioquímica. Como o bebê já tem uma colostomia não é necessário nenhum preparo intestinal prévio. Entretanto é importante fazer o exame contrastado fistal, que é o colostograma, para descrever a correta anatomia da fistula.  A depender da distância da fistula ao perineu, pode-se optar por uma cirurgia perineal ou por uma abordagem abdomino-perineal. Por exemplo se estiver diante de uma fistula uretroprostática, então a abordagem mista abdomino-perineal certamente será necessária. A parte abdominal pode ser feita por laparoscopia ou de forma aberta.","correct_answer":"Resposta esperada: confirmar anatomia distal com colostograma distal pressurizado de qualidade, avaliar trato urinario por ecografia/cistografia conforme contexto, pesquisar anomalias sacras/vertebrais/medulares e cardiacas, rever tipo/local da colostomia e estado nutricional; definir nivel da fistula, comprimento do pouch, qualidade sacral e continencia potencial; planear PSARP isolado ou abordagem combinada laparoscopica/abdominal conforme fistula alta/prostatica/colo vesical, evitando exploracao sem mapa anatomico adequado.","score":1,"max_points":2,"llm_comment":"Resposta parcialmente correta. O colostograma distal e a distincao perineal vs abdomino-perineal conforme o nivel da fistula estao bem identificados, incluindo a opcao laparoscopica. Faltou avaliar o trato urinario (ecografia/cistografia), rastrear anomalias sacras/vertebrais/medulares e cardiacas (achados tipicamente associados a malformacao anorectal) e considerar a qualidade sacral/potencial de continencia - pontos que tambem mudam a estrategia e o aconselhamento a familia."}]},"evolution":{"by_topic":{"Neonatologia":{"percent":100,"answered":2},"Hepatobiliar/Pancreatico":{"percent":100,"answered":2},"Urologia":{"percent":75,"answered":4},"Oncologia":{"percent":31,"answered":2},"Lower GI":{"percent":75,"answered":3},"Upper GI":{"percent":75,"answered":2},"Torax":{"percent":88,"answered":2},"Outros":{"percent":63,"answered":1},"Trauma":{"percent":100,"answered":2}},"by_format":{"mcq":{"percent":100,"answered":12},"discursiva":{"percent":47,"answered":8}},"history":[{"simulado_id":"sim_20260905_001","corrected_at":"2026-09-05T19:12:40+01:00","total_score":5,"max_score":7,"percent":71,"score_by_topic":{"Neonatologia":100,"Hepatobiliar/Pancreatico":100,"Urologia":100,"Oncologia":25,"Lower GI":75},"score_by_format":{"mcq":100,"discursiva":50},"question_count":5,"mcq_count":3,"discursiva_count":2},{"simulado_id":"sim_20260905_002","corrected_at":"2026-09-05T20:45:43+01:00","total_score":5,"max_score":7,"percent":71,"score_by_topic":{"Upper GI":100,"Torax":100,"Urologia":100,"Oncologia":37.5,"Outros":62.5},"score_by_format":{"mcq":100,"discursiva":50},"question_count":5,"mcq_count":3,"discursiva_count":2},{"simulado_id":"sim_20260905_003","corrected_at":"2026-09-14T16:42:13+01:00","total_score":4,"max_score":7,"percent":57,"score_by_topic":{"Lower GI":100.0,"Trauma":100.0,"Hepatobiliar/Pancreatico":100.0,"Upper GI":50.0,"Urologia":0.0},"score_by_format":{"mcq":100.0,"discursiva":25.0},"question_count":5,"mcq_count":3,"discursiva_count":2},{"simulado_id":"sim_20260914_001","corrected_at":"2026-09-21T23:16:51+01:00","total_score":5.5,"max_score":7,"percent":79,"score_by_topic":{"Neonatologia":100,"Urologia":100,"Trauma":100,"Torax":75,"Lower GI":50},"score_by_format":{"mcq":100,"discursiva":62.5},"question_count":5,"mcq_count":3,"discursiva_count":2}]}}</script>
<script>
const DATA = JSON.parse(document.getElementById('testme-data').textContent);
const $ = (sel, root=document) => root.querySelector(sel);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORE_KEY = 'testme:state:v1';
const QUEUE_KEY = 'testme:pendingActions:v1';
const localState = loadLocalState();

function loadLocalState(){
  try {
    return JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
  } catch {
    return {};
  }
}

function saveLocalState(){
  localStorage.setItem(STORE_KEY, JSON.stringify(localState));
}

function queueLocalAction(body){
  let queue = [];
  try {
    queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
  } catch {
    queue = [];
  }
  queue.push(body);
  localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
}

function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2600);
}

function speak(text){
  if (!('speechSynthesis' in window)) return toast('Audio indisponivel neste browser.');
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'pt-PT';
  window.speechSynthesis.speak(utterance);
}

async function postAction(type, payload){
  const url = DATA.config?.apps_script_url;
  const body = {type, created_at:new Date().toISOString(), payload};
  if (!url){
    queueLocalAction(body);
    renderStatus();
    toast('Guardado neste browser. Falta ligar o Apps Script para gravar na Sheet.');
    return {queued:true};
  }
  await fetch(url, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(body)});
  toast('Gravado na Sheet.');
  return {posted:true};
}

function renderStatus(){
  const q = DATA.current_question || {};
  const e = DATA.current_exam || {};
  const examState = getExamState();
  $('#statusChips').innerHTML = [
    `Pergunta: ${esc(q.status || 'ativa')}`,
    `Simulado: ${esc(examState.status || e.status || 'novo')}`,
    `Banco: ${esc(DATA.question_bank_summary?.total_saved ?? 0)}`,
    `Por gravar: ${pendingActionCount()}`
  ].map(x => `<span class="chip">${x}</span>`).join('');
}

function pendingActionCount(){
  try {
    return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]').length;
  } catch {
    return 0;
  }
}

function renderQuestion(){
  const q = DATA.current_question;
  if (!q) {
    $('#questoes').innerHTML = '<div class="panel"><p class="empty">Ainda nao ha pergunta ativa.</p></div>';
    return;
  }
  resetQuestionLocalStateIfNeeded();
  const qState = localState.currentQuestion || {};
  const isSaved = !!qState.saved;
  const isSeen = !!qState.seen;
  const wantsNext = !!qState.wants_next;
  const selected = qState.selected_option || '';
  const options = (q.options || []).map(opt => `
    <label class="option ${selected === opt.label ? 'selected' : ''}">
      <input type="radio" name="current_question_answer" value="${esc(opt.label)}" ${selected === opt.label ? 'checked' : ''} onchange="selectCurrentAnswer('${esc(opt.label)}')">
      <span><b>${esc(opt.label)}.</b> ${esc(opt.text)}</span>
    </label>`).join('');
  $('#questoes').innerHTML = `
    <div class="panel">
      ${DATA.config?.apps_script_url ? '' : '<div class="notice">Acoes ficam guardadas neste browser ate o Apps Script estar ligado. Ainda nao gravam na Sheet.</div>'}
      <div class="row">
        <span class="chip">${esc(q.topic)}</span>
        <span class="chip">${q.format === 'mcq' ? 'Escolha multipla' : 'Discursiva'}</span>
        <button class="btn icon" onclick="speak(DATA.current_question.stem)">Ouvir pergunta</button>
      </div>
      <p class="stem">${esc(q.stem)}</p>
      ${q.format === 'mcq' ? `<div class="options">${options}</div>` : `<textarea id="currentDiscursiveAnswer" placeholder="Resposta livre" oninput="selectCurrentAnswer(this.value)">${esc(qState.response_text || '')}</textarea>`}
      <details>
        <summary>Resposta e justificacao</summary>
        <div class="body">
          <div class="row"><button class="btn icon" onclick="speak(DATA.current_question.explanation)">Ouvir resposta</button></div>
          <p><b>Resposta:</b> ${esc(q.correct_answer)}</p>
          <p>${esc(q.explanation)}</p>
        </div>
      </details>
      <div class="actions">
        <button class="btn" aria-pressed="${isSeen}" onclick="markCurrentSeen()">${isSeen ? 'Vista marcada' : 'Vista'}</button>
        <button class="btn green" aria-pressed="${isSaved}" onclick="toggleCurrentSave()">${isSaved ? 'Salva - clicar para retirar' : 'Salvar'}</button>
        <button class="btn amber" aria-pressed="${wantsNext}" onclick="requestNextQuestion()">${wantsNext ? 'Proxima pedida' : 'Pedir proxima pergunta'}</button>
      </div>
      <p class="meta">A proxima pergunta aparece depois de correr <b>Atualizar TestMe</b>.</p>
    </div>`;
}

function resetQuestionLocalStateIfNeeded(){
  const qid = DATA.current_question?.question_id;
  if (localState.currentQuestion?.question_id !== qid){
    localState.currentQuestion = {question_id: qid};
    saveLocalState();
  }
}

function selectCurrentAnswer(value){
  resetQuestionLocalStateIfNeeded();
  const q = DATA.current_question || {};
  if (q.format === 'mcq') localState.currentQuestion.selected_option = value;
  else localState.currentQuestion.response_text = value;
  saveLocalState();
  if (q.format === 'mcq') renderQuestion();
}

function markCurrentSeen(){
  resetQuestionLocalStateIfNeeded();
  localState.currentQuestion.seen = true;
  saveLocalState();
  postAction('question_seen', {
    question_id: DATA.current_question.question_id,
    selected_option: localState.currentQuestion.selected_option || '',
    response_text: localState.currentQuestion.response_text || ''
  });
  renderQuestion();
}

function toggleCurrentSave(){
  resetQuestionLocalStateIfNeeded();
  localState.currentQuestion.saved = !localState.currentQuestion.saved;
  saveLocalState();
  postAction('question_save_toggle', {
    question_id: DATA.current_question.question_id,
    saved: localState.currentQuestion.saved,
    selected_option: localState.currentQuestion.selected_option || '',
    response_text: localState.currentQuestion.response_text || ''
  });
  renderQuestion();
}

function requestNextQuestion(){
  resetQuestionLocalStateIfNeeded();
  localState.currentQuestion.wants_next = true;
  saveLocalState();
  postAction('question_next_requested', {
    question_id: DATA.current_question.question_id,
    selected_option: localState.currentQuestion.selected_option || '',
    response_text: localState.currentQuestion.response_text || ''
  });
  renderQuestion();
}

function renderExam(){
  const e = DATA.current_exam || {};
  const questions = e.questions || [];
  resetExamLocalStateIfNeeded();
  const examState = getExamState();
  const isFinished = examState.status === 'terminado' || e.status === 'terminado' || e.status === 'corrigido';
  const isCorrected = e.status === 'corrigido';
  const isLocked = !!examState.saved_at && examState.status !== 'terminado';
  const answered = questions.filter(q => hasExamAnswer(q.question_id)).length;
  const cards = questions.map((q, idx) => `
    <div class="question-card">
      <div class="row"><span class="chip">${idx+1}</span><span class="chip">${esc(q.topic)}</span><span class="chip">${esc(q.format)}</span></div>
      <p>${esc(q.stem)}</p>
      ${q.format === 'mcq'
        ? `<select data-q="${esc(q.question_id)}" data-topic="${esc(q.topic)}" data-format="${esc(q.format)}" onchange="setExamAnswer('${esc(q.question_id)}', this.value)" ${isFinished ? 'disabled' : ''}><option value="">Resposta...</option>${(q.options||[]).map(o => `<option value="${esc(o.label)}" ${getExamAnswer(q.question_id) === o.label ? 'selected' : ''}>${esc(o.label)}. ${esc(o.text)}</option>`).join('')}</select>`
        : `<textarea data-q="${esc(q.question_id)}" data-topic="${esc(q.topic)}" data-format="${esc(q.format)}" placeholder="Resposta discursiva" oninput="setExamAnswer('${esc(q.question_id)}', this.value)" ${isFinished ? 'disabled' : ''}>${esc(getExamAnswer(q.question_id))}</textarea>`}
    </div>`).join('');
  $('#simulado').innerHTML = `
    <div class="split">
      <div class="panel">
        <h2>Simulado atual</h2>
        ${DATA.config?.apps_script_url ? '' : '<div class="notice">Lock/Terminado ficam guardados neste browser ate o Apps Script estar ligado. Ainda nao gravam na Sheet.</div>'}
        <p class="meta">Estado: ${esc(examState.status || e.status || 'novo')} · ${questions.length} perguntas</p>
        <div class="progress"><span class="chip" id="examAnsweredChip">${answered}/${questions.length} respondidas</span><span class="chip" id="examSavedChip">${examState.saved_at ? 'Lock: ' + esc(examState.saved_at) : 'Ainda sem lock'}</span></div>
        ${cards || '<p class="empty">Ainda nao ha simulado gerado.</p>'}
        <div class="actions">
          <button class="btn green" aria-pressed="${isLocked}" onclick="toggleExamLock()" ${isFinished ? 'disabled' : ''}>Lock</button>
          <button class="btn red" aria-pressed="${isFinished}" onclick="toggleExamFinished()" ${isCorrected ? 'disabled' : ''}>Terminado</button>
          <button class="btn" onclick="exportExam()">Exportar fallback</button>
        </div>
      </div>
      <aside class="panel">
        <h3>Proximo simulado</h3>
        <p class="meta">A escolha aplica na proxima geracao.</p>
        <label>Tamanho<br><select id="nextSize">${[5,10,15,25,30].map(n => `<option ${n===(DATA.config?.next_simulado_size||5)?'selected':''}>${n}</option>`).join('')}</select></label>
        <div class="actions"><button class="btn" onclick="postAction('exam_preferences',{size:Number($('#nextSize').value)})">Guardar pedido</button></div>
      </aside>
    </div>`;
}

function resetExamLocalStateIfNeeded(){
  const simuladoId = DATA.current_exam?.simulado_id;
  if (localState.currentExam?.simulado_id !== simuladoId){
    localState.currentExam = {simulado_id: simuladoId, status: DATA.current_exam?.status || 'em_andamento', answers:{}};
    saveLocalState();
  }
  localState.currentExam.answers ||= {};
}

function getExamState(){
  resetExamLocalStateIfNeeded();
  return localState.currentExam;
}

function getExamAnswer(questionId){
  return getExamState().answers?.[questionId] || '';
}

function hasExamAnswer(questionId){
  return String(getExamAnswer(questionId)).trim().length > 0;
}

function setExamAnswer(questionId, value){
  const examState = getExamState();
  if (examState.status === 'terminado') return;
  examState.answers[questionId] = value;
  saveLocalState();
  renderStatus();
  updateExamProgressUI();
}

function updateExamProgressUI(){
  const questions = DATA.current_exam?.questions || [];
  const answered = questions.filter(q => hasExamAnswer(q.question_id)).length;
  const answeredChip = $('#examAnsweredChip');
  const savedChip = $('#examSavedChip');
  if (answeredChip) answeredChip.textContent = `${answered}/${questions.length} respondidas`;
  if (savedChip) savedChip.textContent = getExamState().saved_at ? `Lock: ${getExamState().saved_at}` : 'Ainda sem lock';
}

function collectExamAnswers(){
  return Array.from(document.querySelectorAll('#simulado [data-q]')).map(el => ({
    question_id: el.dataset.q,
    topic: el.dataset.topic || '',
    format: el.dataset.format || '',
    answer: getExamAnswer(el.dataset.q),
    selected_option: el.tagName === 'SELECT' ? getExamAnswer(el.dataset.q) : '',
    response_text: el.tagName === 'TEXTAREA' ? getExamAnswer(el.dataset.q) : '',
    answered_at: getExamAnswer(el.dataset.q) ? new Date().toISOString() : ''
  }));
}

function toggleExamLock(){
  const examState = getExamState();
  if (examState.saved_at){
    examState.saved_at = '';
    saveLocalState();
    postAction('exam_unlock',{simulado_id:DATA.current_exam?.simulado_id});
    renderStatus();
    renderExam();
    return;
  }
  examState.saved_at = new Date().toLocaleString('pt-PT');
  saveLocalState();
  postAction('exam_save',{simulado_id:DATA.current_exam?.simulado_id, answers:collectExamAnswers()});
  renderStatus();
  renderExam();
}

function toggleExamFinished(){
  const examState = getExamState();
  if (examState.status === 'terminado' || DATA.current_exam?.status === 'terminado'){
    return reopenExam();
  }
  examState.status = 'terminado';
  examState.saved_at = new Date().toLocaleString('pt-PT');
  saveLocalState();
  postAction('exam_finish',{simulado_id:DATA.current_exam?.simulado_id, answers:collectExamAnswers()});
  renderStatus();
  renderExam();
}

function reopenExam(){
  const examState = getExamState();
  examState.status = 'em_andamento';
  saveLocalState();
  postAction('exam_reopen',{simulado_id:DATA.current_exam?.simulado_id, answers:collectExamAnswers()});
  renderStatus();
  renderExam();
}

async function exportExam(){
  const answers = collectExamAnswers();
  const text = [
    `Estas sao as minhas respostas do simulado TestMe de ${DATA.current_exam?.generated_at || DATA.meta?.date}.`,
    'Corrige-as, atribui nota geral e por topico/formato, comenta respostas discursivas, e prepara a atualizacao do historico de evolucao.',
    '',
    JSON.stringify({simulado:DATA.current_exam, respostas:answers}, null, 2)
  ].join('\\n');
  await navigator.clipboard.writeText(text);
  toast('Texto de exportacao copiado.');
}

function renderCorrection(){
  const c = DATA.recent_correction || {};
  const items = c.items || [];
  $('#correcao').innerHTML = `
    <div class="panel">
      <h2>Correcao recente</h2>
      <p class="meta">Nota: ${esc(c.total_score ?? '-')} / ${esc(c.max_score ?? '-')} · ${esc(c.corrected_at || '')}</p>
      ${items.map((it, idx) => `
        <div class="question-card">
          <div class="row"><span class="chip">${idx+1}</span><span class="chip">${esc(it.topic)}</span><span class="chip">${esc(it.score)}/${esc(it.max_points)}</span></div>
          ${it.stem ? `<details><summary>Pergunta</summary><div class="body"><p>${esc(it.stem)}</p>${(it.options||[]).length ? `<div class="options">${it.options.map(o => `<div class="option"><b>${esc(o.label)}.</b> <span>${esc(o.text)}</span></div>`).join('')}</div>` : ''}</div></details>` : ''}
          <p><b>Resposta do Rafael:</b> ${esc(it.rafael_answer)}</p>
          <p><b>Resposta correta:</b> ${esc(it.correct_answer)}</p>
          <p>${esc(it.llm_comment)}</p>
        </div>`).join('') || '<p class="empty">Ainda nao ha correcao processada.</p>'}
    </div>`;
}

function statBlock(label, percent){
  const width = Math.max(0, Math.min(100, Number(percent || 0)));
  return `<div class="stat"><b>${esc(label)}</b><div class="meta">${width}%</div><div class="bar"><span style="width:${width}%"></span></div></div>`;
}

function renderEvolution(){
  const ev = DATA.evolution || {};
  const topicStats = ev.by_topic || {};
  const formatStats = ev.by_format || {};
  $('#evolucao').innerHTML = `
    <div class="panel">
      <h2>Evolucao</h2>
      <h3>Por topico</h3>
      <div class="stat-grid">${Object.entries(topicStats).map(([k,v]) => statBlock(k, v.percent)).join('') || '<p class="empty">Sem dados.</p>'}</div>
      <h3 style="margin-top:18px">Por formato</h3>
      <div class="stat-grid">${Object.entries(formatStats).map(([k,v]) => statBlock(k, v.percent)).join('') || '<p class="empty">Sem dados.</p>'}</div>
    </div>`;
}

document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === btn.dataset.tab));
}));

renderStatus();
renderQuestion();
renderExam();
renderCorrection();
renderEvolution();
</script>
</body>
