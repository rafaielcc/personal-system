  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer}

  .btn.green{background:var(--green);border-color:var(--green);color:white}
  .btn.amber{background:var(--amber);border-color:var(--amber);color:white}
  .btn.red{background:var(--red);border-color:var(--red);color:white}
  .btn.ghost{background:#fbfcfc;color:var(--muted)}

  details{border:1px solid var(--line);border-radius:8px;background:#fbfcfc;margin-top:12px}

  textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;background:white}
  select,input[type="number"]{border:1px solid var(--line);border-radius:8px;padding:8px;background:white}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .stat{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fbfcfc}
  .bar{height:8px;background:#e7eaeb;border-radius:99px;overflow:hidden;margin-top:8px}
  .bar span{display:block;height:100%;background:var(--blue);width:0}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1e2428;color:white;padding:10px 13px;border-radius:8px;font-size:13px;display:none}
  .empty{color:var(--muted);font-style:italic}
  .notice{border:1px solid #ead39c;background:#fff8e8;color:#6f4b0c;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45;margin-bottom:12px}
  .danger-note{border:1px solid #efc4c0;background:#fff2f0;color:#7f2922;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45;margin:10px 0}
  @media (max-width:760px){

    .status{justify-content:flex-start;margin-top:10px}
    .split{grid-template-columns:1fr}

<script id="testme-data" type="application/json">{"meta":{"module":"testme","date":"2026-09-14","generated_at":"2026-09-14T16:42:13+01:00","mode":"atualizar_testme","sheet_id":"1umzy0T45iQlN2Fv52OV73PzRpWmgF5GWHUUMBO0Y7wo","sheet_url":"https://docs.google.com/spreadsheets/d/1umzy0T45iQlN2Fv52OV73PzRpWmgF5GWHUUMBO0Y7wo"},"config":{"apps_script_url":"https://script.google.com/macros/s/AKfycbxVh9Ar5JKzm58MX10LXS2FOvmiWwyzSgoWXupgdh__0j0ymGBX7QT8QxufMUxVdSAJ3A/exec","default_simulado_size":5,"next_simulado_size":5,"next_simulado_topics":[]},"current_question":{"question_id":"q_20260914_001","status":"ativa","generated_at":"2026-09-14T16:42:13+01:00","topic":"Oncologia","format":"mcq","difficulty":"assistente_graduado","stem":"Crianca de 18 meses com neuroblastoma abdominal paravertebral, catecolaminas urinarias elevadas, MIBG positivo e imagem com envolvimento circunferencial parcial da arteria mesenterica superior, mas sem compromisso intestinal ou instabilidade. A familia pergunta se a melhor opcao e retirar ja toda a massa para evitar progressao. Qual resposta e mais adequada?","options":[{"label":"A","text":"Programar resseccao completa upfront, porque a positividade no MIBG confirma o diagnostico e elimina necessidade de biopsia/estratificacao."},{"label":"B","text":"Evitar resseccao primaria agressiva perante IDRF vascular; obter tecido com seguranca, completar estadiamento/biologia e decidir tratamento inicial em equipa multidisciplinar."},{"label":"C","text":"Iniciar quimioterapia sem biopsia, porque qualquer manipulacao tumoral abdominal aumenta risco de rotura e nao altera o grupo terapeutico."},{"label":"D","text":"Fazer apenas vigilancia seriada, porque a ausencia de compromisso intestinal torna o envolvimento vascular um achado sem impacto no timing terapeutico."}],"correct_answer":"B","explanation":"O envolvimento vascular definido como IDRF muda o risco cirurgico. A melhor conduta e confirmar histologia/biologia de forma segura, completar estadiamento e discutir risco em oncologia, cirurgia, radiologia e anestesia. Resseccao upfront pode ser morbilizante; quimioterapia sem tecido so e excecional; vigilancia isolada ignora o risco oncologico e anatomico.","source_type":"generated_practice","source_ref":"atualizar_testme_20260914_run1"},"question_bank_summary":{"total_saved":3,"by_topic":{"Upper GI":1,"Trauma":1,"Neonatologia":1},"by_format":{"mcq":2,"discursiva":1}},"current_exam":{"simulado_id":"sim_20260914_001","status":"em_andamento","generated_at":"2026-09-14T16:42:13+01:00","size":5,"requested_topics":[],"format_mix":{"mcq":3,"discursiva":2},"questions":[{"question_id":"sim_20260914_q001","topic":"Neonatologia","format":"mcq","difficulty":"assistente_graduado","stem":"RN de termo com obstrucao intestinal baixa, microcolon no enema contrastado e calcificacoes peritoneais subtis na radiografia. Ao nascer teve distensao progressiva, mas esta hemodinamicamente estavel. Qual interpretacao/conduta inicial e mais defensavel?","options":[{"label":"A","text":"Assumir ileo meconial simples e tratar apenas com enemas hiperosmolares repetidos, independentemente das calcificacoes."},{"label":"B","text":"Integrar a possibilidade de perfuracao antenatal/meconio peritonite e ileo meconial complicado; estabilizar, avaliar fibrose quistica e decidir entre contraste terapeutico cauteloso e exploracao conforme sinais de complicacao."},{"label":"C","text":"Fazer colostomia esquerda como tratamento padrao, porque microcolon exclui patologia ileal."},{"label":"D","text":"Aguardar eliminacao espontanea de meconio por 72 horas se nao houver pneumoperitoneu."}],"correct_answer":"B","explanation":"Microcolon sugere obstrucao distal/ileal nao utilizada; calcificacoes levantam perfuracao antenatal/meconio peritonite. Em doente estavel pode haver papel para contraste terapeutico cauteloso se nao houver complicacao, mas a avaliacao de fibrose quistica e o limiar para cirurgia dependem de perfuracao, volvo, atresia, peritonite ou falha de tratamento."},{"question_id":"sim_20260914_q002","topic":"Urologia","format":"mcq","difficulty":"assistente_graduado","stem":"Menina de 7 anos com duplicidade pieloureteral, ureterocelo ectopico previamente incisado no periodo neonatal, infeccoes febris recorrentes e funcao diferencial reduzida do polo superior. Ha refluxo para o polo inferior ipsilateral. Qual estrategia e mais apropriada para planear cirurgia definitiva?","options":[{"label":"A","text":"Reimplante ureteral simples do ureter do polo inferior, ignorando o remanescente do ureterocelo se a drenagem inicial foi feita."},{"label":"B","text":"Decidir com base em funcao segmentar, refluxo, anatomia vesical/colo e infeccoes; opcoes incluem heminefrectomia/polo superior, reconstrucao baixa ou combinada conforme anatomia e funcao."},{"label":"C","text":"Nefrectomia total ipsilateral obrigatoria, porque ureterocelo ectopico inviabiliza sempre o rim duplicado."},{"label":"D","text":"Profilaxia antibiotica vitalicia como tratamento definitivo se a creatinina global for normal."}],"correct_answer":"B","explanation":"A conduta em ureterocelo ectopico pos-incisao depende de funcao do moiety, refluxo novo/persistente, anatomia ureteral e vesical, infeccoes e objetivos de preservacao renal. Nenhuma opcao unica serve para todos; tanto cirurgia alta como reconstrucao baixa podem ser adequadas."},{"question_id":"sim_20260914_q003","topic":"Trauma","format":"mcq","difficulty":"assistente_graduado","stem":"Adolescente apos traumatismo abdominal fechado tem dor epigastrica persistente, amilase/lipase moderadamente elevadas e TC inicial sem transeccao pancreatica clara. A dor piora e surge colecao crescente junto ao corpo pancreatico 48 horas depois. Qual proximo passo e mais defensavel?","options":[{"label":"A","text":"Alta se estiver hemodinamicamente estavel, porque a TC inicial excluiu lesao ductal."},{"label":"B","text":"Repetir avaliacao dirigida ao ducto pancreatico com MRCP/ERCP conforme recursos e discutir abordagem conservadora, endoscopica ou cirurgica em centro experiente."},{"label":"C","text":"Duodenopancreatectomia precoce para evitar pseudocisto em qualquer lesao do corpo pancreatico."},{"label":"D","text":"Drenar percutaneamente toda colecao antes de esclarecer se ha lesao ductal principal."}],"correct_answer":"B","explanation":"A lesao ductal pode ser subestimada na TC inicial. Piora clinica e colecao crescente justificam reavaliacao do ducto e decisao multidisciplinar. Drenagem pode ser util em situacoes selecionadas, mas sem definir o ducto pode falhar; cirurgia radical e excecional."},{"question_id":"sim_20260914_q004","topic":"Torax","format":"discursiva","difficulty":"assistente_graduado","stem":"RN com hernia diafragmatica congenita esquerda, hipertensao pulmonar grave em estabilizacao lenta e necessidade de vasodilatador pulmonar. Discute criterios praticos para decidir timing de reparacao e como prepararias a cirurgia/anestesia.","options":[],"correct_answer":"Resposta esperada: nao operar por urgencia anatomica isolada; aguardar estabilizacao fisiologica com queda de lactato, menor suporte vasoativo/ventilatorio, oxigenacao aceitavel e hipertensao pulmonar controlada; discutir ecocardiografia seriada, estrategia ventilatoria protetora, disponibilidade de UCI neonatal, sangue, anestesia experiente e eventual ECMO/centro de referencia conforme gravidade; planear acesso e tipo de reparo conforme defeito, evitando descompensacao hemodinamica intraoperatoria.","explanation":"A resposta deve mostrar decisao por fisiologia cardiopulmonar, nao por calendario fixo."},{"question_id":"sim_20260914_q005","topic":"Lower GI","format":"discursiva","difficulty":"assistente_graduado","stem":"Crianca com malformacao anorectal alta, colostomia neonatal e suspeita de fistula retouretral. Descreve a avaliacao pre-PSARP e os pontos que mudam a estrategia cirurgica.","options":[],"correct_answer":"Resposta esperada: confirmar anatomia distal com colostograma distal pressurizado de qualidade, avaliar trato urinario por ecografia/cistografia conforme contexto, pesquisar anomalias sacras/vertebrais/medulares e cardiacas, rever tipo/local da colostomia e estado nutricional; definir nivel da fistula, comprimento do pouch, qualidade sacral e continencia potencial; planear PSARP isolado ou abordagem combinada laparoscopica/abdominal conforme fistula alta/prostatica/colo vesical, evitando exploracao sem mapa anatomico adequado.","explanation":"A resposta deve valorizar mapa anatomico e malformacoes associadas antes de escolher abordagem."}]},"recent_correction":{"simulado_id":"sim_20260905_003","corrected_at":"2026-09-14T16:42:13+01:00","total_score":4,"max_score":7,"items":[{"question_id":"sim_20260905c_q001","topic":"Lower GI","format":"mcq","stem":"Lactente de 2 meses com doenca de Hirschsprung confirmada por biopsia, aguardando pull-through, chega com febre, distensao, diarreia explosiva, leucocitose e ansas dilatadas, sem pneumoperitoneu. Qual conduta inicial e mais defensavel?","options":[{"label":"A","text":"Reanimacao, antibiotico de largo espetro e irrigacoes retais/descompressao, escalando para derivacao se deteriorar ou nao responder"},{"label":"B","text":"Loperamida e alimentacao oral fracionada, porque a diarreia e o problema dominante"},{"label":"C","text":"Pull-through definitivo urgente durante o quadro septico para remover a zona aganglionica"},{"label":"D","text":"Enema contrastado antes de qualquer tratamento, para confirmar novamente o nivel de transicao"}],"rafael_answer":"A","correct_answer":"A","score":1,"max_points":1,"llm_comment":"Correta. A resposta reconhece enterocolite associada a Hirschsprung como urgencia clinica e prioriza reanimacao, antibiotico e descompressao/irrigacoes, com derivacao apenas se falha ou deterioracao."},{"question_id":"sim_20260905c_q002","topic":"Trauma","format":"mcq","stem":"Crianca de 10 anos com traumatismo esplenico grau IV, hemodinamicamente estavel apos bolus inicial, Hb em queda lenta e blush arterial pequeno na TC. Esta num hospital com radiologia de intervencao disponivel. Qual estrategia e mais adequada?","options":[{"label":"A","text":"Laparotomia imediata em todo grau IV, independentemente da resposta hemodinamica"},{"label":"B","text":"Alta precoce se estiver sem dor, porque o grau radiologico nao altera vigilancia"},{"label":"C","text":"Manejo nao operatorio em ambiente monitorizado, com limiar baixo para angioembolizacao se sangramento ativo persistir ou necessidade transfusional evoluir"},{"label":"D","text":"Esplenectomia profilatica para evitar pseudocisto e vacinação tardia"}],"rafael_answer":"C","correct_answer":"C","score":1,"max_points":1,"llm_comment":"Correta. Em trauma esplenico pediatrico, a estabilidade hemodinamica permite manejo nao operatorio monitorizado; o blush/queda de Hb justificam vigilancia apertada e eventual angioembolizacao seletiva."},{"question_id":"sim_20260905c_q003","topic":"Hepatobiliar/Pancreatico","format":"mcq","stem":"Lactente com atresia biliar operada por Kasai aos 68 dias, agora com 7 meses, ictericia persistente, episodios repetidos de colangite e sinais iniciais de hipertensao portal. Qual proximo passo e mais defensavel?","options":[{"label":"A","text":"Repetir portoenterostomia para tentar atrasar qualquer discussao de transplante"},{"label":"B","text":"Suspender seguimento se houver algum fluxo biliar, porque a hipertensao portal e esperada e benigna"},{"label":"C","text":"Referenciar precocemente para avaliacao de transplante hepatico, mantendo otimizacao nutricional, controlo de colangite e vigilancia de complicacoes"},{"label":"D","text":"Fazer colecistectomia eletiva como tratamento da colangite recorrente"}],"rafael_answer":"C","correct_answer":"C","score":1,"max_points":1,"llm_comment":"Correta. A persistencia de ictericia, colangites repetidas e hipertensao portal apos Kasai obriga avaliacao precoce para transplante, sem abandonar suporte nutricional e controlo de complicacoes."},{"question_id":"sim_20260905c_q004","topic":"Upper GI","format":"discursiva","stem":"Recem-nascido com atresia esofagica long-gap apos controlo inicial de fistula e gastrostomia, clinicamente estavel. Discute principios para decidir entre preservacao do esofago nativo, anastomose diferida e substituicao esofagica.","options":[],"rafael_answer":"A ideia principal é que nenhum órgão é melhor para sustentar o isófogo do que o próprio isófogo. É por isso que, ultimamente, tem-se sempre a abordagem chamada de \"delay de primary anastomoses\", ou seja, tentar suportar a situação o tempo que for possível para que o isófogo possa crescer e assim tentar a gastroanastomose primária e preservar o esôfago doente.\n\nQuando isso não é possível, pensar, então, nas técnicas de substituição esofágica. Ainda em relação à obstrução, evita-se fazer a gastrostomia, pois isso pode dificultar mais ainda as chances doente ter uma gastroanastomose primária e manutenção do seu esôfago nativo. Quando você faz nesse modo de ferida, tem uma vantagem: o doente não depende mais da respiração contínua, pode até receber altos calores enquanto aguarda a cirurgia. Entretanto, as custas de reduzir as chances de, por exemplo, o isofago, podem evitar a diferença do resto da vida dele.\n\nEnquanto isso, nada disso é possível. Aí sim, pode pensar na técnica de substituição isofágica, idealmente quando o paciente tem um porte físico, em termos de peso e idade, que permita isso, usualmente entre 5 e 10 kg. ","correct_answer":"Resposta esperada: confirmar tipo anatomico e medir gap por estudos contrastados/endoscopia conforme protocolo; manter aspiracao do coto, controlo de refluxo/aspiracao e nutricao por gastrostomia; preferir preservacao do esofago nativo quando viavel; considerar crescimento espontaneo, tracao/alongamento ou anastomose diferida em centro experiente; reconhecer limites de tensao e risco de leak/estenose; reservar substituicao gastrica/colonica/jejunal para quando o esofago nativo nao e recuperavel ou apos falhas, ponderando morbilidade a longo prazo.","score":1,"max_points":2,"llm_comment":"Resposta parcialmente correta. Valorizaste bem a preservacao do esofago nativo e a substituicao como recurso quando a anastomose diferida nao e viavel. Faltou estruturar melhor a avaliacao objetiva do gap, estudos contrastados/endoscopicos, aspiracao do coto, controlo de refluxo/aspiracao, limites de tensao, risco de leak/estenose e decisao em centro experiente. Ha ainda imprecisao importante ao sugerir evitar gastrostomia, quando neste cenario ela ja faz parte do suporte nutricional."},{"question_id":"sim_20260905c_q005","topic":"Urologia","format":"discursiva","stem":"Rapaz com valvas da uretra posterior tratadas no periodo neonatal mantem hidroureteronefrose bilateral, refluxo de alto grau e infeccoes febris, com creatinina estavel mas bexiga trabeculada. Como estruturarias a avaliacao e tratamento antes de indicar cirurgia anti-refluxo?","options":[],"rafael_answer":"","correct_answer":"Resposta esperada: confirmar se ha obstrucao residual/valvas persistentes e avaliar funcao renal diferencial; fazer ecografia seriada, cistografia conforme necessidade e estudo urodinamico; reconhecer que refluxo em bexiga de alta pressao nao se resolve com reimplante isolado; otimizar bexiga com miccao programada/CIC quando indicado, anticolinergico ou outra terapeutica, tratar obstipacao/disfuncao intestinal e profilaxia/controlo de ITU; considerar ampliacao/derivacao em casos selecionados; indicar reimplante apenas apos controlar pressao/compliance e definir objetivo renal/infeccioso.","score":0,"max_points":2,"llm_comment":"Sem resposta registada. A resposta esperada exigia avaliar obstrucao residual, funcao renal diferencial, ecografia/cistografia conforme contexto, estudo urodinamico e tratamento da bexiga de alta pressao antes de pensar em reimplante anti-refluxo."}]},"evolution":{"by_topic":{"Neonatologia":{"percent":100,"answered":1},"Hepatobiliar/Pancreatico":{"percent":100,"answered":2},"Urologia":{"percent":67,"answered":3},"Oncologia":{"percent":31,"answered":2},"Lower GI":{"percent":88,"answered":2},"Upper GI":{"percent":75,"answered":2},"Torax":{"percent":100,"answered":1},"Outros":{"percent":63,"answered":1},"Trauma":{"percent":100,"answered":1}},"by_format":{"mcq":{"percent":100,"answered":9},"discursiva":{"percent":42,"answered":6}},"history":[{"simulado_id":"sim_20260905_001","corrected_at":"2026-09-05T19:12:40+01:00","total_score":5,"max_score":7,"percent":71,"score_by_topic":{"Neonatologia":100,"Hepatobiliar/Pancreatico":100,"Urologia":100,"Oncologia":25,"Lower GI":75},"score_by_format":{"mcq":100,"discursiva":50},"question_count":5,"mcq_count":3,"discursiva_count":2},{"simulado_id":"sim_20260905_002","corrected_at":"2026-09-05T20:45:43+01:00","total_score":5,"max_score":7,"percent":71,"score_by_topic":{"Upper GI":100,"Torax":100,"Urologia":100,"Oncologia":37.5,"Outros":62.5},"score_by_format":{"mcq":100,"discursiva":50},"question_count":5,"mcq_count":3,"discursiva_count":2},{"simulado_id":"sim_20260905_003","corrected_at":"2026-09-14T16:42:13+01:00","total_score":4,"max_score":7,"percent":57,"score_by_topic":{"Lower GI":100.0,"Trauma":100.0,"Hepatobiliar/Pancreatico":100.0,"Upper GI":50.0,"Urologia":0.0},"score_by_format":{"mcq":100.0,"discursiva":25.0},"question_count":5,"mcq_count":3,"discursiva_count":2}]}}</script>
<script>
const DATA = JSON.parse(document.getElementById('testme-data').textContent);
const $ = (sel, root=document) => root.querySelector(sel);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORE_KEY = 'testme:state:v1';

function loadLocalState(){
  try {
    return JSON.parse(localStorage.getItem(STORE_KEY) || '{}');

}

function saveLocalState(){

}

}

  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2600);
}

function speak(text){
  if (!('speechSynthesis' in window)) return toast('Audio indisponivel neste browser.');
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'pt-PT';
  window.speechSynthesis.speak(utterance);
}

async function postAction(type, payload){
  const url = DATA.config?.apps_script_url;
  const body = {type, created_at:new Date().toISOString(), payload};
  if (!url){
    queueLocalAction(body);
    renderStatus();
    toast('Guardado neste browser. Falta ligar o Apps Script para gravar na Sheet.');
    return {queued:true};
  }
  await fetch(url, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(body)});
  toast('Gravado na Sheet.');
  return {posted:true};
}

function renderStatus(){
  const q = DATA.current_question || {};
  const e = DATA.current_exam || {};
  const examState = getExamState();
  $('#statusChips').innerHTML = [
    `Pergunta: ${esc(q.status || 'ativa')}`,
    `Simulado: ${esc(examState.status || e.status || 'novo')}`,
    `Banco: ${esc(DATA.question_bank_summary?.total_saved ?? 0)}`,
    `Por gravar: ${pendingActionCount()}`
  ].map(x => `<span class="chip">${x}</span>`).join('');
}

function pendingActionCount(){
  try {
    return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]').length;
  } catch {
    return 0;
  }
}

function renderQuestion(){
  const q = DATA.current_question;
  if (!q) {
    $('#questoes').innerHTML = '<div class="panel"><p class="empty">Ainda nao ha pergunta ativa.</p></div>';
    return;
  }
  resetQuestionLocalStateIfNeeded();
  const qState = localState.currentQuestion || {};
  const isSaved = !!qState.saved;
  const isSeen = !!qState.seen;
  const wantsNext = !!qState.wants_next;
  const selected = qState.selected_option || '';
  const options = (q.options || []).map(opt => `
    <label class="option ${selected === opt.label ? 'selected' : ''}">
      <input type="radio" name="current_question_answer" value="${esc(opt.label)}" ${selected === opt.label ? 'checked' : ''} onchange="selectCurrentAnswer('${esc(opt.label)}')">
      <span><b>${esc(opt.label)}.</b> ${esc(opt.text)}</span>
    </label>`).join('');
  $('#questoes').innerHTML = `
    <div class="panel">
      ${DATA.config?.apps_script_url ? '' : '<div class="notice">Acoes ficam guardadas neste browser ate o Apps Script estar ligado. Ainda nao gravam na Sheet.</div>'}
      <div class="row">
        <span class="chip">${esc(q.topic)}</span>
        <span class="chip">${q.format === 'mcq' ? 'Escolha multipla' : 'Discursiva'}</span>
        <button class="btn icon" onclick="speak(DATA.current_question.stem)">Ouvir pergunta</button>
      </div>
      <p class="stem">${esc(q.stem)}</p>
      ${q.format === 'mcq' ? `<div class="options">${options}</div>` : `<textarea id="currentDiscursiveAnswer" placeholder="Resposta livre" oninput="selectCurrentAnswer(this.value)">${esc(qState.response_text || '')}</textarea>`}
      <details>
        <summary>Resposta e justificacao</summary>
        <div class="body">
          <div class="row"><button class="btn icon" onclick="speak(DATA.current_question.explanation)">Ouvir resposta</button></div>
          <p><b>Resposta:</b> ${esc(q.correct_answer)}</p>
          <p>${esc(q.explanation)}</p>
        </div>
      </details>
      <div class="actions">
        <button class="btn" aria-pressed="${isSeen}" onclick="markCurrentSeen()">${isSeen ? 'Vista marcada' : 'Vista'}</button>
        <button class="btn green" aria-pressed="${isSaved}" onclick="toggleCurrentSave()">${isSaved ? 'Salva - clicar para retirar' : 'Salvar'}</button>
        <button class="btn amber" aria-pressed="${wantsNext}" onclick="requestNextQuestion()">${wantsNext ? 'Proxima pedida' : 'Pedir proxima pergunta'}</button>
      </div>
      <p class="meta">A proxima pergunta aparece depois de correr <b>Atualizar TestMe</b>.</p>
    </div>`;
}

function resetQuestionLocalStateIfNeeded(){
  const qid = DATA.current_question?.question_id;
  if (localState.currentQuestion?.question_id !== qid){
    localState.currentQuestion = {question_id: qid};
    saveLocalState();
  }
}

function selectCurrentAnswer(value){
  resetQuestionLocalStateIfNeeded();
  const q = DATA.current_question || {};
  if (q.format === 'mcq') localState.currentQuestion.selected_option = value;
  else localState.currentQuestion.response_text = value;
  saveLocalState();
  if (q.format === 'mcq') renderQuestion();
}

function markCurrentSeen(){
  resetQuestionLocalStateIfNeeded();
  localState.currentQuestion.seen = true;
  saveLocalState();
  postAction('question_seen', {
    question_id: DATA.current_question.question_id,
    selected_option: localState.currentQuestion.selected_option || '',
    response_text: localState.currentQuestion.response_text || ''
  });
  renderQuestion();
}

function toggleCurrentSave(){
  resetQuestionLocalStateIfNeeded();
  localState.currentQuestion.saved = !localState.currentQuestion.saved;
  saveLocalState();
  postAction('question_save_toggle', {
    question_id: DATA.current_question.question_id,
    saved: localState.currentQuestion.saved,
    selected_option: localState.currentQuestion.selected_option || '',
    response_text: localState.currentQuestion.response_text || ''
  });
  renderQuestion();
}

function requestNextQuestion(){
  resetQuestionLocalStateIfNeeded();
  localState.currentQuestion.wants_next = true;
  saveLocalState();
  postAction('question_next_requested', {
    question_id: DATA.current_question.question_id,
    selected_option: localState.currentQuestion.selected_option || '',
    response_text: localState.currentQuestion.response_text || ''
  });
  renderQuestion();
}

function renderExam(){
  const e = DATA.current_exam || {};
  const questions = e.questions || [];
  resetExamLocalStateIfNeeded();
  const examState = getExamState();
  const isFinished = examState.status === 'terminado' || e.status === 'terminado' || e.status === 'corrigido';
  const isCorrected = e.status === 'corrigido';
  const isLocked = !!examState.saved_at && examState.status !== 'terminado';
  const finishArmed = !!examState.finish_armed;
  const answered = questions.filter(q => hasExamAnswer(q.question_id)).length;
  const cards = questions.map((q, idx) => `
    <div class="question-card">
      <div class="row"><span class="chip">${idx+1}</span><span class="chip">${esc(q.topic)}</span><span class="chip">${esc(q.format)}</span></div>
      <p>${esc(q.stem)}</p>
      ${q.format === 'mcq'
        ? `<select data-q="${esc(q.question_id)}" data-topic="${esc(q.topic)}" data-format="${esc(q.format)}" onchange="setExamAnswer('${esc(q.question_id)}', this.value)" ${isFinished ? 'disabled' : ''}><option value="">Resposta...</option>${(q.options||[]).map(o => `<option value="${esc(o.label)}" ${getExamAnswer(q.question_id) === o.label ? 'selected' : ''}>${esc(o.label)}. ${esc(o.text)}</option>`).join('')}</select>`
        : `<textarea data-q="${esc(q.question_id)}" data-topic="${esc(q.topic)}" data-format="${esc(q.format)}" placeholder="Resposta discursiva" oninput="setExamAnswer('${esc(q.question_id)}', this.value)" ${isFinished ? 'disabled' : ''}>${esc(getExamAnswer(q.question_id))}</textarea>`}
    </div>`).join('');
  $('#simulado').innerHTML = `
    <div class="split">
      <div class="panel">
        <h2>Simulado atual</h2>
        ${DATA.config?.apps_script_url ? '' : '<div class="notice">Lock/Terminado ficam guardados neste browser ate o Apps Script estar ligado. Ainda nao gravam na Sheet.</div>'}
        <p class="meta">Estado: ${esc(examState.status || e.status || 'novo')} · ${questions.length} perguntas</p>
        <div class="progress"><span class="chip" id="examAnsweredChip">${answered}/${questions.length} respondidas</span><span class="chip" id="examSavedChip">${examState.saved_at ? 'Lock: ' + esc(examState.saved_at) : 'Ainda sem lock'}</span></div>
        ${finishArmed && !isFinished ? '<div class="danger-note">Terminar bloqueia a edicao e sinaliza a correcao na proxima geracao. Clique em <b>Confirmar terminado</b> para gravar, ou cancele.</div>' : ''}
        ${cards || '<p class="empty">Ainda nao ha simulado gerado.</p>'}
        <div class="actions">
          <button class="${isLocked ? 'btn green' : 'btn'}" aria-pressed="${isLocked}" onclick="toggleExamLock()" ${isFinished ? 'disabled' : ''}>Lock</button>
          ${finishArmed && !isFinished
            ? `<button class="btn red" aria-pressed="true" onclick="confirmFinishExam()">Confirmar terminado</button><button class="btn ghost" onclick="cancelFinishExam()">Cancelar</button>`
            : `<button class="btn red" aria-pressed="${isFinished}" onclick="armFinishExam()" ${isFinished || isCorrected ? 'disabled' : ''}>${isFinished ? 'Terminado' : 'Terminado'}</button>`}
          ${isFinished && !isCorrected ? '<button class="btn ghost" onclick="reopenExam()">Desfazer terminado</button>' : ''}
          <button class="btn" onclick="exportExam()">Exportar fallback</button>
        </div>
      </div>
      <aside class="panel">
        <h3>Proximo simulado</h3>
        <p class="meta">A escolha aplica na proxima geracao.</p>
        <label>Tamanho<br><select id="nextSize">${[5,10,15,25,30].map(n => `<option ${n===(DATA.config?.next_simulado_size||5)?'selected':''}>${n}</option>`).join('')}</select></label>
        <div class="actions"><button class="btn" onclick="postAction('exam_preferences',{size:Number($('#nextSize').value)})">Guardar pedido</button></div>
      </aside>
    </div>`;
}

function resetExamLocalStateIfNeeded(){
  const simuladoId = DATA.current_exam?.simulado_id;
  if (localState.currentExam?.simulado_id !== simuladoId){
    localState.currentExam = {simulado_id: simuladoId, status: DATA.current_exam?.status || 'em_andamento', answers:{}};
    saveLocalState();
  }
  localState.currentExam.answers ||= {};
}

function getExamState(){
  resetExamLocalStateIfNeeded();
  return localState.currentExam;
}

function getExamAnswer(questionId){
  return getExamState().answers?.[questionId] || '';
}

function hasExamAnswer(questionId){
  return String(getExamAnswer(questionId)).trim().length > 0;
}

function setExamAnswer(questionId, value){
  const examState = getExamState();
  if (examState.status === 'terminado') return;
  examState.answers[questionId] = value;
  examState.finish_armed = false;
  saveLocalState();
  renderStatus();
  updateExamProgressUI();
}

function updateExamProgressUI(){
  const questions = DATA.current_exam?.questions || [];
  const answered = questions.filter(q => hasExamAnswer(q.question_id)).length;
  const answeredChip = $('#examAnsweredChip');
  const savedChip = $('#examSavedChip');
  if (answeredChip) answeredChip.textContent = `${answered}/${questions.length} respondidas`;
  if (savedChip) savedChip.textContent = getExamState().saved_at ? `Lock: ${getExamState().saved_at}` : 'Ainda sem lock';
}

function collectExamAnswers(){
  return Array.from(document.querySelectorAll('#simulado [data-q]')).map(el => ({
    question_id: el.dataset.q,
    topic: el.dataset.topic || '',
    format: el.dataset.format || '',
    answer: getExamAnswer(el.dataset.q),
    selected_option: el.tagName === 'SELECT' ? getExamAnswer(el.dataset.q) : '',
    response_text: el.tagName === 'TEXTAREA' ? getExamAnswer(el.dataset.q) : '',
    answered_at: getExamAnswer(el.dataset.q) ? new Date().toISOString() : ''
  }));
}

function toggleExamLock(){
  const examState = getExamState();
  if (examState.saved_at){
    examState.saved_at = '';
    examState.finish_armed = false;
    saveLocalState();
    postAction('exam_unlock',{simulado_id:DATA.current_exam?.simulado_id});
    renderStatus();
    renderExam();
    return;
  }
  examState.saved_at = new Date().toLocaleString('pt-PT');
  examState.finish_armed = false;
  saveLocalState();
  postAction('exam_save',{simulado_id:DATA.current_exam?.simulado_id, answers:collectExamAnswers()});
  renderStatus();
  renderExam();
}

function armFinishExam(){
  const examState = getExamState();
  if (examState.status === 'terminado') return;
  examState.finish_armed = true;
  saveLocalState();
  renderExam();
}

function cancelFinishExam(){
  const examState = getExamState();
  examState.finish_armed = false;
  saveLocalState();
  renderExam();
}

function confirmFinishExam(){
  const examState = getExamState();
  if (!examState.finish_armed) return armFinishExam();
  examState.status = 'terminado';
  examState.saved_at = new Date().toLocaleString('pt-PT');
  examState.finish_armed = false;
  saveLocalState();
  postAction('exam_finish',{simulado_id:DATA.current_exam?.simulado_id, answers:collectExamAnswers()});
  renderStatus();
  renderExam();
}

function reopenExam(){
  const examState = getExamState();
  examState.status = 'em_andamento';
  examState.finish_armed = false;
  saveLocalState();
  postAction('exam_reopen',{simulado_id:DATA.current_exam?.simulado_id, answers:collectExamAnswers()});
  renderStatus();
  renderExam();
}

async function exportExam(){
  const answers = collectExamAnswers();
  const text = [
    `Estas sao as minhas respostas do simulado TestMe de ${DATA.current_exam?.generated_at || DATA.meta?.date}.`,
    'Corrige-as, atribui nota geral e por topico/formato, comenta respostas discursivas, e prepara a atualizacao do historico de evolucao.',
    '',
    JSON.stringify({simulado:DATA.current_exam, respostas:answers}, null, 2)
  ].join('\\n');
  await navigator.clipboard.writeText(text);
  toast('Texto de exportacao copiado.');
}

function renderCorrection(){
  const c = DATA.recent_correction || {};
  const items = c.items || [];
  $('#correcao').innerHTML = `
    <div class="panel">
      <h2>Correcao recente</h2>
      <p class="meta">Nota: ${esc(c.total_score ?? '-')} / ${esc(c.max_score ?? '-')} · ${esc(c.corrected_at || '')}</p>
      ${items.map((it, idx) => `
        <div class="question-card">
          <div class="row"><span class="chip">${idx+1}</span><span class="chip">${esc(it.topic)}</span><span class="chip">${esc(it.score)}/${esc(it.max_points)}</span></div>
          ${it.stem ? `<details><summary>Pergunta</summary><div class="body"><p>${esc(it.stem)}</p>${(it.options||[]).length ? `<div class="options">${it.options.map(o => `<div class="option"><b>${esc(o.label)}.</b> <span>${esc(o.text)}</span></div>`).join('')}</div>` : ''}</div></details>` : ''}
          <p><b>Resposta do Rafael:</b> ${esc(it.rafael_answer)}</p>
          <p><b>Resposta correta:</b> ${esc(it.correct_answer)}</p>
          <p>${esc(it.llm_comment)}</p>
        </div>`).join('') || '<p class="empty">Ainda nao ha correcao processada.</p>'}
    </div>`;
}

function statBlock(label, percent){
  const width = Math.max(0, Math.min(100, Number(percent || 0)));
  return `<div class="stat"><b>${esc(label)}</b><div class="meta">${width}%</div><div class="bar"><span style="width:${width}%"></span></div></div>`;
}

function renderEvolution(){
  const ev = DATA.evolution || {};
  const topicStats = ev.by_topic || {};
  const formatStats = ev.by_format || {};
  $('#evolucao').innerHTML = `
    <div class="panel">
      <h2>Evolucao</h2>
      <h3>Por topico</h3>
      <div class="stat-grid">${Object.entries(topicStats).map(([k,v]) => statBlock(k, v.percent)).join('') || '<p class="empty">Sem dados.</p>'}</div>
      <h3 style="margin-top:18px">Por formato</h3>
      <div class="stat-grid">${Object.entries(formatStats).map(([k,v]) => statBlock(k, v.percent)).join('') || '<p class="empty">Sem dados.</p>'}</div>
    </div>`;
}

document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === btn.dataset.tab));
}));

renderStatus();
renderQuestion();
renderExam();
renderCorrection();
renderEvolution();
</script>
</body>
</html>
